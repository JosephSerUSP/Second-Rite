name: fix-cortico-bounded-lane-baseline

on:
  push:
    branches:
      - fix-cortico-bounded-lane-baseline
    paths:
      - .github/workflows/fix-cortico-bounded-lane-baseline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cortico-bounded-lane-baseline
      - name: Update stale bounded-lane floor assertion
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/-- The town stands on ONE floor now\..*?-- it no longer depends on the town disagreeing with itself\./-- Town lanes share z=0 as their base groundZ, but a lane may layer\n-- generator-owned vertical terrain over that base. Cortico does this through\n-- groundProfile, so the player must land on the destination\x27s effective floor\n-- at its spawn Y rather than blindly on groundZ.\n--\n-- The guarantee the old two-convention crossing existed to protect still holds:\n-- a transit re-derives height from the DESTINATION./s' tests/test_bounded_lane.lua
          perl -0pi -e 's/check\(math\.abs\(game\.townTraversal\.z\) < 0\.001,/check(math.abs(game.townTraversal.z - lane.groundAt(game, game.townTraversal.y)) < 0.001,/' tests/test_bounded_lane.lua
          perl -0pi -e 's/"map " \.\. screen \.\. " puts the player on that floor"/"map " .. screen .. " puts the player on its authored floor"/' tests/test_bounded_lane.lua
          grep -F 'lane.groundAt(game, game.townTraversal.y)' tests/test_bounded_lane.lua
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-cortico-bounded-lane-baseline.yml
          git add tests/test_bounded_lane.lua
          git commit -m "test: align bounded lane floor assertion with Cortico terrain"
          git push origin HEAD:fix-cortico-bounded-lane-baseline
