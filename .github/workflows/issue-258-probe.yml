name: issue-258 Electron Windows layout probe

on:
  pull_request:
    paths:
      - '.github/workflows/issue-258-probe.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        shell: pwsh
        run: npm ci
      - name: Inspect installed Electron distribution and resource patching
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'node_modules/electron/dist').Path
          $exe = Join-Path $dist 'electron.exe'
          if (-not (Test-Path $exe)) { throw "electron.exe not found under $dist" }

          $electronVersion = node -p "require('electron/package.json').version"
          $before = (Get-Item $exe).VersionInfo
          $entries = Get-ChildItem -LiteralPath $dist -Force |
            Sort-Object Name |
            ForEach-Object {
              $kind = if ($_.PSIsContainer) { 'dir' } else { 'file' }
              "- ``$($_.Name)`` ($kind)"
            }

          $rcedit = Join-Path $env:RUNNER_TEMP 'rcedit-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile $rcedit
          $rceditSha = (Get-FileHash $rcedit -Algorithm SHA256).Hash.ToLowerInvariant()

          $patched = Join-Path $env:RUNNER_TEMP 'Thestra Studio.exe'
          Copy-Item -LiteralPath $exe -Destination $patched -Force
          $icon = (Resolve-Path 'tools/editor/Assets/icons/thestra-studio/icon.ico').Path
          & $rcedit $patched `
            --set-icon $icon `
            --set-version-string ProductName 'Thestra Studio' `
            --set-version-string FileDescription 'Thestra Studio Development Host' `
            --set-version-string InternalName 'Thestra Studio' `
            --set-version-string OriginalFilename 'Thestra Studio.exe' `
            --set-version-string CompanyName 'JosephSerUSP' `
            --set-product-version '1.0.0' `
            --set-file-version '1.0.0'
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed with exit $LASTEXITCODE" }
          $after = (Get-Item $patched).VersionInfo

          $report = @(
            '## #258 Electron Windows layout / patch probe',
            '',
            "- Installed Electron: ``$electronVersion``",
            "- Dist path: ``node_modules/electron/dist``",
            "- Host executable exists: ``electron.exe``",
            "- Electron ProductName: ``$($before.ProductName)``",
            "- Electron FileDescription: ``$($before.FileDescription)``",
            "- Electron FileVersion: ``$($before.FileVersion)``",
            "- Electron ProductVersion: ``$($before.ProductVersion)``",
            "- rcedit release: ``v2.0.0``",
            "- rcedit-x64.exe SHA-256: ``$rceditSha``",
            "- patched ProductName: ``$($after.ProductName)``",
            "- patched FileDescription: ``$($after.FileDescription)``",
            "- patched OriginalFilename: ``$($after.OriginalFilename)``",
            "- patched FileVersion: ``$($after.FileVersion)``",
            "- patched ProductVersion: ``$($after.ProductVersion)``",
            '',
            'Top-level distribution entries:',
            ''
          ) + $entries

          $report -join "`n" | Set-Content -Path "$env:RUNNER_TEMP/issue-258-probe.md" -Encoding utf8
          Get-Content "$env:RUNNER_TEMP/issue-258-probe.md"
      - name: Publish probe result on the draft PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/issue-258-probe.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
