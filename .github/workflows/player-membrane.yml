name: player membrane

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-membrane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LÖVE
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb
          love --version
      - name: Run dedicated #375 suite
        run: |
          cp main.lua "$RUNNER_TEMP/main.lua"
          cat > main.lua <<'LUA'
          function love.load()
              local loader = require("data.loader")
              loader.init()
              local ok, err = pcall(dofile, "tests/test_player_membrane.lua")
              if not ok then
                  io.stderr:write("test_player_membrane CRASH: " .. tostring(err) .. "\n")
                  os.exit(1)
              end
              os.exit(0)
          end
          LUA
          xvfb-run -a love .
