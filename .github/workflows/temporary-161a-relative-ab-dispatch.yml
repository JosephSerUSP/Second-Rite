name: Temporary #161A relative A/B dispatch

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-161a-relative-ab-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current-main vs prepared-map refresh
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'relative-golden-ab.yml',
              ref: 'main',
              inputs: {
                gate: 'all',
                base_ref: '2b05a1116460643821bf8e17a7e1ecc44aafb2f7',
                candidate_ref: '52d2d52448894d12b8a71e4064bca956543c30aa'
              }
            });
