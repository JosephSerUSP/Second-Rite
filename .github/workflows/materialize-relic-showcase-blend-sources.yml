name: materialize relic showcase Blender sources

on:
  workflow_dispatch:
  push:
    branches: [agent/relic-showcase-blend-content]
    paths:
      - .github/workflows/materialize-relic-showcase-blend-sources.yml
      - tools/blender/bootstrap_relic_showcase_blend_sources.py
      - tools/blender/run_bootstrap_relic_showcase_blend_sources.py
      - tools/blender/relic-showcase-blend-items.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relic-showcase-blend-content
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render current canonical relics
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-current.png
          image=$(find "$HOME" -type f -name relic-current.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-current.png

      - name: Restore PR 571 showcase products as design reference
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin agent/relic-showcase-items:refs/remotes/origin/agent/relic-showcase-items
          for item in black_hinge chrysalis_sigil qilin_bell vial_of_second_breath meteorite_plate philosophers_stone; do
            git checkout origin/agent/relic-showcase-items -- "assets/models/items/$item.obj" "assets/models/items/$item.mtl"
          done

      - name: Render PR 571 design reference
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-pr571.png
          image=$(find "$HOME" -type f -name relic-pr571.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-pr571.png

      - name: Materialize editable Blender source documents
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a "$BLENDER_BIN" --background --python tools/blender/run_bootstrap_relic_showcase_blend_sources.py
          for item in black_hinge chrysalis_sigil qilin_bell vial_of_second_breath meteorite_plate philosophers_stone; do
            test -s "assets/authoring/items/$item.blend"
          done
          rm -f assets/authoring/items/*.blend1 assets/authoring/items/*.blend2

      - name: Compile authoritative sources and validate runtime corpus
        shell: bash
        run: |
          set -euxo pipefail
          for item in black_hinge chrysalis_sigil qilin_bell vial_of_second_breath meteorite_plate philosophers_stone; do
            xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source "assets/authoring/items/$item.blend"
          done
          python tools/asset-production/check_item_models.py

      - name: Prove full Blender source corpus is read-only and reproducible
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/*.blend > /tmp/relic-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/*.blend > /tmp/relic-source-after.sha256
          diff -u /tmp/relic-source-before.sha256 /tmp/relic-source-after.sha256

      - name: Render Blender-authored relics through real item viewer
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-blender.png
          image=$(find "$HOME" -type f -name relic-blender.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-blender.png

      - uses: actions/upload-artifact@v4
        with:
          name: relic-showcase-blender-source-review
          path: |
            /tmp/relic-current.png
            /tmp/relic-pr571.png
            /tmp/relic-blender.png
          if-no-files-found: error

      - name: Commit authoritative source documents and runtime products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for item in black_hinge chrysalis_sigil qilin_bell vial_of_second_breath meteorite_plate philosophers_stone; do
            git add "assets/authoring/items/$item.blend" "assets/models/items/$item.obj" "assets/models/items/$item.mtl"
          done
          if git diff --cached --quiet; then
            echo "Relic sources already materialized."
          else
            git commit -m "Materialize editable relic showcase sources"
            git push origin HEAD:agent/relic-showcase-blend-content
          fi
