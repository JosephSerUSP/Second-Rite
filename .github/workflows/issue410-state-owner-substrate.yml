name: issue410-state-owner-substrate

on:
  push:
    branches:
      - issue-410-state-owner-substrate

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-410-state-owner-substrate
          fetch-depth: 0
      - name: Apply owner-aware state substrate
        run: python3 tools/issue410_apply.py
      - name: Static checks
        run: |
          python3 -m json.tool rtp/revisions/1.0/data/engine.json >/dev/null
          node --check studio/editor/js/events.js
          git diff --check
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine/formula.lua runtime/engine/interpreter.lua runtime/engine/scene_host.lua runtime/engine/validator_rules.lua rtp/revisions/1.0/data/engine.json studio/editor/js/events.js tests/test_game_variables.lua
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "feat: separate Scene state from process locals (#410)"
          git push origin HEAD:issue-410-state-owner-substrate
