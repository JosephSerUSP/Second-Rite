name: agent 407 apply final patch

on:
  push:
    branches:
      - agent/407-persistent-game-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decode and apply locally verified patch
        shell: bash
        run: |
          set -euo pipefail
          echo "704875d68b7159730200be2aca1a6b937b696418fdceebf01a9985a62e93c351  .agent/issue407-final.patch.b64.00" > "$RUNNER_TEMP/chunks.sha256"
          echo "ea01527366aa8e44e9abb2b5d13266cd9c1e2a6c45744f2303ca8615c9e0c585  .agent/issue407-final.patch.b64.01" >> "$RUNNER_TEMP/chunks.sha256"
          echo "efafd4e2e2d94482ddfb0d6b8caa036c73a5d450305a5ab9b978988feb296250  .agent/issue407-final.patch.b64.02" >> "$RUNNER_TEMP/chunks.sha256"
          echo "98b5744eb51282a26b7b9c7272617f9cd9847eb030e570ce6b53dc9468b553c6  .agent/issue407-final.patch.b64.03" >> "$RUNNER_TEMP/chunks.sha256"
          sha256sum --check "$RUNNER_TEMP/chunks.sha256"
          cat .agent/issue407-final.patch.b64.00 \
              .agent/issue407-final.patch.b64.01 \
              .agent/issue407-final.patch.b64.02 \
              .agent/issue407-final.patch.b64.03 \
            | base64 -d > "$RUNNER_TEMP/issue407.patch"
          echo "1e18a7db398ab76ef6a364649020cbcd07909645cbc052cb53a6d7b874252bef  $RUNNER_TEMP/issue407.patch" | sha256sum --check -
          git apply --check "$RUNNER_TEMP/issue407.patch"
          git apply "$RUNNER_TEMP/issue407.patch"
          rm -f .agent/issue407-final.patch.b64*
          rm -f .github/workflows/agent-407-apply.yml
          git config user.name "OpenAI Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply persistent Game Variable authoring substrate"
          git push origin HEAD:agent/407-persistent-game-state
