name: Apply issue 199 render-surface patch

on:
  push:
    branches:
      - agent/issue-199-expanded-render-surface
    paths:
      - tools/issue199_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-199-expanded-render-surface
          fetch-depth: 0
      - name: Apply focused patch
        run: python tools/issue199_patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement expanded render surfaces"
          git push origin HEAD:agent/issue-199-expanded-render-surface
