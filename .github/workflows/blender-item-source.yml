name: blender item source

on:
  pull_request:
    paths:
      - projects/hichaukitoden-game/assets/authoring/items/**
      - projects/hichaukitoden-game/assets/models/items/**
      - tools/blender/**
      - tools/asset-production/**
      - tools/shared/project_paths.py
      - tools/semantic-roots.js
      - tools/asset-language/contract.json
      - tools/asset-language/materials.json
      - .gitattributes
      - docs/asset-pipeline/BLENDER_CORE.md
      - .github/workflows/blender-item-source.yml
      - .github/actions/install-blender/**
  push:
    branches: [main]
    paths:
      - projects/hichaukitoden-game/assets/authoring/items/**
      - projects/hichaukitoden-game/assets/models/items/**
      - tools/blender/**
      - tools/asset-production/**
      - tools/shared/project_paths.py
      - tools/semantic-roots.js
      - tools/asset-language/contract.json
      - tools/asset-language/materials.json
      - .gitattributes
      - docs/asset-pipeline/BLENDER_CORE.md
      - .github/workflows/blender-item-source.yml
      - .github/actions/install-blender/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  item-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install host test dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Install headless Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgbm1 xvfb xauth

      - name: Install pinned Blender
        # Version, URL and digest live in tools/blender/blender-pin.json (#1254).
        uses: ./.github/actions/install-blender

      - name: Require Blender integration prerequisites
        run: |
          python tools/blender/blender_locator.py
          echo "BLENDER_TESTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Full Blender suite (required integrations)
        run: xvfb-run -a python -m unittest discover -s tools/blender/tests -v

      - name: First Stratum prop states through the real builder
        run: xvfb-run -a python tools/asset-production/build_world_prop.py first_stratum_treasure_chest --out-dir "$RUNNER_TEMP/asset-production-world-props"

      - name: Curated assets are portable without network access
        run: xvfb-run -a python tools/blender/vendor_assets.py check

      - name: Smoke a real saved Blend through the production compiler
        shell: bash
        run: |
          set -euxo pipefail
          fixture=projects/hichaukitoden-game/assets/authoring/items/ci_item_source_fixture.blend
          output=/tmp/second-rite-item-source-fixture
          rm -f "$fixture" "$fixture"[0-9]*
          rm -rf "$output"
          xvfb-run -a "$BLENDER_EXECUTABLE" --background --python-exit-code 1 --python tools/blender/tests/create_item_source_fixture.py
          sha256sum "$fixture" > /tmp/item-fixture-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py \
            --source "$fixture" \
            --output-dir "$output"
          sha256sum "$fixture" > /tmp/item-fixture-after.sha256
          diff -u /tmp/item-fixture-before.sha256 /tmp/item-fixture-after.sha256
          test -s "$output/ci_item_source_fixture.obj"
          test -s "$output/ci_item_source_fixture.mtl"
          rm -f "$fixture" "$fixture"[0-9]*
          git diff --exit-code -- projects/hichaukitoden-game/assets/authoring/items

      # Temporary PR #1400 fabrication bridge. The script and this hook are
      # removed after the resulting first-save .blend documents are committed.
      - name: Bootstrap PR 1400 consumable Blender sources
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/rework-consumables-2026-10-05'
        shell: bash
        run: |
          set -euxo pipefail
          src=projects/hichaukitoden-game/assets/authoring/items
          out="$RUNNER_TEMP/pr1400-consumable-source-bootstrap"
          rm -rf "$out"
          mkdir -p "$out/sources" "$out/runtime"

          xvfb-run -a "$BLENDER_EXECUTABLE" --background --python-exit-code 1 \
            --python tools/blender/bootstrap_consumable_sources_pr1400.py

          for item in potion hi_potion x_potion mega_potion healing_water ether; do
            cp "$src/$item.blend" "$out/sources/$item.blend"
            xvfb-run -a python tools/blender/compile_item_blends.py \
              --source "$src/$item.blend" \
              --output-dir "$out/runtime"
          done

          sha256sum "$out"/sources/*.blend "$out"/runtime/* > "$out/SHA256SUMS"
          rm -f \
            "$src/potion.blend" "$src/hi_potion.blend" "$src/x_potion.blend" \
            "$src/mega_potion.blend" "$src/healing_water.blend" "$src/ether.blend"
          rm -f \
            "$src/potion.blend"[0-9]* "$src/hi_potion.blend"[0-9]* "$src/x_potion.blend"[0-9]* \
            "$src/mega_potion.blend"[0-9]* "$src/healing_water.blend"[0-9]* "$src/ether.blend"[0-9]*
          git diff --exit-code -- projects/hichaukitoden-game/assets/authoring/items

      - name: Upload PR 1400 consumable source bootstrap
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/rework-consumables-2026-10-05'
        uses: actions/upload-artifact@v4
        with:
          name: pr1400-consumable-source-bootstrap
          path: ${{ runner.temp }}/pr1400-consumable-source-bootstrap
          if-no-files-found: error
          retention-days: 1

      - name: Compile committed sources read-only and compare runtime products
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python tools/blender/compile_item_blends.py --check
          git diff --exit-code -- projects/hichaukitoden-game/assets/authoring/items
