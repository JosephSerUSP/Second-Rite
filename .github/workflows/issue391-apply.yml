name: issue391 apply

on:
  push:
    branches: [agent/385-thestra-rtp-authored-layer-current]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/385-thestra-rtp-authored-layer-current
      - name: Apply bounded issue 391 source edits
        run: python tmp/issue391-patch.txt
      - name: Commit bounded source edits
        shell: bash
        run: |
          rm -f tmp/issue391-patch.txt .github/workflows/issue391-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "studio: establish neutral RTP preview baseline"
          git push origin HEAD:agent/385-thestra-rtp-authored-layer-current
