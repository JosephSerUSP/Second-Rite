name: Issue 291 final verify
on:
  push:
    branches: [agent/issue-291-visibility-profiles]
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LOVE_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
      LOVE_SHA256: BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
      MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adapt profile assertions to rich role stats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_map_geometry_export.lua')
          text = path.read_text(encoding='utf-8')
          old = '''    check((playRoles.ceiling or 0) > 0 and (authoringRoles.ceiling or 0) == 0,
                  "roofed real map emits gameplay ceilings but no authoring ceilings")
              check((playRoles["wall-top"] or 0) == 0 and (authoringRoles["wall-top"] or 0) > 0,
                  "real authoring bundle receives readable wall top caps absent from play")'''
          new = '''    check((playRoles.ceiling and playRoles.ceiling.surfaceCount or 0) > 0
                  and (authoringRoles.ceiling and authoringRoles.ceiling.surfaceCount or 0) == 0,
                  "roofed real map emits gameplay ceilings but no authoring ceilings")
              check((playRoles["wall-top"] and playRoles["wall-top"].surfaceCount or 0) == 0
                  and (authoringRoles["wall-top"] and authoringRoles["wall-top"].surfaceCount or 0) > 0,
                  "real authoring bundle receives readable wall top caps absent from play")'''
          if old not in text:
              if new in text:
                  print('rich role-stat assertions already present')
                  raise SystemExit(0)
              raise SystemExit('expected #291 role-stat assertion block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- tests/test_map_geometry_export.lua; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_map_geometry_export.lua
          git commit -m "test: read rich surface-role stats in geometry profiles"
          git push origin HEAD:agent/issue-291-visibility-profiles
      - name: Install pinned LOVE and Mesa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveZip = Join-Path $env:RUNNER_TEMP 'love.zip'
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $loveZip
          if ((Get-FileHash $loveZip -Algorithm SHA256).Hash -ne $env:LOVE_SHA256) { throw 'LOVE digest mismatch' }
          $loveRoot = Join-Path $env:RUNNER_TEMP 'love'
          Expand-Archive $loveZip $loveRoot -Force
          $love = Get-ChildItem $loveRoot -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love) { throw 'lovec.exe not found' }
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $mesaArchive
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash -ne $env:MESA_SHA256) { throw 'Mesa digest mismatch' }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesaRoot -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 opengl32.dll not found' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') $love.DirectoryName -Force
          "LOVEC=$($love.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: G1 validate
        shell: pwsh
        run: |
          & $env:LOVEC . validate
          if ($LASTEXITCODE -ne 0) { throw 'G1 failed' }
      - name: Full unit suite
        shell: pwsh
        run: |
          & $env:LOVEC . unittest
          if ($LASTEXITCODE -ne 0) { throw 'unit tests failed' }
