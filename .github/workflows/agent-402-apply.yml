name: agent 402 apply

on:
  push:
    branches:
      - agent/402-sprite-timing-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact provenance migration
        run: |
          python tools/ci/_agent_402_apply.py
          node --check tools/editor/server.js
          node --check tools/editor/js/widgets.js
          node tools/editor/test-sprite-timing-provenance.js
          git diff --check
      - name: Commit result and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/sprite_sheet.lua tests/test_sprite_sheet.lua engine/cli_tools.lua main.lua tools/editor/server.js tools/editor/js/widgets.js tools/editor/test-sprite-timing-provenance.js .github/workflows/verify.yml
          git rm .github/workflows/agent-402-apply.yml tools/ci/_agent_402_apply.py
          git commit -m "Expose runtime sprite timing provenance in Studio"
          git push origin HEAD:agent/402-sprite-timing-provenance
