name: Editable Blender item study

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-editable-item-study
    paths:
      - tools/blender/build_editable_item_study.py
      - tools/blender/check_editable_item_blend.py
      - tools/blender/validate_item_obj_runtime.py
      - docs/reports/blender-item-authoring-study/README.md
      - .github/workflows/editable-item-blend-study.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/tools/blender
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blender-editable-item-study

      - name: Install headless Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgbm1 xvfb xauth

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz \
            -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Build editable sources and compiled products
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a "$BLENDER_BIN" --background --python tools/blender/build_editable_item_study.py
          test "$(find assets/authoring/items/studies/blender_editable -name '*.blend' | wc -l)" -eq 5
          test "$(find assets/models/items/studies/blender_editable -name '*.obj' | wc -l)" -eq 5
          test -s docs/reports/blender-item-authoring-study/generated-manifest.json

      - name: Re-open every Blend and prove authoring structure survived save
        shell: bash
        run: |
          set -euxo pipefail
          for file in assets/authoring/items/studies/blender_editable/*.blend; do
            xvfb-run -a "$BLENDER_BIN" --background "$file" --python tools/blender/check_editable_item_blend.py
          done

      - name: Validate flattened OBJ products against runtime face contract
        shell: bash
        run: |
          set -euxo pipefail
          python tools/blender/validate_item_obj_runtime.py assets/models/items/studies/blender_editable/*.obj

      - name: Commit deterministic study artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/authoring/items/studies/blender_editable \
            assets/models/items/studies/blender_editable \
            docs/reports/blender-item-authoring-study/generated-manifest.json \
            docs/reports/blender-item-authoring-study/previews
          if git diff --cached --quiet; then
            echo "Generated study artifacts already match."
          else
            git commit -m "Materialize editable Blender item study"
            git push origin HEAD:agent/blender-editable-item-study
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: editable-blender-item-study
          path: |
            assets/authoring/items/studies/blender_editable
            assets/models/items/studies/blender_editable
            docs/reports/blender-item-authoring-study
          if-no-files-found: error
