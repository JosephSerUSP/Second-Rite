name: Issue 284 G6 recapture

on:
  push:
    branches: [agent/284-g6-model-picker-goldens]

permissions:
  contents: write

concurrency:
  group: issue-284-g6-recapture
  cancel-in-progress: false

env:
  LOVE_VERSION: '11.5'
  LOVE_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
  LOVE_SHA256: BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369
  MESA_VERSION: '26.1.6'
  MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
  MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
  SDL_AUDIODRIVER: dummy

jobs:
  recapture:
    name: Recapture four verified G6 frames
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out recapture branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow websocket-client

      - name: Install pinned LOVE and Mesa for editor previews
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveZip = Join-Path $env:RUNNER_TEMP 'love.zip'
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $loveZip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $loveZip -Algorithm SHA256).Hash -ne $env:LOVE_SHA256) { throw 'LOVE digest mismatch' }
          $loveRoot = Join-Path $env:RUNNER_TEMP 'love'
          Expand-Archive $loveZip $loveRoot -Force
          $love = Get-ChildItem $loveRoot -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love) { throw 'lovec.exe not found' }

          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $mesaArchive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash -ne $env:MESA_SHA256) { throw 'Mesa digest mismatch' }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesaRoot -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 opengl32.dll not found' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') $love.DirectoryName -Force
          $love.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          $loveGui = Join-Path $love.DirectoryName 'love.exe'
          if (-not (Test-Path $loveGui)) { throw 'love.exe sibling not found' }
          "LOVE_PATH=$loveGui" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Capture G6 and replace only issue 284 references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'issue-284-g6'
          python tools/golden/relative-capture.py --repo-root $env:GITHUB_WORKSPACE --gate g6 --output $out
          if ($LASTEXITCODE -ne 0) { throw 'G6 hosted capture incomplete' }

          $targets = @(
            'database/commonEvents.png',
            'database/items.png',
            'map-editor/command-selector.png',
            'map-editor/event-modal.png'
          )
          foreach ($rel in $targets) {
            $source = Join-Path $out (Join-Path 'captures/editor' $rel)
            $dest = Join-Path 'tools/golden/editor-screens' $rel
            if (-not (Test-Path $source)) { throw "missing captured target: $rel" }
            Copy-Item -LiteralPath $source -Destination $dest -Force
          }

          $changed = @(git diff --name-only -- tools/golden/editor-screens)
          $expected = @(
            'tools/golden/editor-screens/database/commonEvents.png',
            'tools/golden/editor-screens/database/items.png',
            'tools/golden/editor-screens/map-editor/command-selector.png',
            'tools/golden/editor-screens/map-editor/event-modal.png'
          )
          if (($changed | Sort-Object) -join "`n" -ne ($expected | Sort-Object) -join "`n") {
            throw "unexpected golden change set:`n$($changed -join "`n")"
          }

          '## #284 recaptured references' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($rel in $targets) {
            $dest = Join-Path 'tools/golden/editor-screens' $rel
            $hash = (Get-FileHash $dest -Algorithm SHA256).Hash
            "- ``$rel`` — ``$hash``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Commit goldens and remove this temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/golden/editor-screens/database/commonEvents.png tools/golden/editor-screens/database/items.png tools/golden/editor-screens/map-editor/command-selector.png tools/golden/editor-screens/map-editor/event-modal.png
          git rm -- .github/workflows/issue-284-recapture.yml
          git commit -m 'Recapture G6 model picker references (#284)'
          git push origin HEAD:agent/284-g6-model-picker-goldens
