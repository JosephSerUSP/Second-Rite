name: love12-spike

on:
  push:
    branches: [agent/issue-246-love12-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LOVE11_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
      LOVE11_SHA256: BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369
      LOVE12_UPSTREAM_SHA: 853f1cad4bb65d63f02dbcd3fa31b0c622d3abbc
      LOVE12_ARTIFACT_ID: '9022947942'
      LOVE12_URL: https://nightly.link/love2d/love/actions/runs/31261258544/love-windows-x64.zip
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
      MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE 11.5 and pinned LOVE 12 development build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-CheckedArchive($url, $dest, $expected = '') {
            Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRetryCount 3 -RetryIntervalSec 5
            $sha = (Get-FileHash $dest -Algorithm SHA256).Hash
            Write-Host "$dest SHA256: $sha"
            if ($expected -and $sha -ne $expected) { throw "archive digest mismatch for $dest" }
          }

          $love11Zip = Join-Path $env:RUNNER_TEMP 'love11.zip'
          $love11Root = Join-Path $env:RUNNER_TEMP 'love11'
          Get-CheckedArchive $env:LOVE11_URL $love11Zip $env:LOVE11_SHA256
          Expand-Archive $love11Zip $love11Root -Force
          $love11 = Get-ChildItem $love11Root -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love11) { throw 'LOVE 11.5 lovec.exe not found' }

          $love12Outer = Join-Path $env:RUNNER_TEMP 'love12-artifact.zip'
          $love12OuterRoot = Join-Path $env:RUNNER_TEMP 'love12-artifact'
          $love12Root = Join-Path $env:RUNNER_TEMP 'love12'
          Get-CheckedArchive $env:LOVE12_URL $love12Outer
          Expand-Archive $love12Outer $love12OuterRoot -Force
          $love12Inner = Get-ChildItem $love12OuterRoot -Filter 'love-12.0-win64.zip' | Select-Object -First 1
          if (-not $love12Inner) { throw 'LOVE 12 inner runtime ZIP not found' }
          Expand-Archive $love12Inner.FullName $love12Root -Force
          $love12 = Get-ChildItem $love12Root -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love12) { throw 'LOVE 12 lovec.exe not found' }

          $v11 = (& $love11.FullName --version 2>&1 | Out-String).Trim()
          $v12 = (& $love12.FullName --version 2>&1 | Out-String).Trim()
          Write-Host "11.5 runtime: $v11"
          Write-Host "12 runtime:   $v12"
          if ($v11 -notmatch '11\.5') { throw "unexpected 11.5 runtime: $v11" }
          if ($v12 -notmatch '12\.0') { throw "unexpected 12 runtime: $v12" }

          "LOVE11=$($love11.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE11_DIR=$($love11.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12=$($love12.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12_DIR=$($love12.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE11_EXE=$(Join-Path $love11.DirectoryName 'love.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12_EXE=$(Join-Path $love12.DirectoryName 'love.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install identical Mesa software OpenGL beside both runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $dll = Get-ChildItem $mesa -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { throw 'Mesa x64 opengl32.dll not found' }
          foreach ($dir in @($env:LOVE11_DIR, $env:LOVE12_DIR)) {
            Copy-Item (Join-Path $dll.DirectoryName '*.dll') $dir -Force
          }

      - name: Probe renderer, filesystem mount, and LuaJIT FFI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'love12-probe'
          $outside = Join-Path $env:RUNNER_TEMP 'love12-external'
          New-Item -ItemType Directory -Path $probe,$outside -Force | Out-Null
          '{"outside":true}' | Set-Content (Join-Path $outside 'probe.json') -Encoding ascii
          $outsideLua = $outside.Replace('\','/')
          @"
          local okffi = pcall(require, 'ffi')
          function love.load()
            local name, version, vendor, device = love.graphics.getRendererInfo()
            print('renderer=' .. table.concat({name,version,vendor,device}, '|'))
            print('ffi=' .. tostring(okffi))
            print('mountFullPath=' .. tostring(type(love.filesystem.mountFullPath)))
            if love.filesystem.mountFullPath then
              print('mount=' .. tostring(love.filesystem.mountFullPath('$outsideLua', 'ext', 'read')))
              print('external=' .. tostring(love.filesystem.getInfo('ext/probe.json') ~= nil))
            end
            love.event.quit(0)
          end
          "@ | Set-Content (Join-Path $probe 'main.lua') -Encoding utf8
          Write-Host '--- LOVE 11.5 ---'
          & $env:LOVE11 $probe
          Write-Host '--- LOVE 12 ---'
          & $env:LOVE12 $probe

      - name: LOVE 11.5 baseline gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldPath = $env:PATH
          $env:PATH = "$env:LOVE11_DIR;$oldPath"
          & $env:LOVE11 . validate
          if ($LASTEXITCODE -ne 0) { throw '11.5 G1 failed' }
          & $env:LOVE11 . unittest
          if ($LASTEXITCODE -ne 0) { throw '11.5 unit failed' }
          & $env:LOVE11 . savetest
          if ($LASTEXITCODE -ne 0) { throw '11.5 save failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/golden/check.ps1
          if ($LASTEXITCODE -ne 0) { throw '11.5 G2 failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/golden/check-ui.ps1
          if ($LASTEXITCODE -ne 0) { throw '11.5 G3 failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/golden/check-state.ps1
          if ($LASTEXITCODE -ne 0) { throw '11.5 G4 failed' }

      - name: LOVE 12 gates
        id: love12gates
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $oldPath = $env:PATH
          $env:PATH = "$env:LOVE12_DIR;$oldPath"
          $fail = 0
          function Run-Gate($label, [scriptblock]$body) {
            Write-Host "--- $label ---"
            & $body
            if ($LASTEXITCODE -ne 0) {
              Write-Host "RESULT $label FAIL ($LASTEXITCODE)"
              $script:fail = 1
            } else { Write-Host "RESULT $label PASS" }
          }
          Run-Gate 'G1' { & $env:LOVE12 . validate }
          Run-Gate 'unit' { & $env:LOVE12 . unittest }
          Run-Gate 'save' { & $env:LOVE12 . savetest }
          Run-Gate 'G2' { powershell -NoProfile -ExecutionPolicy Bypass -File tools/golden/check.ps1 }
          Run-Gate 'G3' { powershell -NoProfile -ExecutionPolicy Bypass -File tools/golden/check-ui.ps1 }
          Run-Gate 'G4' { powershell -NoProfile -ExecutionPolicy Bypass -File tools/golden/check-state.ps1 }
          if ($fail) { exit 1 }

      - name: Capture paired G5 output under 11.5 and 12
        id: g5pair
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $c11 = Join-Path $env:RUNNER_TEMP 'classic11.txt'
          $c12 = Join-Path $env:RUNNER_TEMP 'classic12.txt'
          $w11 = Join-Path $env:RUNNER_TEMP 'wide11.txt'
          $w12 = Join-Path $env:RUNNER_TEMP 'wide12.txt'
          & $env:LOVE11 . screenshots | Out-File $c11 -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw '11.5 classic screenshot harness failed' }
          & $env:LOVE12 . screenshots | Out-File $c12 -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw '12 classic screenshot harness failed' }
          & $env:LOVE11 . surface=wide screenshots | Out-File $w11 -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw '11.5 wide screenshot harness failed' }
          & $env:LOVE12 . surface=wide screenshots | Out-File $w12 -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw '12 wide screenshot harness failed' }

          $crop11 = (& $env:LOVE11 . surface-crop-check 2>&1 | Out-String)
          $crop11Exit = $LASTEXITCODE
          $crop12 = (& $env:LOVE12 . surface-crop-check 2>&1 | Out-String)
          $crop12Exit = $LASTEXITCODE
          Write-Host "11.5 crop exit=$crop11Exit`n$crop11"
          Write-Host "12 crop exit=$crop12Exit`n$crop12"

          $py = @'
          import base64, hashlib, json, os
          BEGIN='SCREENSHOTS BEGIN'; END='SCREENSHOTS END'
          def load(path):
              text=open(path,encoding='utf-8-sig',errors='replace').read()
              data=json.loads(text[text.index(BEGIN)+len(BEGIN):text.index(END)].strip())
              return {c['path']: hashlib.sha256(base64.b64decode(c['image'])).hexdigest() for c in data['captures']}
          def compare(label,a,b):
              A,B=load(a),load(b); paths=sorted(set(A)|set(B))
              changed=[p for p in paths if A.get(p)!=B.get(p)]
              print(f'PAIRWISE {label}: {len(changed)}/{len(paths)} frames differ')
              for p in changed: print('  DIFF '+p)
          compare('classic', os.environ['C11'], os.environ['C12'])
          compare('wide', os.environ['W11'], os.environ['W12'])
          '@
          $env:C11=$c11; $env:C12=$c12; $env:W11=$w11; $env:W12=$w12
          $py | python -
          if ($LASTEXITCODE -ne 0) { throw 'pairwise G5 comparison failed' }
          if ($crop11Exit -ne 0 -or $crop12Exit -ne 0) { throw 'surface crop invariant failed in one runtime' }

      - name: Capture paired G6 editor frames under 11.5 and 12
        id: g6pair
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check websocket-client
          $repo11 = Join-Path $env:RUNNER_TEMP 'repo-editor-11'
          $repo12 = Join-Path $env:RUNNER_TEMP 'repo-editor-12'
          Copy-Item . $repo11 -Recurse
          Copy-Item . $repo12 -Recurse
          foreach ($repo in @($repo11,$repo12)) {
            Remove-Item (Join-Path $repo 'tools/golden/editor-screens') -Recurse -Force -ErrorAction SilentlyContinue
          }
          Push-Location $repo11
          $env:LOVE_PATH=$env:LOVE11_EXE
          python tools/golden/editor-screens.py capture
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw '11.5 G6 capture failed' }
          Pop-Location
          Push-Location $repo12
          $env:LOVE_PATH=$env:LOVE12_EXE
          python tools/golden/editor-screens.py capture
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw '12 G6 capture failed' }
          Pop-Location

          $env:E11=(Join-Path $repo11 'tools/golden/editor-screens')
          $env:E12=(Join-Path $repo12 'tools/golden/editor-screens')
          $py = @'
          import hashlib, os
          def files(root):
              out={}
              for base,_,names in os.walk(root):
                  for n in names:
                      if not n.endswith('.png'): continue
                      p=os.path.join(base,n); rel=os.path.relpath(p,root).replace('\\','/')
                      out[rel]=hashlib.sha256(open(p,'rb').read()).hexdigest()
              return out
          A,B=files(os.environ['E11']),files(os.environ['E12']); paths=sorted(set(A)|set(B))
          changed=[p for p in paths if A.get(p)!=B.get(p)]
          print(f'PAIRWISE editor: {len(changed)}/{len(paths)} frames differ')
          for p in changed: print('  DIFF '+p)
          '@
          $py | python -
          if ($LASTEXITCODE -ne 0) { throw 'pairwise G6 comparison failed' }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## LOVE 12 spike" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- upstream commit: ``$env:LOVE12_UPSTREAM_SHA``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- upstream artifact id: ``$env:LOVE12_ARTIFACT_ID``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- LOVE 12 gates step: ${{ steps.love12gates.outcome }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- paired G5 step: ${{ steps.g5pair.outcome }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- paired G6 step: ${{ steps.g6pair.outcome }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
