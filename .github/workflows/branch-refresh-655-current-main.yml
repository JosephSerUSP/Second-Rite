name: Refresh 655 onto current main

on:
  push:
    branches:
      - agent/639-gltf-static-spike

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/639-gltf-static-spike
          fetch-depth: 0

      - name: Merge current main without conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Commit merge and remove temporary refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/branch-refresh-655-current-main.yml
          git add -A
          git commit -m "Merge current main into static glTF normalization spike"
          git push origin HEAD:agent/639-gltf-static-spike
