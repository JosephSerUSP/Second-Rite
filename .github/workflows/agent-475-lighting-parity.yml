name: agent 475 lighting parity patch

on:
  push:
    branches:
      - agent/475-lighting-parity-corpus

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/475-lighting-parity-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Wire parity consumers
        shell: python
        run: |
          from pathlib import Path

          js = Path('tools/editor/tests/test-map-3d-lighting.js')
          text = js.read_text(encoding='utf-8')
          marker = "test('shared JSON static-light corpus matches Studio bake and orientation semantics'"
          assert marker not in text
          block = r'''

test('shared JSON static-light corpus matches Studio bake and orientation semantics', () => {
    const fixture = JSON.parse(fs.readFileSync(
        path.join(ROOT, 'tests', 'fixtures', 'lighting_parity.json'), 'utf8'
    ));
    const tolerance = Number(fixture.tolerance || 1e-8);

    function sceneFromRows(rows) {
        const cells = [];
        rows.forEach((row, y) => {
            Array.from(row).forEach((cell, x) => {
                cells.push({ cell: { x, y }, role: cell === '#' ? 'wall' : 'floor' });
            });
        });
        return {
            bounds: { width: rows[0].length, height: rows.length },
            cells
        };
    }

    function assertRgb(caseName, label, actual, expected) {
        for (let channel = 0; channel < 3; channel++) {
            assert.ok(Math.abs(Number(actual[channel]) - Number(expected[channel])) <= tolerance,
                `${caseName} ${label} channel ${channel}: expected ${expected[channel]}, got ${actual[channel]}`);
        }
    }

    function orientationFactor(faceRole) {
        const source = faceRole === 'side-wall'
            ? { surface: 'north-wall' }
            : faceRole === 'front-wall'
                ? { surface: 'east-wall' }
                : { surface: 'floor' };
        return Adapter.surfaceOrientationFactor({ source });
    }

    for (const fixtureCase of fixture.cases) {
        const field = Contract.bakeAuthoringLighting(
            sceneFromRows(fixtureCase.rows), fixtureCase.sources, fixtureCase.ambient
        );
        for (const sample of fixtureCase.samples || []) {
            assertRgb(fixtureCase.name, `vertex (${sample.x},${sample.y})`,
                field[sample.y][sample.x], sample.expect);
        }
        for (const sample of fixtureCase.surfaceSamples || []) {
            const base = field[sample.y][sample.x];
            const actualFactor = orientationFactor(sample.faceRole);
            close(actualFactor, fixture.orientationFactors[sample.faceRole],
                `${sample.faceRole} production orientation factor`);
            assertRgb(fixtureCase.name, sample.faceRole,
                base.map(value => value * actualFactor), sample.expect);
        }
    }
});
'''
          js.write_text(text.rstrip() + block + '\n', encoding='utf-8')

          main = Path('main.lua')
          text = main.read_text(encoding='utf-8')
          anchor = '            "test_thestra_formula_conformance",\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '            "test_lighting_parity",\n', 1)
          main.write_text(text, encoding='utf-8')
      - name: Focused browser verification
        run: |
          node --test tools/editor/tests/test-map-3d-lighting.js
          git diff --check
      - name: Commit clean patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/agent-475-lighting-parity.yml
          git add main.lua tools/editor/tests/test-map-3d-lighting.js tests/test_lighting_parity.lua tests/fixtures/lighting_parity.json
          git commit -m 'test: lock Lua and Studio static-light parity'
          git push origin HEAD:agent/475-lighting-parity-corpus
