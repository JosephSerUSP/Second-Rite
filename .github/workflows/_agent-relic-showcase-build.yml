name: Temporary relic showcase build

on:
  push:
    branches:
      - agent/relic-showcase-items
    paths:
      - .github/workflows/_agent-relic-showcase-build.yml
      - tools/asset-production/build_relic_showcase.py
      - tools/asset-production/relic-showcase-items.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus dependency
        run: python -m pip install numpy
      - name: Build showcase models
        run: python tools/asset-production/build_relic_showcase.py
      - name: Check item corpus
        run: python tools/asset-production/check_item_models.py
      - name: Commit generated OBJ and MTL outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/models/items/black_hinge.obj assets/models/items/black_hinge.mtl \
            assets/models/items/chrysalis_sigil.obj assets/models/items/chrysalis_sigil.mtl \
            assets/models/items/qilin_bell.obj assets/models/items/qilin_bell.mtl \
            assets/models/items/vial_of_second_breath.obj assets/models/items/vial_of_second_breath.mtl \
            assets/models/items/meteorite_plate.obj assets/models/items/meteorite_plate.mtl \
            assets/models/items/philosophers_stone.obj assets/models/items/philosophers_stone.mtl
          if ! git diff --cached --quiet; then
            git commit -m "Generate six relic showcase item models"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
