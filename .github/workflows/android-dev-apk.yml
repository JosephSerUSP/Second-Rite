name: Android dev APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Trusted branch, tag, or commit to package
        required: true
        default: main
  pull_request:
    paths:
      - ".github/workflows/android-dev-apk.yml"
      - "tools/export/android-dev-package.js"
      - "tools/export/android-dev-package.test.js"
      - "projects/hichaukitoden-game/data/project.json"
      - "runtime/presentation/touch_gamepad.lua"
      - "runtime/presentation/surface.lua"
      - "runtime/presentation/ui.lua"
      - "runtime/presentation/window_renderer.lua"
      - "runtime/presentation/viewport_3d.lua"
      - "runtime/presentation/dev_overlay.lua"
      - "runtime/presentation/dock.lua"
      - "runtime/presentation/retro_mesh_shader.lua"
      - "runtime/main.lua"
      - "runtime/engine/virtual_input.lua"
      - "runtime/engine/player_controller.lua"
      - "runtime/engine/scene_host.lua"
      - "tests/test_presentation_surface.lua"
      - "tests/test_dock.lua"
      - "tests/test_item_model_view.lua"

permissions:
  contents: read

concurrency:
  group: android-dev-apk-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  LOVE_ANDROID_REF: 55feb38fa144f4734c26742389f279fb07d955c0
  LOVE_ANDROID_LABEL: 11.5a
  ANDROID_NDK_VERSION: 25.2.9519653
  ANDROID_BUILD_TOOLS_VERSION: 34.0.0

jobs:
  contract:
    name: Android packaging contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Adapter syntax and unit contract
        run: |
          set -euo pipefail
          node --check tools/export/android-dev-package.js
          node --test tools/export/android-dev-package.test.js

  build:
    name: Build installable Second Gate dev APK
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out package source ref
        uses: actions/checkout@v4
        with:
          # Manual builds may select a trusted ref. Android-packaging PRs also
          # assemble the real APK, but from the exact PR head and with NO stable
          # signing secret exposed to PR code.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record exact source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "THESTRA_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Packaging source $source_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository tooling dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned LÖVE runtime for canonical export
        timeout-minutes: 5
        uses: ./.github/actions/install-love

      - name: Export canonical Project .love
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/android-game
          mkdir -p out/android-game
          export LOVEC_PATH="$LOVEC"
          xvfb-run -a node tools/export/export-game.js \
            --target love \
            --project projects/hichaukitoden-game \
            --output out/android-game

          mapfile -t love_files < <(find out/android-game -maxdepth 1 -type f -name '*.love' -print)
          if [ "${#love_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one canonical .love export, found ${#love_files[@]}" >&2
            printf '%s\n' "${love_files[@]:-}"
            exit 1
          fi
          echo "THESTRA_GAME_LOVE=${love_files[0]}" >> "$GITHUB_ENV"
          love_bytes="$(stat -c '%s' "${love_files[0]}")"
          echo "Canonical .love: $(du -h "${love_files[0]}" | cut -f1) (${love_bytes} bytes)"

          # Android versionCode is a signed 32-bit-ish application integer with
          # a Play ceiling of 2.1b. Epoch seconds are monotonically increasing
          # for our CI runs and remain under that ceiling until 2036.
          version_code="$(date -u +%s)"
          if [ "$version_code" -gt 2100000000 ]; then
            echo "::error::Epoch-second versionCode has exhausted Android's 2.1b ceiling; replace the policy." >&2
            exit 1
          fi
          echo "THESTRA_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Check out pinned official love-android wrapper
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: ${{ env.LOVE_ANDROID_REF }}
          path: out/love-android
          submodules: recursive
          persist-credentials: false

      - name: Configure embedded dev application
        shell: bash
        run: |
          set -euo pipefail
          node tools/export/android-dev-package.js \
            --project projects/hichaukitoden-game \
            --love-android out/love-android \
            --love "$THESTRA_GAME_LOVE" \
            --version-code "$THESTRA_ANDROID_VERSION_CODE" \
            --source-sha "$THESTRA_SOURCE_SHA" \
            --love-android-ref "$LOVE_ANDROID_REF" \
            --manifest out/android-build.json
          cat out/android-build.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned Android SDK/NDK pieces
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager is not available under ANDROID_HOME=$ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" \
            "platforms;android-34" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Materialize Android dev signing key
        id: signing
        shell: bash
        env:
          # Stable signing material is available ONLY to explicit trusted manual
          # builds. PR assembly always uses an ephemeral key, even for same-repo
          # PRs, so arbitrary PR code cannot read the update certificate.
          STABLE_KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_DEV_DEBUG_KEYSTORE_BASE64 || '' }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/second-gate-dev.keystore"
          if [ -n "${STABLE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$STABLE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            mode=stable
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "PR verification intentionally uses an ephemeral certificate; stable update signing is manual-build-only."
            else
              echo "::warning::ANDROID_DEV_DEBUG_KEYSTORE_BASE64 is not configured. This APK is installable, but its ephemeral certificate will NOT update a build from another CI run. Configure the secret before relying on update-in-place."
            fi
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Second Gate Dev,O=Thestra,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
            mode=ephemeral
          fi
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "THESTRA_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "THESTRA_ANDROID_SIGNING_MODE=$mode" >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build embedded no-microphone release APK
        working-directory: out/love-android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleEmbedNoRecordRelease

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unsigned < <(find out/love-android/app/build/outputs/apk -type f -name '*embed-noRecord-release-unsigned.apk' -print)
          if [ "${#unsigned[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one unsigned embedNoRecord release APK, found ${#unsigned[@]}" >&2
            find out/love-android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          aligned="$RUNNER_TEMP/second-gate-dev-aligned.apk"
          final="out/Second-Gate-dev.apk"
          "$build_tools/zipalign" -f -p 4 "${unsigned[0]}" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$THESTRA_ANDROID_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$final" \
            "$aligned"
          "$build_tools/apksigner" verify --verbose --print-certs "$final" | tee out/android-signature.txt

          badging="$($build_tools/aapt dump badging "$final")"
          printf '%s\n' "$badging" > out/android-badging.txt
          printf '%s\n' "$badging" | head -n 4

          expected_package="$(node -p "require('./out/android-build.json').applicationId")"
          expected_code="$(node -p "require('./out/android-build.json').versionCode")"
          expected_name="$(node -p "require('./out/android-build.json').versionName")"
          printf '%s\n' "$badging" | grep -F "package: name='$expected_package'" >/dev/null
          printf '%s\n' "$badging" | grep -F "versionCode='$expected_code'" >/dev/null
          printf '%s\n' "$badging" | grep -F "versionName='$expected_name'" >/dev/null
          if printf '%s\n' "$badging" | grep -F "uses-permission: name='android.permission.RECORD_AUDIO'" >/dev/null; then
            echo "::error::APK still declares android.permission.RECORD_AUDIO despite the no-microphone packaging policy" >&2
            exit 1
          fi

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Second Gate Android dev APK"
            echo
            echo "- Source: \`${THESTRA_SOURCE_SHA:-unavailable}\`"
            echo "- love-android: \`$LOVE_ANDROID_LABEL\` / \`$LOVE_ANDROID_REF\`"
            echo "- versionCode: \`${THESTRA_ANDROID_VERSION_CODE:-unavailable}\`"
            echo "- signing: \`${THESTRA_ANDROID_SIGNING_MODE:-unavailable}\`"
            if [ "${THESTRA_ANDROID_SIGNING_MODE:-}" = "ephemeral" ]; then
              echo "- ⚠️ This run used an ephemeral certificate. The APK is installable, but a later differently signed build cannot update it in place."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload phone-installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: second-gate-android-dev-${{ github.run_number }}
          path: |
            out/Second-Gate-dev.apk
            out/android-build.json
            out/android-signature.txt
            out/android-badging.txt
            out/android-game/build-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
