name: Apply issue 199 sky phase fix

on:
  push:
    branches:
      - agent/issue-199-expanded-render-surface
    paths:
      - tools/issue199_sky_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-199-expanded-render-surface
          fetch-depth: 0
      - run: python tools/issue199_sky_fix.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Anchor sky rendering to composition frame"
          git push origin HEAD:agent/issue-199-expanded-render-surface
