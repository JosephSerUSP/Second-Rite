name: studio host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    name: branded development host (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned npm dependencies
        shell: pwsh
        run: npm ci

      - name: Regenerate and verify deterministic icon containers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run icons
          if ($LASTEXITCODE -ne 0) { throw "icon rebuild failed (exit $LASTEXITCODE)" }
          npm run icons:check
          if ($LASTEXITCODE -ne 0) { throw "icon currentness check failed (exit $LASTEXITCODE)" }
          npm run test:icons
          if ($LASTEXITCODE -ne 0) { throw "icon tests failed (exit $LASTEXITCODE)" }
          node -e "const fs=require('fs'),c=require('crypto'); for(const f of ['tools/editor/Assets/icons/thestra-studio/icon.ico','tools/editor/Assets/icons/thestra-studio/icon.icns']){const b=fs.readFileSync(f); console.log('GENERATED '+f+' SHA256 '+c.createHash('sha256').update(b).digest('hex')); console.log('BEGIN_BASE64 '+f); console.log(b.toString('base64')); console.log('END_BASE64 '+f)}"

      - name: Verify project/editor/runtime boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test tools/export/export-game.test.js tools/editor/test-project-root.js tools/editor/test-project-play.js tools/editor/test-chrome-ownership.js
          if ($LASTEXITCODE -ne 0) { throw "project/editor/runtime boundary tests failed (exit $LASTEXITCODE)" }

      - name: Build, inspect and boot branded development host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run test:studio-host
          if ($LASTEXITCODE -ne 0) { throw "Studio host tests failed (exit $LASTEXITCODE)" }
          npm run studio:host:check
          if ($LASTEXITCODE -ne 0) { throw "Studio host currentness check failed (exit $LASTEXITCODE)" }

      - name: Report tracked changes after regeneration
        if: always()
        shell: pwsh
        run: git diff --stat
