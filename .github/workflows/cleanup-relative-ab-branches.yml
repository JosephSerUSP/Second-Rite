name: Cleanup relative A/B experiment branches

on:
  push:
    branches: [agent/268-270-relative-golden-ab]
    paths: ['.github/workflows/cleanup-relative-ab-branches.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete superseded experiment and integration branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            experiment/issue-150-g5-ab \
            experiment/issue-150-pr264-g5-ab \
            experiment/issue-150-pr264-g5-builder \
            experiment/issue-150-slice2a-builder \
            agent/268-270-main-sync \
            agent/268-270-main-sync-2 \
            agent/268-270-main-sync-3 \
            agent/268-270-relative-golden-ab-sync-backup \
            agent/g5-ps51-tempfile; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "already absent: $branch"
            fi
          done
