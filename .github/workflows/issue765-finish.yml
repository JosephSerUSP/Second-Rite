name: issue 765 collect final evidence

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: issue765-final-evidence-run
  cancel-in-progress: true

jobs:
  evidence:
    if: github.head_ref == 'exp/765-direct-three-definitions'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EVIDENCE: docs/reports/issue765-final-evidence.tmp.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/765-direct-three-definitions
          fetch-depth: 0
          persist-credentials: true

      - name: Restore explicit missing-material fidelity seam
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          viewport = Path('tools/editor/js/three-editor-viewport-base.js')
          source = viewport.read_text(encoding='utf-8')
          marker = """        function materialFor(id) {\n            return materialById.get(id)\n                || WorldFidelity.decorateResolvedWorldMaterial(new THREE.MeshStandardMaterial({\n                    color: 0x777777, roughness: 0.9, side: THREE.DoubleSide, vertexColors: true\n                }));\n        }\n"""
          if source.count(marker) != 1:
              raise SystemExit(f'expected one materialFor helper, found {source.count(marker)}')
          replacement = marker + """        function materialForSurface(surface) {\n            return materialById.get(surface.material)\n                || WorldFidelity.decorateResolvedWorldMaterial(new THREE.MeshStandardMaterial({\n                    color: 0x777777, roughness: 0.9, side: THREE.DoubleSide, vertexColors: true\n                }));\n        }\n"""
          source = source.replace(marker, replacement, 1)
          if source.count('materialFor(surface.material)') != 2:
              raise SystemExit('expected exactly two literal-surface material calls')
          source = source.replace('materialFor(surface.material)', 'materialForSurface(surface)')
          viewport.write_text(source, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'fidelity seam correction failed' }

      - name: Install dependencies and run focused proofs
        id: focused
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "#765 final evidence" | Out-File $env:EVIDENCE -Encoding utf8
          npm.cmd ci --ignore-scripts 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            node tools/editor/sync-three-vendor.js 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            node --test tools/editor/test-instance-transport.js tools/editor/test-runtime-bridge.js tools/editor/tests/test-map-3d-lighting.js 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
            $code = $LASTEXITCODE
          }
          exit $code

      - name: Install pinned LOVE 11.5 and Mesa
        id: love
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveZip = Join-Path $env:RUNNER_TEMP 'love11.zip'
          Invoke-WebRequest -Uri 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip' -OutFile $loveZip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $loveZip -Algorithm SHA256).Hash -ne 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369') { throw 'LOVE digest mismatch' }
          $loveRoot = Join-Path $env:RUNNER_TEMP 'love11'
          Expand-Archive $loveZip $loveRoot -Force
          $love = Get-ChildItem $loveRoot -Recurse -Filter love.exe | Select-Object -First 1
          if (-not $love) { throw 'LOVE executable missing' }
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z' -OutFile $mesaArchive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash -ne '86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB') { throw 'Mesa digest mismatch' }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesaRoot -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 OpenGL missing' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') $love.DirectoryName -Force
          "LOVE_PATH=$($love.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run production-shaped Map 2/3 proof
        id: bench
        continue-on-error: true
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $ErrorActionPreference = 'Continue'
          "`n# production-shaped Maps 2/3 benchmark" | Out-File $env:EVIDENCE -Append -Encoding utf8
          node --expose-gc tools/editor/bench-three-placement-colors.js --love $env:LOVE_PATH 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
          exit $LASTEXITCODE

      - name: Persist evidence and clean all one-off CI scaffolding
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @"

# outcomes
focused=${{ steps.focused.outcome }}
love=${{ steps.love.outcome }}
benchmark=${{ steps.bench.outcome }}
"@ | Out-File $env:EVIDENCE -Append -Encoding utf8
          git config user.name 'Second Rite CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/studio-host.yml
          git rm .github/workflows/issue765-finish.yml .github/workflows/issue765-evidence.yml
          git add tools/editor $env:EVIDENCE .github/workflows/studio-host.yml
          git commit -m 'test(#765): prove production direct consumer'
          if ($LASTEXITCODE -ne 0) { throw 'evidence commit failed' }
          git push origin HEAD:exp/765-direct-three-definitions
          if ($LASTEXITCODE -ne 0) { throw 'evidence push failed' }
