name: Install Mesa software OpenGL
description: >
  Install pinned Mesa software-OpenGL DLLs next to the LOVE binaries and prove a
  context can be created. Following install-love (#725), this action is the
  owner of the Mesa version, URL and digest for every workflow that uses it --
  prefer this over re-declaring MESA_URL/MESA_SHA256. relative-golden-ab.yml
  still declares its own copy and has not been migrated yet. Requires
  install-love to have run first: it copies into $LOVE_DIR and probes with
  $LOVEC.

inputs:
  version:
    description: Mesa version to install.
    required: false
    default: "26.1.6"
  url:
    description: Override the pinned archive URL (advanced; must match sha256).
    required: false
    default: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
  sha256:
    description: Expected SHA256 of the archive.
    required: false
    default: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"

runs:
  using: composite
  steps:
    # Same reasoning as install-love: cache the archive, keep verifying its
    # digest on every run, key on the digest so a changed pin cannot hit a
    # stale entry.
    - name: Restore the pinned Mesa archive
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/mesa.7z
        key: mesa-archive-${{ inputs.sha256 }}
    - name: Install Mesa software OpenGL ${{ inputs.version }}
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        if (-not $env:LOVE_DIR) { throw "install-mesa requires install-love to have run first (LOVE_DIR is unset)" }
        if (-not $env:LOVEC)    { throw "install-mesa requires install-love to have run first (LOVEC is unset)" }
        $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
        $mesa = Join-Path $env:RUNNER_TEMP "mesa"
        if (Test-Path $archive) {
          Write-Host "using the cached archive at $archive"
        } else {
          Invoke-WebRequest -Uri "${{ inputs.url }}" -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
        }
        # Verified on both paths: a cache entry is a file from a shared store,
        # not a trusted artifact because we put it there.
        $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
        Write-Host "mesa3d-${{ inputs.version }}-release-msvc.7z SHA256: $sha"
        if ($sha -ne "${{ inputs.sha256 }}") {
          throw "Mesa archive digest mismatch`n  expected: ${{ inputs.sha256 }}`n  actual:   $sha"
        }
        & 7z x $archive "-o$mesa" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }
        $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
               Where-Object { $_.FullName -match "x64" } |
               Select-Object -First 1
        if (-not $dll) { throw "opengl32.dll (x64) not found in Mesa archive" }
        Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force
        Write-Host "installed software OpenGL into $env:LOVE_DIR"
        # The probe is the point: a copied DLL that cannot create a context would
        # otherwise surface far later as an unattributable rendering failure.
        $probe = Join-Path $env:RUNNER_TEMP "glprobe"
        New-Item -ItemType Directory -Path $probe -Force | Out-Null
        @'
        function love.load()
          local name, version, vendor, device = love.graphics.getRendererInfo()
          print(string.format("renderer: %s | %s | %s | %s", name, version, vendor, device))
          love.event.quit(0)
        end
        '@ | Set-Content -Path (Join-Path $probe "main.lua") -Encoding utf8
        $info = & $env:LOVEC $probe 2>&1 | Out-String
        Write-Host $info.Trim()
        if ($info -notmatch "renderer:") { throw "LOVE could not create an OpenGL context" }

    - name: Unsupported runner
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "install-mesa has no path for runner.os=${{ runner.os }}" >&2
        exit 1
