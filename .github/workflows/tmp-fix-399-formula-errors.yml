name: tmp fix 399 formula errors

on:
  push:
    branches: [agent/394-picture-transform-formulas]

permissions:
  contents: write

concurrency:
  group: tmp-fix-399-formula-errors
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: agent/394-picture-transform-formulas
          fetch-depth: 0
          persist-credentials: true

      - name: Propagate canonical formula errors to picture handlers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "536b8219251ad3b15af881bff566beadc806f6a9"
          git merge-base --is-ancestor origin/main HEAD

          python - <<'PY'
          from pathlib import Path

          path = Path('engine/interpreter_core.lua')
          text = path.read_text(encoding='utf-8')

          old_eval = '''    local val, err = formulaEngine.eval(expr, fctx)
              if err then
                  table.insert(ctx.events, { type = "text", text = "[flow] formula error: " .. tostring(err) })
              end
              return val
          end'''
          new_eval = '''    local val, err = formulaEngine.eval(expr, fctx)
              if err then
                  table.insert(ctx.events, { type = "text", text = "[flow] formula error: " .. tostring(err) })
              end
              -- Keep the canonical fallback value for existing callers while also
              -- preserving the evaluator's failure signal for commands that must
              -- reject invalid authored values rather than continue with fallback 0.
              return val, err
          end'''
          if text.count(old_eval) != 1:
              raise SystemExit(f'expected one canonical evalFormula return block, found {text.count(old_eval)}')
          text = text.replace(old_eval, new_eval)

          old_picture = '''            local result = evalFormula(value, ctx)
                      if type(result) ~= "number" then
                          error(commandId .. "." .. field .. " must resolve to a number, got "
                              .. type(result), 0)
                      end
                      resolved[field] = result'''
          new_picture = '''            local result, formulaError = evalFormula(value, ctx)
                      if formulaError then
                          error(commandId .. "." .. field .. " formula failed: "
                              .. tostring(formulaError), 0)
                      end
                      if type(result) ~= "number" then
                          error(commandId .. "." .. field .. " must resolve to a number, got "
                              .. type(result), 0)
                      end
                      resolved[field] = result'''
          if text.count(old_picture) != 1:
              raise SystemExit(f'expected one image-picture evaluation block, found {text.count(old_picture)}')
          text = text.replace(old_picture, new_picture)

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'tools/export/rtp-resource-resolver.test.js' .github/workflows/verify.yml
          if grep -q -E 'activeFormulaContext|presentationProxy|makeFormulaContext|formulaEngine = require\("engine\.formula"\)' engine/interpreter.lua; then
            echo "#394 facade machinery survived"
            exit 1
          fi

          git rm .github/workflows/tmp-fix-399-formula-errors.yml
          git add engine/interpreter_core.lua
          git diff --check --cached
          git commit -m "fix: fail loud on invalid picture formulas" -m "Propagate interpreter_core's existing formula evaluator error return alongside its legacy fallback value. Image-picture transforms reject that signal before presentation, while existing evalFormula callers retain their current first-return semantics.\n\nAgent-Signature:\nplatform: ChatGPT\nmodel: GPT-5.6 Sol\nrole: integration\npr: #399\nissue: #394"
          git push origin HEAD:agent/394-picture-transform-formulas
