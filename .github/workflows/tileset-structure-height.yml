name: tileset structural height experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tileset-structure-height-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-height-interaction:
    name: render profile + height through real viewport
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      LOVE_URL: "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
      LOVE_SHA256: "BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"
      SDL_AUDIODRIVER: "dummy"

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE 11.5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "love.zip"
          $dest = Join-Path $env:RUNNER_TEMP "love"
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($sha -ne $env:LOVE_SHA256) { throw "LOVE archive digest mismatch: $sha" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $lovec = Get-ChildItem -Path $dest -Recurse -Filter "lovec.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $lovec) { throw "lovec.exe not found" }
          $loveDir = Split-Path -Parent $lovec
          "LOVEC=$lovec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE_DIR=$loveDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Mesa software OpenGL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa archive digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
                 Where-Object { $_.FullName -match "x64" } |
                 Select-Object -First 1
          if (-not $dll) { throw "x64 opengl32.dll not found" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force
          $env:LOVE_DIR | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Apply CI-only structural profile spike
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/experiments/tileset-format/integrated-structural-spike.py patch-renderer
          $diff = (git diff -- presentation/viewport_3d.lua | Out-String)
          if ($diff -notmatch "#558 STRUCTURAL PROFILE INTEGRATION SPIKE") { throw "renderer patch marker missing" }

      - name: Render square and round with real height displacement
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "structural-height"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          foreach ($profile in @("square", "round")) {
            python tools/experiments/tileset-format/structural-height-followup.py $profile --radius 0.22 --segments 3 --wall-height 0.10
            $log = Join-Path $evidence "$profile-relief.txt"
            $png = Join-Path $evidence "$profile-relief.png"
            $output = & $env:LOVEC . preview-map 13 8 5 N 2>&1 | Out-String
            $output | Set-Content -Path $log -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "preview-map $profile+height failed (exit $LASTEXITCODE)" }
            python tools/experiments/tileset-format/integrated-structural-spike.py decode-preview $log $png
            if ((Get-Item $png).Length -lt 10000) { throw "$profile relief preview suspiciously small" }
          }
          $square = (Get-FileHash (Join-Path $evidence "square-relief.png") -Algorithm SHA256).Hash
          $round = (Get-FileHash (Join-Path $evidence "round-relief.png") -Algorithm SHA256).Hash
          if ($square -eq $round) { throw "round structural profile did not affect relief render" }
          "STRUCTURE_HEIGHT_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "STRUCTURAL_HEIGHT_RENDER square=$square round=$round"

      - name: Upload structural-height evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-profile-height-evidence
          path: ${{ env.STRUCTURE_HEIGHT_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

      - name: Restore disposable renderer/map edits
        if: always()
        shell: pwsh
        run: |
          git checkout -- presentation/viewport_3d.lua data/maps/13.json
          git diff --exit-code -- presentation/viewport_3d.lua data/maps/13.json
