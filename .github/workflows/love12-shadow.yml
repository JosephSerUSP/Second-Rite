name: LOVE 12 shadow benchmark

on:
  push:
    branches: [compat/love12]
    paths-ignore:
      - 'docs/reports/love12-shadow-current.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love12-shadow-current
  cancel-in-progress: true

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      LOVE11_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
      LOVE11_SHA256: BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369
      # Keep the prior known 12-development candidate fixed while refreshing
      # Second Rite itself. This isolates repo changes from upstream-runtime drift.
      LOVE12_COMMIT: 853f1cad4bb65d63f02dbcd3fa31b0c622d3abbc
      LOVE12_RUN: '31261258544'
      LOVE12_URL: https://nightly.link/love2d/love/actions/runs/31261258544/love-windows-x64.zip
      MESA_VERSION: '26.1.6'
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
      MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out the shadow branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python image comparator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm install failed (exit $LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed (exit $LASTEXITCODE)" }

      - name: Stage the canonical default Project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gameRoot = Join-Path $env:RUNNER_TEMP 'second-gate-love12-shadow'
          node tools/ci/stage-project-gates.js --output $gameRoot
          if ($LASTEXITCODE -ne 0) { throw "Project staging failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $gameRoot 'data\runtime_data_manifest.json'))) {
            throw 'shadow Project stage is missing compiled semantic data'
          }
          if (-not (Test-Path (Join-Path $gameRoot 'main.lua'))) {
            throw 'shadow Project stage is not runnable'
          }
          "SHADOW_GAME_ROOT=$gameRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned LÖVE runtimes and Mesa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:RUNNER_TEMP 'love12-shadow-results'
          New-Item -ItemType Directory $results -Force | Out-Null
          "SHADOW_RESULTS=$results" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $love11Zip = Join-Path $env:RUNNER_TEMP 'love11.zip'
          Invoke-WebRequest -Uri $env:LOVE11_URL -OutFile $love11Zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $love11Zip -Algorithm SHA256).Hash
          if ($sha -ne $env:LOVE11_SHA256) { throw "LÖVE 11.5 digest mismatch: $sha" }
          $love11Root = Join-Path $env:RUNNER_TEMP 'love11'
          Expand-Archive $love11Zip $love11Root -Force
          $love11 = Get-ChildItem $love11Root -Recurse -Filter lovec.exe | Select-Object -First 1

          $love12Outer = Join-Path $env:RUNNER_TEMP 'love12-artifact.zip'
          Invoke-WebRequest -Uri $env:LOVE12_URL -OutFile $love12Outer -MaximumRetryCount 3 -RetryIntervalSec 5
          $love12OuterSha = (Get-FileHash $love12Outer -Algorithm SHA256).Hash
          $love12OuterRoot = Join-Path $env:RUNNER_TEMP 'love12-artifact'
          Expand-Archive $love12Outer $love12OuterRoot -Force
          $love12Inner = Get-ChildItem $love12OuterRoot -Recurse -Filter 'love-12.0-win64.zip' | Select-Object -First 1
          if (-not $love12Inner) { throw 'LÖVE 12 inner runtime ZIP not found' }
          $love12InnerSha = (Get-FileHash $love12Inner.FullName -Algorithm SHA256).Hash
          $love12Root = Join-Path $env:RUNNER_TEMP 'love12'
          Expand-Archive $love12Inner.FullName $love12Root -Force
          $love12 = Get-ChildItem $love12Root -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love11 -or -not $love12) { throw 'runtime install incomplete' }

          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $mesaArchive -MaximumRetryCount 3 -RetryIntervalSec 5
          $mesaSha = (Get-FileHash $mesaArchive -Algorithm SHA256).Hash
          if ($mesaSha -ne $env:MESA_SHA256) { throw "Mesa digest mismatch: $mesaSha" }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesaRoot -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 opengl32.dll not found' }
          foreach ($dir in @($love11.DirectoryName, $love12.DirectoryName)) {
            Copy-Item (Join-Path $gl.DirectoryName '*.dll') $dir -Force
          }

          $lvp = Get-ChildItem $mesaRoot -Recurse -File | Where-Object {
            $_.Name -match 'lvp.*\.json$' -or $_.Name -match 'lavapipe.*\.json$'
          } | Select-Object -First 1

          "LOVE11=$($love11.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12=$($love12.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VULKAN_ICD=$(if ($lvp) { $lvp.FullName } else { '' })" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          @{
            love11 = ((& $love11.FullName --version 2>&1 | Out-String).Trim())
            love12 = ((& $love12.FullName --version 2>&1 | Out-String).Trim())
            love12Commit = $env:LOVE12_COMMIT
            love12Run = $env:LOVE12_RUN
            love12OuterSha256 = $love12OuterSha
            love12InnerSha256 = $love12InnerSha
            mesaVersion = $env:MESA_VERSION
            vulkanIcd = if ($lvp) { $lvp.FullName } else { $null }
            runner = $env:RUNNER_NAME
            os = $env:RUNNER_OS
            arch = $env:RUNNER_ARCH
            gameRoot = $env:SHADOW_GAME_ROOT
          } | ConvertTo-Json | Out-File (Join-Path $results 'environment.json') -Encoding utf8

      - name: Run bounded OpenGL/Vulkan, map-build, frame/memory and visual matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/love12/run-shadow.ps1 `
            -Love11 $env:LOVE11 `
            -Love12 $env:LOVE12 `
            -GameRoot $env:SHADOW_GAME_ROOT `
            -ResultsRoot $env:SHADOW_RESULTS `
            -RepoRoot (Get-Location).Path `
            -VulkanIcd $env:VULKAN_ICD
          if ($LASTEXITCODE -ne 0) { throw "shadow matrix failed (exit $LASTEXITCODE)" }

      - name: Summarize shadow evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/love12/summarize-shadow.py $env:SHADOW_RESULTS | Tee-Object -FilePath (Join-Path $env:SHADOW_RESULTS 'summary.stdout.txt')
          if ($LASTEXITCODE -ne 0) { throw "shadow summary failed (exit $LASTEXITCODE)" }
          Get-Content (Join-Path $env:SHADOW_RESULTS 'summary.json') -Raw

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: love12-shadow-current-main
          path: ${{ runner.temp }}/love12-shadow-results
          if-no-files-found: error
          retention-days: 14

      - name: Assert repository remained clean
        if: always()
        shell: pwsh
        run: |
          Remove-Item tools/golden/screens -Recurse -Force -ErrorAction SilentlyContinue
          git diff --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'shadow benchmark modified tracked files' }
          git diff --cached --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'shadow benchmark staged tracked files' }
