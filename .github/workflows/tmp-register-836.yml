name: Temporary register selective AA unit suite

on:
  push:
    branches:
      - agent/836-selective-environment-aa

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/836-selective-environment-aa
          fetch-depth: 0
      - name: Register suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtime/main.lua')
          s = p.read_text(encoding='utf-8')
          old = '            "test_projection_window",\n'
          new = '            "test_projection_window", "test_world_pass_compositor",\n'
          if new in s:
              print('suite already registered')
          elif s.count(old) == 1:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('suite registered')
          else:
              raise SystemExit(f'expected one projection-window suite anchor, found {s.count(old)}')
          PY
      - name: Commit when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/main.lua
          if git diff --cached --quiet; then
            echo "registration already applied"
            exit 0
          fi
          git diff --cached --check
          git commit -m "test(#836): register selective AA compositor suite"
          git push origin HEAD:agent/836-selective-environment-aa
