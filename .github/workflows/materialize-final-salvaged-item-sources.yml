name: materialize final salvaged item sources

on:
  push:
    branches: [agent/complete-salvaged-item-blend-authority]
    paths:
      - tools/blender/bootstrap_final_salvaged_blend_sources.py
      - .github/workflows/materialize-final-salvaged-item-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and LÖVE runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libgbm1 xvfb xauth love curl xz-utils python3-numpy
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render canonical 32-item board before final source migration
        shell: bash
        run: |
          set -euxo pipefail
          LOVE_SAVE="$HOME/.local/share/love/SecondRite"
          rm -f "$LOVE_SAVE/salvaged-32-before.png" salvaged-32-before.png
          xvfb-run -a love . item-sheet tools/asset-production/salvaged-item-models.txt salvaged-32-before.png
          test -s "$LOVE_SAVE/salvaged-32-before.png"
          cp "$LOVE_SAVE/salvaged-32-before.png" salvaged-32-before.png
          sha256sum salvaged-32-before.png

      - name: Materialize the two final authoritative Blender sources
        shell: bash
        run: |
          set -euxo pipefail
          rm -f assets/authoring/items/pile_bunker.blend assets/authoring/items/pile_bunker.blend[0-9]*
          rm -f assets/authoring/items/celestial_fossil.blend assets/authoring/items/celestial_fossil.blend[0-9]*
          xvfb-run -a "$BLENDER_BIN" --background --factory-startup --python tools/blender/bootstrap_final_salvaged_blend_sources.py
          test -s assets/authoring/items/pile_bunker.blend
          test -s assets/authoring/items/celestial_fossil.blend
          sha256sum \
            assets/authoring/items/pile_bunker.blend \
            assets/authoring/items/celestial_fossil.blend \
            > /tmp/final-two-before-compile.sha256

      - name: Compile the two sources through the production pipeline
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python tools/blender/compile_item_blends.py \
            --blender "$BLENDER_BIN" \
            --source assets/authoring/items/pile_bunker.blend \
            --source assets/authoring/items/celestial_fossil.blend
          python tools/asset-production/check_item_models.py
          python tools/blender/validate_item_obj_runtime.py assets/models/items/pile_bunker.obj
          python tools/blender/validate_item_obj_runtime.py assets/models/items/celestial_fossil.obj

      - name: Prove the complete 32-source corpus is read-only and reproducible
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum \
            assets/authoring/items/pile_bunker.blend \
            assets/authoring/items/celestial_fossil.blend \
            > /tmp/final-two-after-compile.sha256
          diff -u /tmp/final-two-before-compile.sha256 /tmp/final-two-after-compile.sha256
          test -z "$(find assets/authoring/items -type f -name '*.blend[0-9]*' -print)"

      - name: Render final 32-item graduation board
        shell: bash
        run: |
          set -euxo pipefail
          LOVE_SAVE="$HOME/.local/share/love/SecondRite"
          rm -f "$LOVE_SAVE/salvaged-32-after.png" salvaged-32-after.png
          xvfb-run -a love . item-sheet tools/asset-production/salvaged-item-models.txt salvaged-32-after.png
          test -s "$LOVE_SAVE/salvaged-32-after.png"
          cp "$LOVE_SAVE/salvaged-32-after.png" salvaged-32-after.png
          sha256sum salvaged-32-after.png

      - name: Commit authoritative sources and runtime products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Second Rite Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            assets/authoring/items/pile_bunker.blend \
            assets/authoring/items/celestial_fossil.blend \
            assets/models/items/pile_bunker.obj \
            assets/models/items/pile_bunker.mtl \
            assets/models/items/celestial_fossil.obj \
            assets/models/items/celestial_fossil.mtl
          git diff --cached --stat
          git commit -m "Materialize final salvaged Blender item sources"
          git push origin HEAD:agent/complete-salvaged-item-blend-authority

      - name: Upload graduation review
        uses: actions/upload-artifact@v4
        with:
          name: salvaged-32-blender-authority-graduation
          path: |
            salvaged-32-before.png
            salvaged-32-after.png
          if-no-files-found: error
