name: runtime data boundary

on:
  pull_request:
    paths:
      - "projects/hichaukitoden-game/data/**"
      - "runtime/engine/data/**"
      - "tools/semantic-roots.js"
      - "tools/data/authored-storage*.js"
      - "tools/export/runtime-data-*.js"
      - "tools/export/runtime-source-storage-census.test.js"
      - "tools/export/runtime-semantic-resources.lua"
      - "tools/export/runtime-engine-server.lua"
      - "tools/export/export-game.js"
      - "tools/export/runtime-manifest.json"
      - "studio/editor/project-play.js"
      - "studio/editor/test-project-play.js"
      - "studio/editor/runtime-bridge-server.js"
      - "studio/editor/test-runtime-bridge.js"
      - "studio/editor/test-runtime-bridge-worker-shutdown.js"
      - "studio/editor/runtime-renderable-worker.js"
      - "studio/editor/runtime-renderable-worker-main.lua"
      - "studio/editor/test-runtime-renderable-worker.js"
      - "studio/editor/test-runtime-renderable-authority-revision.js"
      - "studio/editor/runtime-map-authority-worker.js"
      - "studio/editor/runtime-map-authority-worker-main.lua"
      - "studio/editor/test-runtime-map-authority-worker.js"
      - "studio/editor/test-map-inspection-persistent-route.js"
      - "studio/editor/test-map-authority-parity.js"
      - ".github/workflows/runtime-data-boundary.yml"
  push:
    branches: [main]
    paths:
      - "projects/hichaukitoden-game/data/**"
      - "runtime/engine/data/**"
      - "tools/semantic-roots.js"
      - "tools/data/authored-storage*.js"
      - "tools/export/runtime-data-*.js"
      - "tools/export/runtime-source-storage-census.test.js"
      - "tools/export/runtime-semantic-resources.lua"
      - "tools/export/runtime-engine-server.lua"
      - "tools/export/export-game.js"
      - "tools/export/runtime-manifest.json"
      - "studio/editor/project-play.js"
      - "studio/editor/test-project-play.js"
      - "studio/editor/runtime-bridge-server.js"
      - "studio/editor/test-runtime-bridge.js"
      - "studio/editor/test-runtime-bridge-worker-shutdown.js"
      - "studio/editor/runtime-renderable-worker.js"
      - "studio/editor/runtime-renderable-worker-main.lua"
      - "studio/editor/test-runtime-renderable-worker.js"
      - "studio/editor/test-runtime-renderable-authority-revision.js"
      - "studio/editor/runtime-map-authority-worker.js"
      - "studio/editor/runtime-map-authority-worker-main.lua"
      - "studio/editor/test-runtime-map-authority-worker.js"
      - "studio/editor/test-map-inspection-persistent-route.js"
      - "studio/editor/test-map-authority-parity.js"
      - ".github/workflows/runtime-data-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-a-plus:
    name: Candidate A+ semantic player boundary
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install LOVE
        timeout-minutes: 3
        uses: ./.github/actions/install-love
      - name: Install Mesa software OpenGL
        # Version, URL and digest live in the action, not here (#725).
        uses: ./.github/actions/install-mesa

      - name: Syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/semantic-roots.js
          node --check tools/data/authored-storage-physical.js
          node --check tools/data/authored-storage.js
          node --check tools/export/runtime-data-ownership.test.js
          node --check tools/export/runtime-data-compiler.js
          node --check tools/export/runtime-data-snapshot.js
          node --check tools/export/runtime-source-storage-census.test.js
          node --check studio/editor/project-play.js
          node --check studio/editor/runtime-bridge-server.js
          node --check studio/editor/runtime-renderable-worker.js
          node --check studio/editor/runtime-map-authority-worker.js
          node --check studio/editor/test-runtime-bridge-worker-shutdown.js
          node --check studio/editor/test-runtime-renderable-worker.js
          node --check studio/editor/test-runtime-renderable-authority-revision.js
          node --check studio/editor/test-runtime-map-authority-worker.js
          node --check studio/editor/test-map-inspection-persistent-route.js
          node --check studio/editor/test-map-authority-parity.js

      - name: Candidate A+ semantic compilation and runtime bridge contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --test tools/export/runtime-data-ownership.test.js tools/export/runtime-data-compiler.test.js tools/export/runtime-data-snapshot.test.js tools/export/runtime-source-storage-census.test.js studio/editor/test-project-play.js studio/editor/test-runtime-bridge.js studio/editor/test-runtime-bridge-worker-shutdown.js studio/editor/test-runtime-renderable-worker.js studio/editor/test-runtime-renderable-authority-revision.js studio/editor/test-runtime-map-authority-worker.js studio/editor/test-map-inspection-persistent-route.js
          if ($LASTEXITCODE -ne 0) { throw "runtime data boundary tests failed (exit $LASTEXITCODE)" }

      - name: Map authority cold/warm parity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node studio/editor/test-map-authority-parity.js
          if ($LASTEXITCODE -ne 0) { throw "Map authority parity failed (exit $LASTEXITCODE)" }

      - name: Assert source checkout stayed clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { Write-Host $dirty; throw "runtime data boundary tests modified tracked source" }
