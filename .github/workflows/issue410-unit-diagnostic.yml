name: issue410-unit-diagnostic

on:
  push:
    branches:
      - issue-410-state-owner-substrate
    paths:
      - .github/workflows/issue410-unit-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      SDL_AUDIODRIVER: "dummy"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-410-state-owner-substrate
      - name: Install LOVE
        uses: ./.github/actions/install-love
      - name: Install Node tooling dependencies
        shell: pwsh
        run: npm.cmd ci --ignore-scripts
      - name: Stage default Project
        shell: pwsh
        run: |
          $gateRoot = Join-Path $env:RUNNER_TEMP "second-gate-gates"
          node tools/ci/stage-project-gates.js --output $gateRoot
          "THESTRA_GATE_ROOT=$gateRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Capture exact unit output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/run-staged-unit.ps1 -GameRoot "$env:THESTRA_GATE_ROOT" -Lovec "$env:LOVEC" 2>&1
          $code = $LASTEXITCODE
          $output | Out-File -FilePath issue410-unit-diagnostic.txt -Encoding utf8
          "EXIT_CODE=$code" | Add-Content issue410-unit-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue410-unit-diagnostic.txt
          git commit -m "chore: capture issue 410 unit failure"
          git push origin HEAD:issue-410-state-owner-substrate
