name: runtime data boundary

on:
  pull_request:
    paths:
      - "projects/hichaukitoden-game/data/**"
      - "engine/data/**"
      - "tools/semantic-roots.js"
      - "tools/data/authored-storage*.js"
      - "tools/export/runtime-data-*.js"
      - "tools/export/runtime-source-storage-census.test.js"
      - "tools/export/runtime-semantic-resources.lua"
      - "tools/export/runtime-engine-server.lua"
      - "tools/export/export-game.js"
      - "tools/export/runtime-manifest.json"
      - "tools/editor/project-play.js"
      - "tools/editor/test-project-play.js"
      - "tools/editor/runtime-bridge-server.js"
      - "tools/editor/test-runtime-bridge.js"
      - ".github/workflows/runtime-data-boundary.yml"
  push:
    branches: [main]
    paths:
      - "projects/hichaukitoden-game/data/**"
      - "engine/data/**"
      - "tools/semantic-roots.js"
      - "tools/data/authored-storage*.js"
      - "tools/export/runtime-data-*.js"
      - "tools/export/runtime-source-storage-census.test.js"
      - "tools/export/runtime-semantic-resources.lua"
      - "tools/export/runtime-engine-server.lua"
      - "tools/export/export-game.js"
      - "tools/export/runtime-manifest.json"
      - "tools/editor/project-play.js"
      - "tools/editor/test-project-play.js"
      - "tools/editor/runtime-bridge-server.js"
      - "tools/editor/test-runtime-bridge.js"
      - ".github/workflows/runtime-data-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-a-plus:
    name: Candidate A+ semantic player boundary
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SDL_AUDIODRIVER: dummy
      LOVE_URL: "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
      LOVE_SHA256: "BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned LOVE 11.5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "love.zip"
          $dest = Join-Path $env:RUNNER_TEMP "love"
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($sha -ne $env:LOVE_SHA256) { throw "LOVE archive digest mismatch: $sha" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $lovec = Get-ChildItem -Path $dest -Recurse -Filter "lovec.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $lovec) { throw "lovec.exe not found" }
          $loveDir = Split-Path -Parent $lovec
          "LOVEC=$lovec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE_DIR=$loveDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned Mesa software OpenGL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa archive digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force

      - name: Syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/semantic-roots.js
          node --check tools/data/authored-storage-physical.js
          node --check tools/data/authored-storage.js
          node --check tools/export/runtime-data-ownership.test.js
          node --check tools/export/runtime-data-compiler.js
          node --check tools/export/runtime-data-snapshot.js
          node --check tools/export/runtime-source-storage-census.test.js
          node --check tools/editor/project-play.js
          node --check tools/editor/runtime-bridge-server.js

      - name: Candidate A+ semantic compilation and runtime bridge contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --test tools/export/runtime-data-ownership.test.js tools/export/runtime-data-compiler.test.js tools/export/runtime-data-snapshot.test.js tools/export/runtime-source-storage-census.test.js tools/editor/test-project-play.js tools/editor/test-runtime-bridge.js
          if ($LASTEXITCODE -ne 0) { throw "runtime data boundary tests failed (exit $LASTEXITCODE)" }

      - name: Assert source checkout stayed clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { Write-Host $dirty; throw "runtime data boundary tests modified tracked source" }
