name: Materialize polygonal item cohort

on:
  push:
    branches:
      - agent/polygonal-item-cohort
    paths:
      - tools/asset-production/poly_parts.py
      - tools/asset-production/build_polygonal_item_cohort.py
      - .github/workflows/polygonal-cohort-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polygonal-item-cohort
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus-check dependency
        run: python -m pip install numpy
      - name: Build polygonal cohort
        run: python tools/asset-production/build_polygonal_item_cohort.py
      - name: Report corpus impact before baseline update
        shell: bash
        run: |
          set +e
          python tools/asset-production/check_item_models.py --report
          echo "corpus_exit=$?" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Commit generated OBJ and MTL output
        shell: bash
        run: |
          git config user.name "Second Rite Asset Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            assets/models/items/greatsword.obj \
            assets/models/items/death_sickle.obj \
            assets/models/items/silver_glasses.obj \
            assets/models/items/gas_mask.obj \
            assets/models/items/moth_cloak.obj \
            assets/models/items/mirror_armor.obj \
            assets/models/items/angel_feather.obj \
            assets/models/items/rear_mirror.obj \
            assets/models/items/polygonal_cohort.mtl
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "Materialize polygonal comparison cohort [polygonal-materialized]"
          git push origin HEAD:agent/polygonal-item-cohort
