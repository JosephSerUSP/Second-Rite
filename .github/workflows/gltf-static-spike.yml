name: glTF static importer spike

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tools/model-import/**"
      - ".github/workflows/gltf-static-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-normalization:
    name: Static model normalization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned development metadata without platform binaries
        run: npm ci --ignore-scripts

      - name: Prove pinned glTF SDK and static normalization gauntlet
        run: npm run test:gltf-model
