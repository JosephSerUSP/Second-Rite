name: Apply relative A/B integration patches

on:
  push:
    branches: [agent/268-270-relative-golden-ab]
    paths:
      - '.github/workflows/apply-relative-ab-patches.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/268-270-relative-golden-ab
          fetch-depth: 0
      - name: Apply bounded source and doctrine edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tools/editor/js/model-picker.js',
              "    const DEFAULT_TILT = Math.PI / 18; // runtime item_model_view: 10 degrees\n",
              "    const DEFAULT_TILT = Math.PI / 18; // runtime item_model_view: 10 degrees\n\n"
              "    function prefersReducedMotion() {\n"
              "        return typeof root.matchMedia === 'function'\n"
              "            && root.matchMedia('(prefers-reduced-motion: reduce)').matches;\n"
              "    }\n"
          )
          replace_once(
              'tools/editor/js/model-picker.js',
              "            if (this.options.autoRotate && !this.dragging && this.model && this.canvas.getClientRects().length) {\n",
              "            if (this.options.autoRotate && !prefersReducedMotion() && !this.dragging && this.model && this.canvas.getClientRects().length) {\n"
          )
          replace_once(
              'tools/editor/js/model-picker.js',
              "        transformVertex,\n        initEditorHooks\n",
              "        transformVertex,\n        prefersReducedMotion,\n        initEditorHooks\n"
          )
          replace_once(
              'tools/editor/js/model-picker.js',
              "            resolveSibling,\n            transformVertex\n",
              "            resolveSibling,\n            transformVertex,\n            prefersReducedMotion\n"
          )

          replace_once(
              'tools/editor/tests/test-model-picker.js',
              "assert.ok(Math.abs(quarterTurn[2] - 1) < 1e-10, 'quarter turn maps model X into runtime depth');\n\n",
              "assert.ok(Math.abs(quarterTurn[2] - 1) < 1e-10, 'quarter turn maps model X into runtime depth');\n\n"
              "const savedMatchMedia = globalThis.matchMedia;\n"
              "globalThis.matchMedia = query => ({ matches: query === '(prefers-reduced-motion: reduce)' });\n"
              "assert.strictEqual(ModelPicker.prefersReducedMotion(), true, 'model preview honors reduced-motion media preference');\n"
              "globalThis.matchMedia = () => ({ matches: false });\n"
              "assert.strictEqual(ModelPicker.prefersReducedMotion(), false, 'model preview rotates when reduced motion is not requested');\n"
              "if (savedMatchMedia === undefined) delete globalThis.matchMedia;\n"
              "else globalThis.matchMedia = savedMatchMedia;\n\n"
          )

          replace_once(
              'tools/golden/editor-screens.py',
              "        chrome.call(\"Emulation.setDeviceMetricsOverride\",\n"
              "                    width=VIEWPORT[0], height=VIEWPORT[1],\n"
              "                    deviceScaleFactor=1, mobile=False)\n"
              "        chrome.call(\"Page.addScriptToEvaluateOnNewDocument\", source=DETERMINISM_JS)\n",
              "        chrome.call(\"Emulation.setDeviceMetricsOverride\",\n"
              "                    width=VIEWPORT[0], height=VIEWPORT[1],\n"
              "                    deviceScaleFactor=1, mobile=False)\n"
              "        # Ask the real editor to take its accessibility-defined stable\n"
              "        # presentation path rather than adding a test-only animation flag.\n"
              "        chrome.call(\"Emulation.setEmulatedMedia\",\n"
              "                    features=[{\"name\": \"prefers-reduced-motion\",\n"
              "                               \"value\": \"reduce\"}])\n"
              "        chrome.call(\"Page.addScriptToEvaluateOnNewDocument\", source=DETERMINISM_JS)\n"
          )

          doctrine = '''- **G5/G6 have two deliberately different modes.**\n  - **Absolute:** the commands in the gate table above compare against committed\n    owner-signed references. G5 assumes the owner's real renderer and Effekseer\n    shim; G6 carries the owner's browser/font fingerprint. Absolute red/green is\n    the correctness claim and remains owner-bound.\n  - **Relative:** run the GitHub Actions workflow **Relative visual A/B**\n    (`.github/workflows/relative-golden-ab.yml`) with `gate` = `g5`, `g6`, or\n    `all`, plus `base_ref` and `candidate_ref`. It captures base A, base B, then\n    candidate on one pinned hosted runner and compares decoded RGBA pixels.\n    Read the **base A -> base B repeat control first**. Any unstable control\n    frame is named and excluded from the candidate verdict; this is mandatory\n    for G6 because live editor nondeterminism has existed (#253/#259).\n  Relative mode answers **"did this candidate alter rendering relative to the\n  base ref?"**, not **"is this rendering correct?"** It runs without the native\n  Effekseer shim. A green relative run never licenses recapturing G5/G6 goldens,\n  and a red relative run is investigated as a candidate-vs-base regression.\n'''
          replace_once(
              'AGENTS.md',
              "- G4 red = the **doc is stale**, not the engine. Run\n",
              doctrine + "- G4 red = the **doc is stale**, not the engine. Run\n"
          )
          PY

      - name: Run focused tests before committing
        shell: bash
        run: |
          node tools/editor/tests/test-model-picker.js
          python -m py_compile tools/golden/editor-screens.py

      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "Second Rite Agent"
          git config user.email "actions@users.noreply.github.com"
          git add AGENTS.md tools/editor/js/model-picker.js tools/editor/tests/test-model-picker.js tools/golden/editor-screens.py
          git diff --cached --check
          git commit -m "stabilize hosted editor capture and document relative gates"
          git push origin HEAD:agent/268-270-relative-golden-ab
