name: player membrane

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-membrane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LOVE
        # Version, URL and digest live in the action, not here (#725).
        timeout-minutes: 3
        uses: ./.github/actions/install-love
      - name: Run dedicated #375 membrane proof
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/player-membrane-stage"
          node tools/ci/stage-project-gates.js --output "$stage"
          cat > "$stage/main.lua" <<'LUA'
          function love.load()
              local loader = require("engine.data.loader")
              loader.init()
              local ok, err = pcall(dofile, "tests/player_membrane_spec.lua")
              if not ok then
                  io.stderr:write("player_membrane_spec CRASH: " .. tostring(err) .. "\n")
                  os.exit(1)
              end
              os.exit(0)
          end
          LUA
          xvfb-run -a love "$stage"
