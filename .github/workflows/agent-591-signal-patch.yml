name: agent 591 signal patch

on:
  push:
    branches: [agent/event-sprite-presentation-policy-591]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply generic signal integration
        run: python tools/agent-591-signal-patch.py
      - name: Verify patched sources
        run: |
          python -m json.tool rtp/revisions/1.0/data/engine.json >/dev/null
          node --check tools/editor/js/animation-controller-editor.js
          node tools/editor/tests/test-animation-controller-editor.js
          node tools/editor/tests/test-event-presentation.js
          git diff --check
      - name: Commit verified product patch
        run: |
          git config user.name "second-rite-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add generic Event animation signal command"
          git push