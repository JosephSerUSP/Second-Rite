name: Temporary apply selective AA patch

on:
  push:
    branches:
      - agent/836-selective-environment-aa

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/836-selective-environment-aa
          fetch-depth: 0
      - name: Apply bounded renderer patch
        run: python3 tools/tmp_apply_836.py
      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            runtime/presentation/viewport_3d.lua \
            runtime/presentation/world_pass_compositor.lua \
            projects/hichaukitoden-game/data/system.json \
            tests/test_world_pass_compositor.lua
          git diff --cached --check
          git commit -m "feat(#836): add selective environment AA"
          git push origin HEAD:agent/836-selective-environment-aa
