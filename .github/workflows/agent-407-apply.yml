name: agent 407 apply final patch

on:
  push:
    branches:
      - agent/407-persistent-game-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and apply locally verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/chunks.sha256" <<'EOF'
          b1bb03eee405f3aa650a045ae8e5816e6c0f44fa13d3b8376e1e1e0ed4fde71d  .agent/issue407.small.00
          749c6aa83d33f8222ebca0e8f949c14753cd6b6b4e04e5d6d5520bb25a18075e  .agent/issue407.small.01
          d125dd12409caf39d6644b889f0dbb07904cde48428403557882a2b54e644fc7  .agent/issue407.small.02
          a5790aac67151eb4d4a3f2eaba88776688cf73083bde8e13d559a3d36d3b601c  .agent/issue407.small.03a
          9eb501dcfe12389a1b1013e6beb80827cff3ccf3de816d5e2ce48f9c447a3cf2  .agent/issue407.small.03b
          f723238ef2f22938119c1da9bc4980ce52a3964ad58f1b33f1ccfdf2030fca26  .agent/issue407.small.03c
          be75c66cdd49382241ba375e397097cce63fcadeb06f19379e97aaa3dd41bdff  .agent/issue407.small.04
          24c1433ba8323d610ff0c86c994a90e1987ef90355d40d5d8185fe27b4cf1318  .agent/issue407.small.05
          6f58ad2bb2050110e77f26bdba9c67f99a0280d454701e3b2addf3774bdf8c25  .agent/issue407.small.06
          89e935fc9588ed8f5057579ef12d30dedee6873d6fbcd767ee47c5ccd03d243b  .agent/issue407.small.07
          5189a32ee72af0f17fd0c717cd834317829f7c87eece25ece82bc2988e3a7197  .agent/issue407.small.08
          a7ddb0c38fd20b99273c29e6d238351c74f8c86643ac0ed39a48ff5d66216563  .agent/issue407.small.09
          853ad606409b040a5d7ca508a1b6cabac3374e842e2d47419969a79cf6bfe3cb  .agent/issue407.small.10
          23862cc74cbfde6cc36dee03700dd1d44e52bc6728189d6218d477b13afeae00  .agent/issue407.small.11
          a675e5a9d8d02e2f9568ef6ed6c2495a761ec2a291e8df1bbebc6b8f720c2dc9  .agent/issue407.small.12
          bf8ada9ce3dc57aa12d5284ed2f272f425cd3bed9911681b284e807570a02c7a  .agent/issue407.small.13
          2d7e2856c27d1c05f8d2163abc8b500184a2e1679fff4b2adda19ba6a6b755b5  .agent/issue407.small.14
          EOF
          sha256sum --check "$RUNNER_TEMP/chunks.sha256"
          cat .agent/issue407.small.00 .agent/issue407.small.01 .agent/issue407.small.02 \
              .agent/issue407.small.03a .agent/issue407.small.03b .agent/issue407.small.03c \
              .agent/issue407.small.04 .agent/issue407.small.05 .agent/issue407.small.06 \
              .agent/issue407.small.07 .agent/issue407.small.08 .agent/issue407.small.09 \
              .agent/issue407.small.10 .agent/issue407.small.11 .agent/issue407.small.12 \
              .agent/issue407.small.13 .agent/issue407.small.14 \
            | base64 -d > "$RUNNER_TEMP/issue407.patch"
          echo "1e18a7db398ab76ef6a364649020cbcd07909645cbc052cb53a6d7b874252bef  $RUNNER_TEMP/issue407.patch" | sha256sum --check -
          git apply --check "$RUNNER_TEMP/issue407.patch"
          git apply "$RUNNER_TEMP/issue407.patch"
          rm -rf .agent
          rm -f .github/workflows/agent-407-apply.yml
          git config user.name "OpenAI Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement persistent Game Variables and Switches"
          git push origin HEAD:agent/407-persistent-game-state
