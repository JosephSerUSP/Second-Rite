name: Branch hygiene census

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/branch-hygiene.yml"
      - "tools/branch-hygiene/**"

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.census.outputs.main_sha }}
      main_short: ${{ steps.census.outputs.main_short }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run deterministic classifier tests
        run: python tools/branch-hygiene/test_branch_hygiene.py

      - name: Generate current census
        id: census
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/branch-hygiene.md"
          python tools/branch-hygiene/branch_hygiene.py --output "$report"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "main_short=${main_sha:0:12}" >> "$GITHUB_OUTPUT"
          cat "$report"

      - name: Upload census evidence
        uses: actions/upload-artifact@v7
        with:
          name: branch-hygiene-${{ github.run_id }}
          path: ${{ steps.census.outputs.report }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified census
        uses: actions/download-artifact@v8
        with:
          name: branch-hygiene-${{ github.run_id }}
          path: census

      - name: Publish dated census issue
        uses: actions/github-script@v7
        env:
          MAIN_SHORT: ${{ needs.verify.outputs.main_short }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('census/branch-hygiene.md', 'utf8');
            const stamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const title = `Branch hygiene census — ${stamp} — main ${process.env.MAIN_SHORT} — run ${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
