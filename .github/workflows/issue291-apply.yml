name: Issue 291 apply edits

on:
  push:
    branches: [agent/issue-291-geometry-profiles]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source edits
        run: python .github/issue291_apply.py
      - name: Remove transient editing harness
        run: rm .github/issue291_apply.py .github/workflows/issue291-apply.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "implement geometry visibility profiles"
          git push origin HEAD:agent/issue-291-geometry-profiles
