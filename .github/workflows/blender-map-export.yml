name: blender map export

on:
  push:
    branches:
      - main
      - agent/303-structured-blend-export
    paths:
      - ".github/workflows/blender-map-export.yml"
      - "projects/hichaukitoden-game/data/maps/**"
      - "projects/hichaukitoden-game/assets/**"
      - "tools/semantic-roots.js"
      - "tools/blender/**"
      - "presentation/map_renderable_bundle.lua"
      - "presentation/editor_renderable_bridge.lua"
      - "tools/editor/runtime-bridge-server.js"
      - "tools/editor/project-play.js"
      - "tools/editor/project-root.js"
  pull_request:
    paths:
      - ".github/workflows/blender-map-export.yml"
      - "projects/hichaukitoden-game/data/maps/**"
      - "projects/hichaukitoden-game/assets/**"
      - "tools/semantic-roots.js"
      - "tools/blender/**"
      - "presentation/map_renderable_bundle.lua"
      - "presentation/editor_renderable_bridge.lua"
      - "tools/editor/runtime-bridge-server.js"
      - "tools/editor/project-play.js"
      - "tools/editor/project-root.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-map-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-8-smoke:
    name: structured Map 8 .blend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      SDL_AUDIODRIVER: dummy

      LOVE_VERSION: "11.5"
      LOVE_URL: "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
      LOVE_SHA256: "BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369"

      MESA_VERSION: "26.1.6"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"

      BLENDER_VERSION: "5.0.1"
      BLENDER_URL: "https://download.blender.org/release/Blender5.0/blender-5.0.1-windows-x64.zip"
      BLENDER_SHA256: "921D77F6C505A35B2C2F6E67D4AD1C10B72418338BA0E0D3EA7F582A5E5FE46E"

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE ${{ env.LOVE_VERSION }}
        # Pinned installs take 1-10s; an unbounded one hung for 909s and was
        # cancelled at 15 minutes, producing a red check unrelated to the diff
        # (#725). Fail fast and legibly instead.
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "love.zip"
          $dest = Join-Path $env:RUNNER_TEMP "love"
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "love-$env:LOVE_VERSION-win64.zip SHA256: $sha"
          if ($sha -ne $env:LOVE_SHA256) {
            throw "LOVE archive digest mismatch`n  expected: $($env:LOVE_SHA256)`n  actual:   $sha"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $love = Get-ChildItem -Path $dest -Recurse -Filter "love.exe" |
                  Select-Object -First 1 -ExpandProperty FullName
          $lovec = Get-ChildItem -Path $dest -Recurse -Filter "lovec.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $love -or -not $lovec) { throw "LOVE executables not found under $dest" }
          $reported = & $lovec --version 2>&1 | Out-String
          Write-Host "reported: $($reported.Trim())"
          if ($reported -notmatch [regex]::Escape($env:LOVE_VERSION)) {
            throw "expected LOVE $env:LOVE_VERSION, got: $($reported.Trim())"
          }
          $loveDir = Split-Path -Parent $lovec
          "LOVE_PATH=$love" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOVEC=$lovec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE_DIR=$loveDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $loveDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Mesa software OpenGL ${{ env.MESA_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"

          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          Write-Host "mesa3d-$env:MESA_VERSION-release-msvc.7z SHA256: $sha"
          if ($sha -ne $env:MESA_SHA256) {
            throw "Mesa archive digest mismatch`n  expected: $($env:MESA_SHA256)`n  actual:   $sha"
          }

          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }

          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
                 Where-Object { $_.FullName -match "x64" } |
                 Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found in Mesa archive" }

          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force

          $probe = Join-Path $env:RUNNER_TEMP "glprobe"
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          @'
          function love.load()
            local name, version, vendor, device = love.graphics.getRendererInfo()
            print(string.format("renderer: %s | %s | %s | %s", name, version, vendor, device))
            love.event.quit(0)
          end
          '@ | Set-Content -Path (Join-Path $probe "main.lua") -Encoding utf8
          $info = & $env:LOVEC $probe 2>&1 | Out-String
          Write-Host $info.Trim()
          if ($info -notmatch "renderer:") { throw "LOVE could not create an OpenGL context" }

      - name: Install pinned Blender ${{ env.BLENDER_VERSION }} portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender.zip"
          $dest = Join-Path $env:RUNNER_TEMP "blender"

          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "blender-$env:BLENDER_VERSION-windows-x64.zip SHA256: $sha"
          if ($sha -ne $env:BLENDER_SHA256) {
            throw "Blender archive digest mismatch`n  expected: $($env:BLENDER_SHA256)`n  actual:   $sha"
          }

          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $blender = Get-ChildItem -Path $dest -Recurse -Filter "blender.exe" |
                     Select-Object -First 1 -ExpandProperty FullName
          if (-not $blender) { throw "blender.exe not found under $dest" }

          $reported = & $blender --version 2>&1 | Out-String
          Write-Host $reported.Trim()
          if ($reported -notmatch [regex]::Escape($env:BLENDER_VERSION)) {
            throw "expected Blender $env:BLENDER_VERSION, got: $($reported.Trim())"
          }
          "BLENDER_PATH=$blender" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Host-side exporter contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/blender/export_map_blend.js
          node --test tools/blender/tests/test_export_map_blend.js
          python -m unittest tools.blender.tests.test_map_bundle_scene

      - name: Export Map 8 through runtime authority
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $relative = "projects/hichaukitoden-game/exports/maps/ci-map8.blend"
          node tools/blender/export_map_blend.js 8 --output exports/maps/ci-map8.blend
          if ($LASTEXITCODE -ne 0) { throw "structured map export failed (exit $LASTEXITCODE)" }
          $blend = Resolve-Path $relative
          Write-Host "exported: $blend"
          "CI_MAP_BLEND=$blend" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reopen and verify .blend structure in Blender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:BLENDER_PATH --background --factory-startup `
            --python tools/blender/tests/verify_map_blend.py -- $env:CI_MAP_BLEND 8
          if ($LASTEXITCODE -ne 0) { throw "Blender structural verification failed (exit $LASTEXITCODE)" }

      - name: Assert smoke left tracked source clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "Blender map export smoke modified tracked source"
          }

      - name: Upload representative Map 8 .blend
        uses: actions/upload-artifact@v4
        with:
          name: map-8-structured-blend-${{ github.sha }}
          path: projects/hichaukitoden-game/exports/maps/ci-map8.blend
          if-no-files-found: error
          retention-days: 7
