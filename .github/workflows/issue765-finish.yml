name: issue 765 finalize direct consumer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: issue765-finalize-direct-consumer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'exp/765-direct-three-definitions'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/765-direct-three-definitions
          fetch-depth: 0
          persist-credentials: true

      - name: Restore explicit missing-material fidelity seam
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          path = Path('tools/editor/js/three-editor-viewport-base.js')
          source = path.read_text(encoding='utf-8')
          marker = """        function materialFor(id) {\n            return materialById.get(id)\n                || WorldFidelity.decorateResolvedWorldMaterial(new THREE.MeshStandardMaterial({\n                    color: 0x777777, roughness: 0.9, side: THREE.DoubleSide, vertexColors: true\n                }));\n        }\n"""
          if source.count(marker) != 1:
              raise SystemExit(f'expected one materialFor helper, found {source.count(marker)}')
          replacement = marker + """        function materialForSurface(surface) {\n            return materialById.get(surface.material)\n                || WorldFidelity.decorateResolvedWorldMaterial(new THREE.MeshStandardMaterial({\n                    color: 0x777777, roughness: 0.9, side: THREE.DoubleSide, vertexColors: true\n                }));\n        }\n"""
          source = source.replace(marker, replacement, 1)
          if source.count('materialFor(surface.material)') != 2:
              raise SystemExit(f'expected two surface material calls, found {source.count("materialFor(surface.material)")}')
          source = source.replace('materialFor(surface.material)', 'materialForSurface(surface)')
          path.write_text(source, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'viewport fidelity seam correction failed' }

      - name: Clean one-off evidence hooks and commit final source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Second Rite CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/studio-host.yml tools/editor/test-project-root.js
          git rm .github/workflows/issue765-finish.yml .github/workflows/issue765-evidence.yml
          git add tools/editor/js/three-editor-viewport-base.js .github/workflows/studio-host.yml tools/editor/test-project-root.js
          git commit -m 'fix(#765): finalize direct-consumer fidelity path'
          if ($LASTEXITCODE -ne 0) { throw 'final cleanup commit failed' }
          git push origin HEAD:exp/765-direct-three-definitions
          if ($LASTEXITCODE -ne 0) { throw 'final cleanup push failed' }
