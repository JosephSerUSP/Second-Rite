name: issue 754 production worker benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: issue754-production-worker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.head_ref == 'docs/754-live-runtime-exploration'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SDL_AUDIODRIVER: dummy
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
      MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned LÖVE 11.5
        timeout-minutes: 3
        uses: ./.github/actions/install-love
      - name: Install pinned Mesa software OpenGL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesa -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 OpenGL missing' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') $env:LOVE_DIR -Force
      - name: Measure production worker lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --expose-gc tools/editor/bench-runtime-production-worker.js --love $env:LOVE_PATH --map 2
          if ($LASTEXITCODE -ne 0) { throw "production worker benchmark failed (exit $LASTEXITCODE)" }
