name: tileset format experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tileset-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-models:
    name: resource-model comparison
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run resource-model pressure tests
        run: node --test tools/experiments/tileset-format/resource-models.test.js tools/experiments/tileset-format/compile-surface-palette.test.js
