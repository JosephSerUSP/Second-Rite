name: blender item source

on:
  pull_request:
    paths:
      - assets/authoring/items/**
      - assets/models/items/**
      - projects/hichaukitoden-game/assets/authoring/items/**
      - projects/hichaukitoden-game/assets/models/items/**
      - tools/blender/**
      - tools/asset-language/contract.json
      - tools/asset-language/materials.json
      - .gitattributes
      - docs/asset-pipeline/BLENDER_CORE.md
      - .github/workflows/blender-item-source.yml
      - .github/actions/install-blender/**
  push:
    branches: [main]
    paths:
      - assets/authoring/items/**
      - assets/models/items/**
      - projects/hichaukitoden-game/assets/authoring/items/**
      - projects/hichaukitoden-game/assets/models/items/**
      - tools/blender/**
      - tools/asset-language/contract.json
      - tools/asset-language/materials.json
      - .gitattributes
      - docs/asset-pipeline/BLENDER_CORE.md
      - .github/workflows/blender-item-source.yml
      - .github/actions/install-blender/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  item-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test runtime OBJ and material finalization
        run: |
          python tools/blender/tests/test_validate_item_obj_runtime.py
          python tools/blender/tests/test_item_mtl_runtime.py

      # test_asset_core_host.py ran in no workflow, so the toolkit's integrity
      # records rotted unobserved: two entries had drifted from the files they
      # describe and two more recorded the wrong line-ending form (#901). The
      # manifest is only worth keeping if something checks it, and these suites
      # need neither Blender nor a display.
      - name: Toolkit integrity records and asset-core host contract
        run: |
          python -m unittest discover -s tools/blender/tests -p 'test_asset_core_host.py' -v
          python -m unittest discover -s tools/blender/tests -p 'test_compile_item_blend_validation.py' -v
          python -m unittest discover -s tools/blender/tests -p 'test_compile_item_blends_host.py' -v
          python -m unittest discover -s tools/blender/tests -p 'test_blender_locator.py' -v

      # Blender numbered backups are rejected repository-wide by the
      # repo-hygiene job in verify.yml (#671). The check that lived here
      # scanned only assets/authoring/items, and this workflow is itself
      # path-filtered to that tree, so it could never fail for a backup
      # committed anywhere else. Keeping a second narrow copy would imply
      # coverage it does not have.

      - name: Install headless Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgbm1 xvfb xauth

      - name: Install pinned Blender
        # Version, URL and digest live in tools/blender/blender-pin.json (#1254).
        uses: ./.github/actions/install-blender

      # A Geometry Nodes tree only evaluates inside Blender, so the ground
      # cover's slope limit, keep-out, budget and determinism are checked on
      # the realised mesh by a headless run of the pinned Blender (#1257).
      - name: Ground cover Geometry Nodes headless check
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python -m unittest tools.blender.tests.test_ground_cover -v

      # Our own asset library carries SR_GroundCover as a derived .blend that is not
      # byte-reproducible, so identity with ground_cover.build_group() is judged by
      # structure in the pinned Blender (#1257).
      - name: Asset library group matches the builder
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python -m unittest tools.blender.tests.test_asset_library_group -v

      # A room's atlas is packed tight and can be spent where the camera looks (#877); the
      # allocator measures demand by rendering, so it runs in the pinned Blender.
      - name: Atlas allocation
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python -m unittest tools.blender.tests.test_atlas_allocation -v

      # The exterior bake once copied each object's base mesh, so a Geometry
      # Nodes host baked to nothing and nothing said so. This joins a small town
      # source through the real rebuild and counts what reaches the render mesh.
      - name: Exterior bake carries Geometry Nodes output
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python -m unittest tools.blender.tests.test_exterior_bake_source -v

      - name: Smoke a real saved Blend through the production compiler
        shell: bash
        run: |
          set -euxo pipefail
          fixture=projects/hichaukitoden-game/assets/authoring/items/ci_item_source_fixture.blend
          output=/tmp/second-rite-item-source-fixture
          rm -f "$fixture" "$fixture"[0-9]*
          rm -rf "$output"
          xvfb-run -a "$BLENDER_EXECUTABLE" --background --python tools/blender/tests/create_item_source_fixture.py
          sha256sum "$fixture" > /tmp/item-fixture-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py \
            --source "$fixture" \
            --output-dir "$output"
          sha256sum "$fixture" > /tmp/item-fixture-after.sha256
          diff -u /tmp/item-fixture-before.sha256 /tmp/item-fixture-after.sha256
          test -s "$output/ci_item_source_fixture.obj"
          test -s "$output/ci_item_source_fixture.mtl"
          rm -f "$fixture" "$fixture"[0-9]*
          git diff --exit-code -- projects/hichaukitoden-game/assets/authoring/items

      - name: Compile committed sources read-only and compare runtime products
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python tools/blender/compile_item_blends.py --check
          git diff --exit-code -- projects/hichaukitoden-game/assets/authoring/items
