name: refine Vial of Second Breath V3

on:
  workflow_dispatch:
  push:
    branches: [agent/relic-showcase-blend-content]
    paths:
      - .github/workflows/refine-vial-second-breath-v3.yml
      - tools/blender/refine_vial_second_breath_v3.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relic-showcase-blend-content
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render accepted V2 board
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-v2.png
          image=$(find "$HOME" -type f -name relic-v2.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-v2.png

      - name: Edit Vial source profile directly
        shell: bash
        run: |
          set -euxo pipefail
          test -s assets/authoring/items/vial_of_second_breath.blend
          xvfb-run -a "$BLENDER_BIN" --background assets/authoring/items/vial_of_second_breath.blend --python tools/blender/refine_vial_second_breath_v3.py
          rm -f assets/authoring/items/vial_of_second_breath.blend1 assets/authoring/items/vial_of_second_breath.blend2

      - name: Compile Vial and validate runtime corpus
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source assets/authoring/items/vial_of_second_breath.blend
          python tools/asset-production/check_item_models.py

      - name: Prove full Blender source corpus remains reproducible
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/*.blend > /tmp/v3-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/*.blend > /tmp/v3-source-after.sha256
          diff -u /tmp/v3-source-before.sha256 /tmp/v3-source-after.sha256

      - name: Render V3 board
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-v3.png
          image=$(find "$HOME" -type f -name relic-v3.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-v3.png

      - uses: actions/upload-artifact@v4
        with:
          name: vial-second-breath-v3-review
          path: |
            /tmp/relic-v2.png
            /tmp/relic-v3.png
          if-no-files-found: error

      - name: Commit directly edited Vial source and runtime product
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/authoring/items/vial_of_second_breath.blend assets/models/items/vial_of_second_breath.obj assets/models/items/vial_of_second_breath.mtl
          if git diff --cached --quiet; then
            echo "Vial V3 already materialized."
          else
            git commit -m "Refine Vial breath-feather source profile"
            git push origin HEAD:agent/relic-showcase-blend-content
          fi
