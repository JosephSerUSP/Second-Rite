name: tmp integration 399

on:
  push:
    branches: [agent/394-picture-transform-formulas]

permissions:
  contents: write

concurrency:
  group: tmp-integration-399
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/394-picture-transform-formulas
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh onto current main and apply bounded ownership correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(data/engine\.json|engine/interpreter\.lua|engine/interpreter_core\.lua)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

          # Current-main authority first. #399 then reapplies only its bounded deltas.
          git checkout origin/main -- data/engine.json engine/interpreter.lua engine/interpreter_core.lua

          python - <<'PY'
          import json
          from pathlib import Path

          # Preserve current-main engine registry, changing only the ten authored
          # image-picture transform fields to the existing formula authoring type.
          path = Path('data/engine.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          wanted = {'SHOW_IMAGE_PICTURE', 'MOVE_IMAGE_PICTURE'}
          fields = {'x', 'y', 'opacity', 'scale', 'rotation'}
          changed = 0
          seen = set()
          for command in data.get('commands', []):
              if command.get('id') not in wanted:
                  continue
              seen.add(command['id'])
              for param in command.get('params', []):
                  if param.get('key') in fields:
                      if param.get('type') != 'number':
                          raise SystemExit(f"unexpected pre-refresh type for {command['id']}.{param.get('key')}: {param.get('type')}")
                      param['type'] = 'formula'
                      changed += 1
          if seen != wanted or changed != 10:
              raise SystemExit(f'expected both picture commands and 10 transform fields, saw {seen} / {changed}')
          ids = {c.get('id') for c in data.get('commands', [])}
          zombies = {'LIST_CAMPAIGNS', 'SWITCH_CAMPAIGN'} & ids
          if zombies:
              raise SystemExit(f'Campaign registry vocabulary resurrected: {sorted(zombies)}')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Command semantics and the presentation boundary already live in
          # interpreter_core. Resolve only the five present transform fields,
          # on a copied command table, through the canonical evalFormula helper.
          path = Path('engine/interpreter_core.lua')
          text = path.read_text(encoding='utf-8')
          old = '''handlers.SHOW_IMAGE_PICTURE = function(cmd)
              present("showImagePicture", cmd)
          end

          handlers.MOVE_IMAGE_PICTURE = function(cmd)
              present("moveImagePicture", cmd)
          end'''
          new = '''local IMAGE_PICTURE_TRANSFORM_FIELDS = { "x", "y", "opacity", "scale", "rotation" }

          local function resolveImagePictureSpec(commandId, cmd, ctx)
              local resolved = {}
              for key, value in pairs(cmd or {}) do
                  resolved[key] = value
              end
              for _, field in ipairs(IMAGE_PICTURE_TRANSFORM_FIELDS) do
                  local value = cmd and cmd[field]
                  if value ~= nil then
                      local result = evalFormula(value, ctx)
                      if type(result) ~= "number" then
                          error(commandId .. "." .. field .. " must resolve to a number, got "
                              .. type(result), 0)
                      end
                      resolved[field] = result
                  end
              end
              return resolved
          end

          handlers.SHOW_IMAGE_PICTURE = function(cmd, ctx)
              present("showImagePicture", resolveImagePictureSpec("SHOW_IMAGE_PICTURE", cmd, ctx))
          end

          handlers.MOVE_IMAGE_PICTURE = function(cmd, ctx)
              present("moveImagePicture", resolveImagePictureSpec("MOVE_IMAGE_PICTURE", cmd, ctx))
          end'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one current-main image-picture handler block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          # #394-specific machinery must be absent from the public facade.
          if grep -q -E 'activeFormulaContext|presentationProxy|makeFormulaContext|formulaEngine = require\("engine\.formula"\)' engine/interpreter.lua; then
            echo "#394 facade machinery survived the refresh"
            exit 1
          fi

          # #397 verification must survive the merge exactly in the canonical workflow.
          grep -Fq 'tools/export/rtp-resource-resolver.test.js' .github/workflows/verify.yml

          # The ordinary authored fixture/test remain the feature proof.
          test -f tests/fixtures/scene_picture_formula_probe.json
          grep -Fq 'picture_formula_probe' tests/test_autorun_parallel_characterization.lua

          git rm .github/workflows/tmp-integration-399.yml
          git add data/engine.json engine/interpreter.lua engine/interpreter_core.lua tests/fixtures/scene_picture_formula_probe.json tests/test_autorun_parallel_characterization.lua
          git diff --check --cached

          git commit -m "runtime: resolve picture transforms in interpreter core" -m "Refreshes #399 onto current main after #395, keeps the existing registry/fixture/failure/interpolation proof, and moves image-picture transform formula resolution to interpreter_core's canonical evalFormula/present boundary. Reverts the #394-specific facade proxy/context/pcall machinery.\n\nAgent-Signature:\nplatform: ChatGPT\nmodel: GPT-5.6 Sol\nrole: integration\npr: #399\nissue: #394\nbase: $(git rev-parse origin/main)"
          git push origin HEAD:agent/394-picture-transform-formulas
