name: Render item cohort A-B-C comparison

on:
  push:
    branches:
      - agent/swept-item-cohort
    paths:
      - .github/workflows/swept-cohort-compare-artifact.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/swept-item-cohort
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Render software comparison boards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math, zipfile

          root = Path.cwd()
          item_dir = root / "assets" / "models" / "items"
          out = root / "comparison-artifacts"
          out.mkdir(exist_ok=True)

          def load_mtl(path):
              mats, current = {}, None
              for line in path.read_text(encoding="utf-8").splitlines():
                  bits = line.split()
                  if not bits: continue
                  if bits[0] == "newmtl": current = bits[1]
                  elif bits[0] == "Kd" and current:
                      mats[current] = tuple(int(max(0,min(1,float(v))) * 255) for v in bits[1:4])
              return mats

          materials = {}
          for filename in ["relic_showcase.mtl", "polygonal_cohort.mtl", "swept_cohort.mtl"]:
              materials.update(load_mtl(item_dir / filename))

          def load_obj(path):
              verts, faces, mat = [], [], None
              for line in path.read_text(encoding="utf-8").splitlines():
                  bits = line.split()
                  if not bits: continue
                  if bits[0] == "v": verts.append(tuple(map(float,bits[1:4])))
                  elif bits[0] == "usemtl": mat = bits[1]
                  elif bits[0] == "f":
                      idx = [int(c.split('/')[0])-1 for c in bits[1:]]
                      for i in range(1,len(idx)-1): faces.append((idx[0],idx[i],idx[i+1],mat))
              return verts, faces

          def rotate(v,yaw,tilt):
              x,y,z=v; a=math.radians(yaw); b=math.radians(tilt)
              x,z=x*math.cos(a)+z*math.sin(a),-x*math.sin(a)+z*math.cos(a)
              y,z=y*math.cos(b)-z*math.sin(b),y*math.sin(b)+z*math.cos(b)
              return x,y,z

          def normal(a,b,c):
              u=tuple(b[i]-a[i] for i in range(3)); v=tuple(c[i]-a[i] for i in range(3))
              n=(u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0])
              L=math.sqrt(sum(q*q for q in n)) or 1
              return tuple(q/L for q in n)

          def render(path,yaw=24,tilt=16,size=220):
              verts,faces=load_obj(path); rv=[rotate(v,yaw,tilt) for v in verts]
              xs=[v[0] for v in rv]; ys=[v[1] for v in rv]
              cx=(min(xs)+max(xs))/2; cy=(min(ys)+max(ys))/2
              extent=max(max(xs)-min(xs),max(ys)-min(ys),1e-6); scale=size*.74/extent
              pts=[((x-cx)*scale+size/2,size/2-(y-cy)*scale,z) for x,y,z in rv]
              im=Image.new('RGB',(size,size),(23,23,27)); d=ImageDraw.Draw(im)
              light=(-.45,.55,.70); ll=math.sqrt(sum(q*q for q in light)); light=tuple(q/ll for q in light)
              tris=[]
              for ia,ib,ic,mat in faces:
                  n=normal(rv[ia],rv[ib],rv[ic])
                  if n[2]<0: n=tuple(-q for q in n)
                  lum=max(.26,min(1,.40+.60*sum(n[i]*light[i] for i in range(3))))
                  base=materials.get(mat,(150,150,150)); col=tuple(int(v*lum) for v in base)
                  z=sum(pts[i][2] for i in (ia,ib,ic))/3
                  tris.append((z,[pts[ia][:2],pts[ib][:2],pts[ic][:2]],col))
              for _,poly,col in sorted(tris,key=lambda t:t[0]): d.polygon(poly,fill=col)
              return im, len(verts), len(faces)

          triples=[
              ("Forbidden Lamp","forbidden_lamp.obj","Gas Mask","gas_mask.obj","Cerberus Fang","cerberus_fang.obj","assembled volume / layered shell / bent biological volume"),
              ("Town Portal","town_portal.obj","Silver Glasses","silver_glasses.obj","Molten Manacle","molten_manacle.obj","axial rings / planar open frames / free spatial loops"),
              ("Crossing Writ","crossing_writ.obj","Greatsword","greatsword.obj","Barbed Spear","barbed_spear.obj","flattened parts / extruded outline / branching weapon gesture"),
              ("Smoke Bell","smoke_bell.obj","Death Sickle","death_sickle.obj","Water Scepter","water_scepter.obj","revolved curve / faceted arc / breaking 3D wave"),
              ("Mourning Ribbon","mourning_ribbon.obj","Moth Cloak","moth_cloak.obj","Hermes' Boots","hermes_boots.obj","semantic bands / explicit plates / body-following loft"),
              ("First Scale","first_scale.obj","Angel Feather","angel_feather.obj","Phoenix Pinion","phoenix_pinion.obj","squashed volume / graphic vanes / depth-aware vanes"),
              ("Bell Salt","bell_salt.obj","Mirror Armor","mirror_armor.obj","Blackroot","blackroot.obj","nested sculpture / hard-surface layers / branching gesture graph"),
              ("Sealed Reliquary","sealed_reliquary.obj","Rear Mirror","rear_mirror.obj","Mimic Tongue","mimic_tongue.obj","ornate assembly / economical frame / soft twisting ribbon"),
          ]

          colw=430; W=colw*3; rowh=270; H=82+rowh*8
          board=Image.new('RGB',(W,H),(12,12,15)); d=ImageDraw.Draw(board)
          headers=["A — semantic sculpture","B — polygonal fabrication","C — spatial gesture / sweep"]
          for c,h in enumerate(headers): d.text((c*colw+16,18),h,fill=(238,238,242))
          d.text((16,48),"same materials, same software view; geometry grammar is the variable",fill=(150,150,160))
          for row,entry in enumerate(triples):
              an,af,bn,bf,cn,cf,theme=entry; y=80+row*rowh
              entries=[(an,af),(bn,bf),(cn,cf)]
              for c,(name,fn) in enumerate(entries):
                  x=c*colw+12
                  im,v,f=render(item_dir/fn,size=218); board.paste(im,(x,y))
                  d.text((x+226,y+28),name,fill=(235,235,235))
                  d.text((x+226,y+54),f"{v}v / {f}f",fill=(160,160,170))
                  if c==2:
                      # Theme sits in the right column so the row remains readable without crowding all three.
                      words=theme.split(' / ')
                      for i,text in enumerate(words): d.text((x+226,y+94+i*18),text,fill=(190,170,120))
              d.line((12,y+248,W-12,y+248),fill=(45,45,52))
          board.save(out/"batch-abc-comparison.png")

          c_items=[("Water Scepter","water_scepter.obj"),("Hermes' Boots","hermes_boots.obj"),("Mimic Tongue","mimic_tongue.obj"),("Cerberus Fang","cerberus_fang.obj"),("Blackroot","blackroot.obj"),("Molten Manacle","molten_manacle.obj"),("Barbed Spear","barbed_spear.obj"),("Phoenix Pinion","phoenix_pinion.obj")]
          views=[(20,10),(110,10),(45,70),(45,-55)]
          cell=190; label=170; rowh=212
          sheet=Image.new('RGB',(label+4*cell,8*rowh+42),(14,14,17)); sd=ImageDraw.Draw(sheet)
          for c,t in enumerate(["3/4","side","top","underside"]): sd.text((label+c*cell+65,14),t,fill=(210,210,215))
          for r,(name,fn) in enumerate(c_items):
              y=42+r*rowh; sd.text((10,y+86),name,fill=(235,235,235))
              for c,(yaw,tilt) in enumerate(views):
                  im,_,_=render(item_dir/fn,yaw,tilt,cell); sheet.paste(im,(label+c*cell,y))
          sheet.save(out/"batch-c-four-angle.png")

          source_files=[
              "forbidden_lamp.obj","town_portal.obj","crossing_writ.obj","smoke_bell.obj","mourning_ribbon.obj","first_scale.obj","bell_salt.obj","sealed_reliquary.obj","relic_showcase.mtl",
              "greatsword.obj","death_sickle.obj","silver_glasses.obj","gas_mask.obj","moth_cloak.obj","mirror_armor.obj","angel_feather.obj","rear_mirror.obj","polygonal_cohort.mtl",
              "water_scepter.obj","hermes_boots.obj","mimic_tongue.obj","cerberus_fang.obj","blackroot.obj","molten_manacle.obj","barbed_spear.obj","phoenix_pinion.obj","swept_cohort.mtl",
          ]
          with zipfile.ZipFile(out/"batch-abc-models.zip","w",zipfile.ZIP_DEFLATED) as z:
              for f in source_files: z.write(item_dir/f,arcname=f)
              for f in [
                  root/"tools/asset-production/build_relic_showcase.py",
                  root/"tools/asset-production/build_polygonal_item_cohort.py",
                  root/"tools/asset-production/poly_parts.py",
                  root/"tools/asset-production/build_swept_item_cohort.py",
                  root/"tools/asset-production/sweep_parts.py",
              ]:
                  z.write(f,arcname=f.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: item-cohort-abc-comparison
          path: comparison-artifacts/
          retention-days: 7
