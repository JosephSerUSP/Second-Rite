name: blender map export

on:
  push:
    branches:
      - main
      - agent/303-structured-blend-export
    paths:
      - ".github/workflows/blender-map-export.yml"
      - "projects/hichaukitoden-game/data/maps/**"
      - "projects/hichaukitoden-game/assets/**"
      - "tools/semantic-roots.js"
      - "tools/blender/**"
      - "presentation/map_renderable_bundle.lua"
      - "presentation/editor_renderable_bridge.lua"
      - "studio/editor/runtime-bridge-server.js"
      - "studio/editor/project-play.js"
      - "studio/editor/project-root.js"
  pull_request:
    paths:
      - ".github/workflows/blender-map-export.yml"
      - "projects/hichaukitoden-game/data/maps/**"
      - "projects/hichaukitoden-game/assets/**"
      - "tools/semantic-roots.js"
      - "tools/blender/**"
      - "presentation/map_renderable_bundle.lua"
      - "presentation/editor_renderable_bridge.lua"
      - "studio/editor/runtime-bridge-server.js"
      - "studio/editor/project-play.js"
      - "studio/editor/project-root.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-map-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-8-smoke:
    name: structured Map 8 .blend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      SDL_AUDIODRIVER: dummy



      BLENDER_VERSION: "5.0.1"
      BLENDER_URL: "https://download.blender.org/release/Blender5.0/blender-5.0.1-windows-x64.zip"
      BLENDER_SHA256: "921D77F6C505A35B2C2F6E67D4AD1C10B72418338BA0E0D3EA7F582A5E5FE46E"

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE
        # Version, URL and digest live in the action, not here (#725).
        timeout-minutes: 3
        uses: ./.github/actions/install-love
        with:
          # this job invokes `lovec` bare (tools/golden/check*.ps1)
          add-to-path: "true"
      - name: Install Mesa software OpenGL
        # Version, URL and digest live in the action, not here (#725).
        uses: ./.github/actions/install-mesa

      - name: Install pinned Blender ${{ env.BLENDER_VERSION }} portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender.zip"
          $dest = Join-Path $env:RUNNER_TEMP "blender"

          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "blender-$env:BLENDER_VERSION-windows-x64.zip SHA256: $sha"
          if ($sha -ne $env:BLENDER_SHA256) {
            throw "Blender archive digest mismatch`n  expected: $($env:BLENDER_SHA256)`n  actual:   $sha"
          }

          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $blender = Get-ChildItem -Path $dest -Recurse -Filter "blender.exe" |
                     Select-Object -First 1 -ExpandProperty FullName
          if (-not $blender) { throw "blender.exe not found under $dest" }

          $reported = & $blender --version 2>&1 | Out-String
          Write-Host $reported.Trim()
          if ($reported -notmatch [regex]::Escape($env:BLENDER_VERSION)) {
            throw "expected Blender $env:BLENDER_VERSION, got: $($reported.Trim())"
          }
          "BLENDER_PATH=$blender" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Host-side exporter contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/blender/export_map_blend.js
          node --test tools/blender/tests/test_export_map_blend.js
          python -m unittest tools.blender.tests.test_map_bundle_scene

      - name: Export Map 8 through runtime authority
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $relative = "projects/hichaukitoden-game/exports/maps/ci-map8.blend"
          node tools/blender/export_map_blend.js 8 --output exports/maps/ci-map8.blend
          if ($LASTEXITCODE -ne 0) { throw "structured map export failed (exit $LASTEXITCODE)" }
          $blend = Resolve-Path $relative
          Write-Host "exported: $blend"
          "CI_MAP_BLEND=$blend" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reopen and verify .blend structure in Blender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:BLENDER_PATH --background --factory-startup `
            --python tools/blender/tests/verify_map_blend.py -- $env:CI_MAP_BLEND 8
          if ($LASTEXITCODE -ne 0) { throw "Blender structural verification failed (exit $LASTEXITCODE)" }

      - name: Assert smoke left tracked source clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "Blender map export smoke modified tracked source"
          }

      - name: Upload representative Map 8 .blend
        uses: actions/upload-artifact@v4
        with:
          name: map-8-structured-blend-${{ github.sha }}
          path: projects/hichaukitoden-game/exports/maps/ci-map8.blend
          if-no-files-found: error
          retention-days: 7
