name: tileset resource runtime experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tileset-resource-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed-family-runtime:
    name: derive mixed Surface palette and render it
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      LOVE_URL: "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
      LOVE_SHA256: "BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"
      SDL_AUDIODRIVER: "dummy"

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE 11.5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "love.zip"
          $dest = Join-Path $env:RUNNER_TEMP "love"
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($sha -ne $env:LOVE_SHA256) { throw "LOVE archive digest mismatch: $sha" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $lovec = Get-ChildItem -Path $dest -Recurse -Filter "lovec.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $lovec) { throw "lovec.exe not found" }
          $loveDir = Split-Path -Parent $lovec
          "LOVEC=$lovec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE_DIR=$loveDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Mesa software OpenGL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa archive digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
                 Where-Object { $_.FullName -match "x64" } |
                 Select-Object -First 1
          if (-not $dll) { throw "x64 opengl32.dll not found" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force
          $env:LOVE_DIR | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Assemble derived-packing specimen from real source families
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "surface-palette-packer"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item tools/experiments/tileset-format/resource-pack-preview/main.lua (Join-Path $stage "main.lua")
          Copy-Item tools/experiments/tileset-format/resource-pack-preview/conf.lua (Join-Path $stage "conf.lua")
          Copy-Item assets/tilesets/dungeon_001.png (Join-Path $stage "dungeon.png")
          Copy-Item assets/tilesets/dungeon_001_heightmap.png (Join-Path $stage "dungeon-height.png")
          Copy-Item assets/textures/Stillnight_BellrootVigil.png (Join-Path $stage "bellroot.png")
          Copy-Item assets/textures/Stillnight_BellrootVigil_heightmap.png (Join-Path $stage "bellroot-height.png")
          Copy-Item assets/textures/Stillnight_BellrootVigil_glow.png (Join-Path $stage "bellroot-glow.png")
          $output = & $env:LOVEC $stage 2>&1 | Out-String
          Write-Host $output.Trim()
          if ($LASTEXITCODE -ne 0) { throw "Surface palette packer failed (exit $LASTEXITCODE)" }
          if ($output -notmatch "SURFACE_PALETTE_PACK OK") { throw "packer did not report success" }
          $save = Get-ChildItem -Path $env:APPDATA -Recurse -Filter "mixed-albedo.png" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $save) { throw "derived mixed atlas not found" }
          $packDir = $save.DirectoryName
          foreach ($name in @("dungeon-albedo.png", "dungeon-height.png", "dungeon-glow.png", "mixed-albedo.png", "mixed-height.png", "mixed-glow.png", "zone-albedo.png", "zone-height.png", "zone-glow.png", "provenance.txt")) {
            if (-not (Test-Path (Join-Path $packDir $name))) { throw "missing packer output $name" }
          }
          "PACK_DIR=$packDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $evidence = Join-Path $env:RUNNER_TEMP "surface-palette-runtime"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          "RESOURCE_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Render dungeon control and mixed-family bundle through real preview-map
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($kind in @("dungeon", "mixed")) {
            python tools/experiments/tileset-format/resource-runtime-spike.py install $kind $env:PACK_DIR
            $log = Join-Path $env:RESOURCE_EVIDENCE "$kind.txt"
            $png = Join-Path $env:RESOURCE_EVIDENCE "$kind.png"
            $output = & $env:LOVEC . preview-map 13 8 5 N 2>&1 | Out-String
            $output | Set-Content -Path $log -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "preview-map $kind failed (exit $LASTEXITCODE)" }
            python tools/experiments/tileset-format/resource-runtime-spike.py decode-preview $log $png
            if ((Get-Item $png).Length -lt 2000) { throw "$kind preview suspiciously small" }
            Copy-Item "assets/experiments/tileset-format-resource-runtime/provenance-$kind.json" (Join-Path $env:RESOURCE_EVIDENCE "provenance-$kind.json")
          }
          $control = (Get-FileHash (Join-Path $env:RESOURCE_EVIDENCE "dungeon.png") -Algorithm SHA256).Hash
          $mixed = (Get-FileHash (Join-Path $env:RESOURCE_EVIDENCE "mixed.png") -Algorithm SHA256).Hash
          if ($control -eq $mixed) { throw "mixed-family derived bundle did not change the real viewport" }
          Write-Host "SURFACE_PALETTE_RUNTIME control=$control mixed=$mixed"

      - name: Apply CI-only facing-space zone wall lookup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git checkout -- data/tilesets/dungeon_default.json data/maps/13.json
          python tools/experiments/tileset-format/zone-runtime-spike.py patch-renderer
          python tools/experiments/tileset-format/zone-runtime-spike.py install-bundle $env:PACK_DIR
          $diff = (git diff -- presentation/viewport_3d.lua | Out-String)
          if ($diff -notmatch "#558 FACING-SPACE ZONE WALL SPIKE") { throw "zone renderer patch marker missing" }

      - name: Render same divider wall from both sides with and without crypt zone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($case in @("default", "crypt")) {
            python tools/experiments/tileset-format/zone-runtime-spike.py set-map-case $case
            foreach ($view in @(@("west", "3", "3", "E"), @("east", "7", "3", "W"))) {
              $name, $x, $y, $dir = $view
              $stem = "$case-$name"
              $log = Join-Path $env:RESOURCE_EVIDENCE "$stem.txt"
              $png = Join-Path $env:RESOURCE_EVIDENCE "$stem.png"
              $output = & $env:LOVEC . preview-map 13 $x $y $dir 2>&1 | Out-String
              $output | Set-Content -Path $log -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw "preview-map $stem failed (exit $LASTEXITCODE)" }
              python tools/experiments/tileset-format/zone-runtime-spike.py decode-preview $log $png
              if ((Get-Item $png).Length -lt 2000) { throw "$stem preview suspiciously small" }
            }
          }
          $westDefault = (Get-FileHash (Join-Path $env:RESOURCE_EVIDENCE "default-west.png") -Algorithm SHA256).Hash
          $westCrypt = (Get-FileHash (Join-Path $env:RESOURCE_EVIDENCE "crypt-west.png") -Algorithm SHA256).Hash
          $eastDefault = (Get-FileHash (Join-Path $env:RESOURCE_EVIDENCE "default-east.png") -Algorithm SHA256).Hash
          $eastCrypt = (Get-FileHash (Join-Path $env:RESOURCE_EVIDENCE "crypt-east.png") -Algorithm SHA256).Hash
          if ($westDefault -ne $westCrypt) { throw "right-side crypt zone leaked onto west-facing wall face" }
          if ($eastDefault -eq $eastCrypt) { throw "crypt zone failed to change east-facing wall face" }
          Write-Host "ZONE_FACE_OWNERSHIP westStable=$westDefault eastDefault=$eastDefault eastCrypt=$eastCrypt"

      - name: Preserve derived runtime bundle and pack provenance
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RESOURCE_EVIDENCE "derived-runtime-bundle"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          foreach ($name in @("dungeon-albedo.png", "dungeon-height.png", "dungeon-glow.png", "mixed-albedo.png", "mixed-height.png", "mixed-glow.png", "zone-albedo.png", "zone-height.png", "zone-glow.png", "provenance.txt")) {
            Copy-Item (Join-Path $env:PACK_DIR $name) $bundle
          }

      - name: Upload resource runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tileset-surface-palette-runtime-evidence
          path: ${{ env.RESOURCE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

      - name: Restore disposable Project/renderer edits
        if: always()
        shell: pwsh
        run: |
          git checkout -- presentation/viewport_3d.lua data/tilesets/dungeon_default.json data/maps/13.json
          if (Test-Path assets/experiments/tileset-format-resource-runtime) {
            Remove-Item assets/experiments/tileset-format-resource-runtime -Recurse -Force
          }
          if (Test-Path assets/experiments/tileset-format-zone-runtime) {
            Remove-Item assets/experiments/tileset-format-zone-runtime -Recurse -Force
          }
          git diff --exit-code -- presentation/viewport_3d.lua data/tilesets/dungeon_default.json data/maps/13.json
