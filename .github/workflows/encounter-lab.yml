name: encounter lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encounter-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map2-engine-seam:
    name: Map 2 engine seam (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      MESA_VERSION: "26.1.6"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"
      SDL_AUDIODRIVER: "dummy"

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE
        # Version, URL and digest live in the action, not here (#725).
        timeout-minutes: 3
        uses: ./.github/actions/install-love
      - name: Install Mesa software OpenGL ${{ env.MESA_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa archive digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force

      - name: Lua syntax smoke + negative control (fail-fast)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/test-love-boot-fail-fast.ps1 -Lovec "$env:LOVEC" -MaxSeconds 10
          if ($LASTEXITCODE -ne 0) { throw "Lua syntax fail-fast check failed (exit $LASTEXITCODE)" }

      - name: Stage installed runtime + default Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gateRoot = Join-Path $env:RUNNER_TEMP "encounter-lab-stage"
          node tools/ci/stage-project-gates.js --output $gateRoot
          if ($LASTEXITCODE -ne 0) { throw "encounter lab Project staging failed (exit $LASTEXITCODE)" }
          # The lab intentionally sends the authored Map 2 snapshot through the
          # existing preview-map-inspection seam. The compiled player stage does
          # not otherwise retain fragmented source representation, so copy only
          # that test input into the temporary stage for the lab to read.
          New-Item -ItemType Directory -Force (Join-Path $gateRoot "data\maps") | Out-Null
          Copy-Item "projects/hichaukitoden-game/data/maps/2.json" (Join-Path $gateRoot "data\maps\2.json") -Force
          "THESTRA_ENCOUNTER_STAGE=$gateRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Runtime boot/data validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & $env:LOVEC $env:THESTRA_ENCOUNTER_STAGE validate
          if ($LASTEXITCODE -ne 0) { throw "runtime/default Project validation failed (exit $LASTEXITCODE)" }

      - name: Synthetic falsification and characterization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile tools/encounter-lab/encounter_lab.py
          python tools/encounter-lab/encounter_lab.py --synthetic --self-test

      - name: Real First-Stratum Map 2 engine path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/encounter-lab/encounter_lab.py --repo "$env:THESTRA_ENCOUNTER_STAGE" --engine-self-test --lovec "$env:LOVEC"

      - name: Assert test left tracked files unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw "encounter lab test modified tracked files" }
