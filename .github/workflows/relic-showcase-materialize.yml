name: Materialize relic showcase

on:
  push:
    branches:
      - agent/relic-showcase
    paths:
      - tools/asset-production/build_relic_showcase.py
      - .github/workflows/relic-showcase-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relic-showcase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus-check dependency
        run: python -m pip install numpy
      - name: Build authored relics
        run: python tools/asset-production/build_relic_showcase.py
      - name: Enforce item-model corpus gate
        run: python tools/asset-production/check_item_models.py
      - name: Commit generated OBJ and MTL output
        shell: bash
        run: |
          git config user.name "Second Rite Asset Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            assets/models/items/forbidden_lamp.obj \
            assets/models/items/town_portal.obj \
            assets/models/items/crossing_writ.obj \
            assets/models/items/smoke_bell.obj \
            assets/models/items/mourning_ribbon.obj \
            assets/models/items/first_scale.obj \
            assets/models/items/bell_salt.obj \
            assets/models/items/sealed_reliquary.obj \
            assets/models/items/relic_showcase.mtl
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "Materialize St. Maria relic showcase [relic-materialized]"
          git push origin HEAD:agent/relic-showcase
