name: Editable Blender item study preview

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-editable-item-study
    paths:
      - 'assets/authoring/items/studies/blender_editable/*.blend'
      - tools/blender/render_editable_item_blend.py
      - .github/workflows/editable-item-blend-study-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blender-editable-item-study

      - name: Install headless Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgbm1 xvfb xauth

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz \
            -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Snapshot source hashes
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/studies/blender_editable/*.blend > /tmp/item-preview-source-before.sha256
          rm -rf docs/reports/blender-item-authoring-study/previews
          mkdir -p docs/reports/blender-item-authoring-study/previews

      - name: Render four-angle review from committed sources
        shell: bash
        run: |
          set -euxo pipefail
          for file in assets/authoring/items/studies/blender_editable/*.blend; do
            xvfb-run -a "$BLENDER_BIN" --background "$file" --python tools/blender/render_editable_item_blend.py
          done
          test "$(find docs/reports/blender-item-authoring-study/previews -name '*.png' | wc -l)" -eq 20

      - name: Prove review did not touch source documents
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/studies/blender_editable/*.blend > /tmp/item-preview-source-after.sha256
          diff -u /tmp/item-preview-source-before.sha256 /tmp/item-preview-source-after.sha256
          git diff --exit-code -- assets/authoring/items/studies/blender_editable

      - uses: actions/upload-artifact@v4
        with:
          name: editable-blender-item-study-previews
          path: docs/reports/blender-item-authoring-study/previews
          if-no-files-found: error
