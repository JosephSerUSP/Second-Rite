name: authored storage conformance

on:
  pull_request:
    paths:
      - "runtime/engine/data/authored_storage_manifest.json"
      - "tools/data/authored_storage.py"
      - "tools/data/test_authored_storage.py"
      - "tools/data/split_json_collection.py"
      - "studio/editor/authored-storage-physical.js"
      - "studio/editor/authored-storage.js"
      - "studio/editor/test-authored-storage.js"
      - "tools/craft-space/build.py"
      - ".github/workflows/authored-storage-conformance.yml"
  push:
    branches: [main]
    paths:
      - "runtime/engine/data/authored_storage_manifest.json"
      - "tools/data/authored_storage.py"
      - "tools/data/test_authored_storage.py"
      - "tools/data/split_json_collection.py"
      - "studio/editor/authored-storage-physical.js"
      - "studio/editor/authored-storage.js"
      - "studio/editor/test-authored-storage.js"
      - "tools/craft-space/build.py"
      - ".github/workflows/authored-storage-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JavaScript authored-storage contract
        run: node studio/editor/test-authored-storage.js

      - name: Python / JavaScript physical-storage conformance
        run: python tools/data/test_authored_storage.py

      - name: Python syntax
        run: python -m py_compile tools/data/authored_storage.py tools/data/test_authored_storage.py tools/data/split_json_collection.py tools/craft-space/build.py
