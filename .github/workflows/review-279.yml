name: Review PR 279

on:
  push:
    branches: [issue-277-thestra-editor-scene]

permissions:
  contents: write

env:
  LOVE_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
  LOVE_SHA256: BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369
  MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
  MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
  SDL_AUDIODRIVER: dummy
  BASE_SHA: e2ea35e4db3da393de51d486aa1d61bc44603e99

jobs:
  semantics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node semantic and syntax checks
        shell: pwsh
        run: |
          node tools/editor/tests/test-thestra-editor-scene.js
          if ($LASTEXITCODE -ne 0) { throw 'semantic scene tests failed' }
          node --check tools/editor/js/thestra-editor-scene.js
          node --check tools/editor/js/second-rite-editor-adapter.js
          node --check tools/editor/js/thestra-editor-workspace.js
          node --check tools/editor/js/three-editor-viewport.js
          node --check tools/editor/sync-three-vendor.js

  g6:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow websocket-client
      - name: Install pinned LOVE and Mesa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveZip = Join-Path $env:RUNNER_TEMP 'love.zip'
          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $loveZip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $loveZip -Algorithm SHA256).Hash -ne $env:LOVE_SHA256) { throw 'LOVE digest mismatch' }
          $loveRoot = Join-Path $env:RUNNER_TEMP 'love'
          Expand-Archive $loveZip $loveRoot -Force
          $love = Get-ChildItem $loveRoot -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love) { throw 'lovec.exe not found' }
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $mesaArchive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash -ne $env:MESA_SHA256) { throw 'Mesa digest mismatch' }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesaRoot -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 opengl32.dll not found' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') $love.DirectoryName -Force
          $love.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          $loveGui = Join-Path $love.DirectoryName 'love.exe'
          "LOVE_PATH=$loveGui" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Capture base twice and candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (git rev-parse HEAD).Trim()
          "CANDIDATE_SHA=$candidate" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ab = Join-Path $env:RUNNER_TEMP 'review-279-g6'
          "ABROOT=$ab" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path $ab -Force | Out-Null
          foreach ($entry in @(@('base-a',$env:BASE_SHA), @('base-b',$env:BASE_SHA), @('candidate',$candidate))) {
            $label = $entry[0]; $sha = $entry[1]
            $work = Join-Path $env:RUNNER_TEMP "review-279-$label"
            git worktree add --detach $work $sha
            if ($LASTEXITCODE -ne 0) { throw "worktree add failed: $label" }
            python tools/golden/relative-capture.py --repo-root $work --gate g6 --output (Join-Path $ab $label)
            if ($LASTEXITCODE -ne 0) { throw "G6 capture incomplete: $label" }
          }
      - name: Compare decoded RGBA pixels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python tools/golden/compare-relative.py --gate g6 --base-a (Join-Path $env:ABROOT 'base-a') --base-b (Join-Path $env:ABROOT 'base-b') --candidate (Join-Path $env:ABROOT 'candidate') --base-ref $env:BASE_SHA --candidate-ref $env:CANDIDATE_SHA --output (Join-Path $env:ABROOT 'report.md') --github-summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw 'G6 candidate differs from base on repeat-stable pixels' }
      - name: Build candidate contact sheet
        if: always() && env.ABROOT != ''
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path(r'''${{ env.ABROOT }}''') / 'candidate'
          paths = sorted(p for p in root.rglob('*.png') if 'contact-sheet' not in p.name)
          if not paths:
              raise SystemExit(0)
          thumb_w, thumb_h, label_h, cols = 320, 240, 34, 4
          rows = (len(paths) + cols - 1) // cols
          sheet = Image.new('RGB', (cols*thumb_w, rows*(thumb_h+label_h)), 'white')
          draw = ImageDraw.Draw(sheet)
          for i, path in enumerate(paths):
              im = Image.open(path).convert('RGB')
              im.thumbnail((thumb_w, thumb_h))
              x = (i % cols)*thumb_w; y = (i // cols)*(thumb_h+label_h)
              sheet.paste(im, (x, y))
              draw.text((x+4, y+thumb_h+4), str(path.relative_to(root))[:52], fill='black')
          sheet.save(Path(r'''${{ env.ABROOT }}''') / 'candidate-contact-sheet.jpg', quality=88)
          '@ | python -
      - name: Upload G6 evidence
        if: always() && env.ABROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: review-279-g6
          path: ${{ env.ABROOT }}
          retention-days: 14

  cleanup:
    if: always()
    needs: [semantics, g6]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary workflow from PR branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/review-279.yml
          git commit -m 'Remove temporary PR #279 validation workflow'
          git push origin HEAD:issue-277-thestra-editor-scene
