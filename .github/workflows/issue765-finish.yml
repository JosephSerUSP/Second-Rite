name: issue 765 materialize direct consumer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: issue765-materialize-direct-consumer
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'exp/765-direct-three-definitions'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/765-direct-three-definitions
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh branch and materialize production code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Second Rite CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw 'rebase onto current main failed' }
          python .github/issue765-production-patch.py
          if ($LASTEXITCODE -ne 0) { throw 'production patch failed' }
          git rm .github/issue765-production-patch.py .github/workflows/issue765-finish.yml
          git add tools/editor
          git commit -m 'prod(#765): consume mesh definitions directly in Three'
          if ($LASTEXITCODE -ne 0) { throw 'materialized commit failed' }
          git push --force-with-lease origin HEAD:exp/765-direct-three-definitions
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
