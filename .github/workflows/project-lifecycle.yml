name: project lifecycle

on:
  pull_request:
    paths:
      - "main.js"
      - "package.json"
      - "package-lock.json"
      - "tools/semantic-roots.js"
      - "studio/editor/project-*.js"
      - "studio/editor/minimal-project-template.js"
      - "studio/editor/start-studio.js"
      - "tools/campaign-gen/fixture-project.js"
      - "tools/campaign-gen/generate-project.js"
      - "tools/campaign-gen/test-generate-project.js"
      - ".github/workflows/project-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "main.js"
      - "package.json"
      - "package-lock.json"
      - "tools/semantic-roots.js"
      - "studio/editor/project-*.js"
      - "studio/editor/minimal-project-template.js"
      - "studio/editor/start-studio.js"
      - "tools/campaign-gen/fixture-project.js"
      - "tools/campaign-gen/generate-project.js"
      - "tools/campaign-gen/test-generate-project.js"
      - ".github/workflows/project-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-lifecycle:
    name: Project lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node tooling dependencies
        shell: pwsh
        run: npm.cmd ci --ignore-scripts

      - name: Syntax and lifecycle contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/semantic-roots.js
          node --check studio/editor/project-lifecycle.js
          node --check studio/editor/project-cli.js
          node --check studio/editor/project-electron.js
          node --check studio/editor/project-preload.js
          node --check studio/editor/minimal-project-template.js
          node --check studio/editor/start-studio.js
          node --check tools/campaign-gen/generate-project.js
          node --check main.js
          npm.cmd run test:project-lifecycle
          node --test tools/campaign-gen/test-generate-project.js
          node tools/campaign-gen/test-fixture-project.js

      - name: Prove CLI creates a neutral in-repo Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm.cmd run project -- create projects/labs/ci-blank --json
          npm.cmd run project -- info projects/labs/ci-blank --json
          if (-not (Test-Path "projects/labs/ci-blank/data/system.json")) {
            throw "New Project did not materialize Project-owned data/"
          }
          if (Test-Path "projects/labs/ci-blank/data/engine.json") {
            throw "New Project copied inherited engineRegistry instead of staying sparse"
          }
          foreach ($name in @("save_menu.json", "items.json", "status.json", "controls.json")) {
            if (Test-Path (Join-Path "projects/labs/ci-blank/data/scenes" $name)) {
              throw "New Project copied inherited Scene $name instead of staying sparse"
            }
          }
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "New Project modified tracked Second Gate source"
          }

      - name: Prove CLI fork remains an explicit separate operation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm.cmd run project -- fork projects/hichaukitoden-game projects/labs/ci-project --json
          npm.cmd run project -- info projects/labs/ci-project --json
          if (-not (Test-Path "projects/labs/ci-project/data/system.json")) {
            throw "fork did not materialize Project-owned data/"
          }
          if (-not (Test-Path "projects/labs/ci-project/assets")) {
            throw "fork did not materialize Project-owned assets/"
          }
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "Project fork modified tracked Second Gate source"
          }
          Remove-Item -Recurse -Force projects/labs/ci-project

      - name: Prove generator can target a reviewable Project root without a model call
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm.cmd run generate-project -- --project projects/labs/ci-generated --dry-run "A tiny isolated Project generation smoke"
          if (-not (Test-Path "projects/labs/ci-generated/data/system.json")) {
            throw "generator did not bootstrap the explicit Project target"
          }
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "generator bootstrap modified tracked Second Gate source"
          }
          Remove-Item -Recurse -Force projects/labs/ci-generated

      - name: Prove Electron opens the actual New Project root before Studio boot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = (Resolve-Path "projects/labs/ci-blank").Path
          $marker = Join-Path $env:RUNNER_TEMP "studio-project-smoke.json"
          $env:THESTRA_STUDIO_SMOKE_MARKER = $marker
          & .\node_modules\.bin\electron.cmd studio --project $project
          if ($LASTEXITCODE -ne 0) { throw "Electron Project smoke failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path $marker)) { throw "Studio smoke marker was not written" }
          $state = Get-Content $marker -Raw | ConvertFrom-Json
          $expected = [System.IO.Path]::GetFullPath($project)
          $actual = [System.IO.Path]::GetFullPath([string]$state.project)
          Write-Host "expected Project: $expected"
          Write-Host "reported Project: $actual"
          if ($actual -ne $expected) {
            throw "Electron did not apply New Project root before boot"
          }
          Remove-Item -Recurse -Force projects/labs/ci-blank

      - name: Assert tracked source clean
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "Project lifecycle tests modified tracked source"
          }
