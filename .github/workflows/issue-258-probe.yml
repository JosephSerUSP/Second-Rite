name: issue-258 Electron Windows layout probe

on:
  pull_request:
    paths:
      - '.github/workflows/issue-258-probe.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        shell: pwsh
        run: npm ci
      - name: Inspect installed Electron distribution and resource patching
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = [System.Collections.Generic.List[string]]::new()
          $failed = $false
          $lines.Add('## #258 Electron Windows layout / patch probe')
          $lines.Add('')
          try {
            $electronPackage = (Resolve-Path 'node_modules/electron').Path
            $lines.Add("- Electron package dir exists: ``node_modules/electron``")
            $lines.Add("- npm ignore-scripts: ``$(npm config get ignore-scripts)``")
            $lines.Add("- ELECTRON_SKIP_BINARY_DOWNLOAD: ``$env:ELECTRON_SKIP_BINARY_DOWNLOAD``")
            $lines.Add('')
            $lines.Add('Electron package top-level entries:')
            $lines.Add('')
            Get-ChildItem -LiteralPath $electronPackage -Force | Sort-Object Name | ForEach-Object {
              $kind = if ($_.PSIsContainer) { 'dir' } else { 'file' }
              $lines.Add("- ``$($_.Name)`` ($kind)")
            }

            $electronVersion = node -p "require('electron/package.json').version"
            $exe = node -p "require('electron')"
            $pathTxt = Join-Path $electronPackage 'path.txt'
            $lines.Add('')
            $lines.Add("- Installed Electron: ``$electronVersion``")
            $lines.Add("- require('electron'): ``$exe``")
            if (Test-Path $pathTxt) {
              $lines.Add("- path.txt: ``$((Get-Content $pathTxt -Raw).Trim())``")
            } else {
              $lines.Add('- path.txt: **missing**')
            }
            if (-not (Test-Path $exe)) { throw "resolved Electron executable does not exist: $exe" }

            $dist = Split-Path -Parent $exe
            $before = (Get-Item $exe).VersionInfo
            $lines.Add("- Resolved runtime dir: ``$dist``")
            $lines.Add("- Resolved host executable: ``$(Split-Path -Leaf $exe)``")
            $lines.Add("- Electron ProductName: ``$($before.ProductName)``")
            $lines.Add("- Electron FileDescription: ``$($before.FileDescription)``")
            $lines.Add("- Electron FileVersion: ``$($before.FileVersion)``")
            $lines.Add("- Electron ProductVersion: ``$($before.ProductVersion)``")
            $lines.Add('')
            $lines.Add('Resolved runtime top-level entries:')
            $lines.Add('')
            Get-ChildItem -LiteralPath $dist -Force | Sort-Object Name | ForEach-Object {
              $kind = if ($_.PSIsContainer) { 'dir' } else { 'file' }
              $lines.Add("- ``$($_.Name)`` ($kind)")
            }

            $lines.Add('')
            $lines.Add('### rcedit compatibility probe')
            $lines.Add('')
            $rcedit = Join-Path $env:RUNNER_TEMP 'rcedit-x64.exe'
            Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile $rcedit
            $rceditSha = (Get-FileHash $rcedit -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines.Add("- rcedit release: ``v2.0.0``")
            $lines.Add("- rcedit-x64.exe SHA-256: ``$rceditSha``")

            $patched = Join-Path $env:RUNNER_TEMP 'Thestra Studio.exe'
            Copy-Item -LiteralPath $exe -Destination $patched -Force
            $icon = (Resolve-Path 'tools/editor/Assets/icons/thestra-studio/icon.ico').Path
            & $rcedit $patched `
              --set-icon $icon `
              --set-version-string ProductName 'Thestra Studio' `
              --set-version-string FileDescription 'Thestra Studio Development Host' `
              --set-version-string InternalName 'Thestra Studio' `
              --set-version-string OriginalFilename 'Thestra Studio.exe' `
              --set-version-string CompanyName 'JosephSerUSP' `
              --set-product-version '1.0.0.0' `
              --set-file-version '1.0.0.0'
            if ($LASTEXITCODE -ne 0) { throw "rcedit failed with exit $LASTEXITCODE" }
            $after = (Get-Item $patched).VersionInfo
            $lines.Add("- patched ProductName: ``$($after.ProductName)``")
            $lines.Add("- patched FileDescription: ``$($after.FileDescription)``")
            $lines.Add("- patched OriginalFilename: ``$($after.OriginalFilename)``")
            $lines.Add("- patched FileVersion: ``$($after.FileVersion)``")
            $lines.Add("- patched ProductVersion: ``$($after.ProductVersion)``")
          } catch {
            $failed = $true
            $lines.Add('')
            $lines.Add('### Probe error')
            $lines.Add('')
            $lines.Add(('```text' + "`n" + $_.Exception.ToString() + "`n" + '```'))
          }
          $lines -join "`n" | Set-Content -Path "$env:RUNNER_TEMP/issue-258-probe.md" -Encoding utf8
          Get-Content "$env:RUNNER_TEMP/issue-258-probe.md"
          "PROBE_FAILED=$($failed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish probe result on the draft PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/issue-258-probe.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Fail if compatibility probe failed
        if: env.PROBE_FAILED == 'true'
        shell: pwsh
        run: throw 'see probe comment for exact failure'
