name: materialize Batch B item sources

on:
  workflow_dispatch:
  push:
    branches: [agent/migrate-b-items-to-blend]
    paths:
      - .github/workflows/materialize-b-item-sources.yml
      - tools/blender/bootstrap_b_item_sources.py
      - tools/blender/patch_b_item_source_uvs.py
      - tools/blender/patch_b_death_sickle_crescent.py
      - tools/blender/b-migration-items.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-b-items-to-blend
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render current canonical baseline
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/b-migration-items.txt b-canonical-before.png
          image=$(find "$HOME" -type f -name b-canonical-before.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/b-canonical-before.png

      - name: Restore preserved Batch B experiment as migration reference
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin agent/polygonal-item-cohort:refs/remotes/origin/agent/polygonal-item-cohort
          git checkout origin/agent/polygonal-item-cohort -- \
            assets/models/items/greatsword.obj \
            assets/models/items/death_sickle.obj \
            assets/models/items/silver_glasses.obj \
            assets/models/items/gas_mask.obj \
            assets/models/items/moth_cloak.obj \
            assets/models/items/mirror_armor.obj \
            assets/models/items/angel_feather.obj \
            assets/models/items/rear_mirror.obj \
            assets/models/items/polygonal_cohort.mtl
          rm -f assets/models/items/{greatsword,death_sickle,silver_glasses,gas_mask,moth_cloak,mirror_armor,angel_feather,rear_mirror}.mtl

      - name: Render Batch B recipe reference
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/b-migration-items.txt b-recipe-reference.png
          image=$(find "$HOME" -type f -name b-recipe-reference.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/b-recipe-reference.png
          rm -f assets/models/items/polygonal_cohort.mtl

      - name: Materialize editable Blender fabrication sources
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a "$BLENDER_BIN" --background --python tools/blender/bootstrap_b_item_sources.py
          for item in greatsword death_sickle silver_glasses gas_mask moth_cloak mirror_armor angel_feather rear_mirror; do
            test -s "assets/authoring/items/$item.blend"
            xvfb-run -a "$BLENDER_BIN" --background "assets/authoring/items/$item.blend" --python tools/blender/patch_b_item_source_uvs.py
          done
          xvfb-run -a "$BLENDER_BIN" --background assets/authoring/items/death_sickle.blend --python tools/blender/patch_b_death_sickle_crescent.py

      - name: Compile authoritative sources into canonical runtime products
        shell: bash
        run: |
          set -euxo pipefail
          for item in greatsword death_sickle silver_glasses gas_mask moth_cloak mirror_armor angel_feather rear_mirror; do
            xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source "assets/authoring/items/$item.blend"
          done
          python tools/asset-production/check_item_models.py

      - name: Diagnose repeat-export stability
        shell: bash
        run: |
          set -euxo pipefail
          cp assets/models/items/death_sickle.obj /tmp/death-sickle-first.obj
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source assets/authoring/items/death_sickle.blend
          if ! cmp -s /tmp/death-sickle-first.obj assets/models/items/death_sickle.obj; then
            python - <<'PY'
          from pathlib import Path
          import difflib
          a = Path('/tmp/death-sickle-first.obj').read_text().splitlines()
          b = Path('assets/models/items/death_sickle.obj').read_text().splitlines()
          print('\n'.join(list(difflib.unified_diff(a, b, fromfile='first', tofile='second', n=3))[:240]))
          raise SystemExit('Death Sickle OBJ changed across identical source compiles')
          PY
          fi

      - name: Prove production compiler is source-read-only and idempotent
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/{greatsword,death_sickle,silver_glasses,gas_mask,moth_cloak,mirror_armor,angel_feather,rear_mirror}.blend > /tmp/b-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/{greatsword,death_sickle,silver_glasses,gas_mask,moth_cloak,mirror_armor,angel_feather,rear_mirror}.blend > /tmp/b-source-after.sha256
          diff -u /tmp/b-source-before.sha256 /tmp/b-source-after.sha256

      - name: Render post-migration products through real item viewer
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/b-migration-items.txt b-after.png
          image=$(find "$HOME" -type f -name b-after.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/b-after.png

      - uses: actions/upload-artifact@v4
        with:
          name: b-item-source-migration-review
          path: |
            /tmp/b-canonical-before.png
            /tmp/b-recipe-reference.png
            /tmp/b-after.png
          if-no-files-found: error

      - name: Commit source documents and compiled products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for item in greatsword death_sickle silver_glasses gas_mask moth_cloak mirror_armor angel_feather rear_mirror; do
            git add "assets/authoring/items/$item.blend" "assets/models/items/$item.obj" "assets/models/items/$item.mtl"
          done
          if git diff --cached --quiet; then
            echo "Batch B sources already materialized."
          else
            git commit -m "Materialize editable Batch B item sources"
            git push origin HEAD:agent/migrate-b-items-to-blend
          fi
