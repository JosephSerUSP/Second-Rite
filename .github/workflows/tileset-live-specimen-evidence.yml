name: Tileset live specimen evidence

on:
  push:
    branches:
      - exp/tileset-live-specimen
  workflow_dispatch:

jobs:
  capture:
    name: Runtime gauntlet + captures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Studio dependencies
        run: npm ci

      - name: Prepare Three.js authoring vendor
        run: node tools/editor/sync-three-vendor.js

      - name: Install LÖVE + software display
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb libgl1-mesa-dri
          echo "LOVE_PATH=$(command -v love)" >> "$GITHUB_ENV"

      - name: Enable SwiftShader for Electron evidence host
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'tools/editor/capture-tileset-live-specimen.js';
          let text = fs.readFileSync(p, 'utf8');
          const from = "args: [REPO_ROOT, '--project', REPO_ROOT],";
          const to = "args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--disable-gpu-sandbox', REPO_ROOT, '--project', REPO_ROOT],";
          if (!text.includes(from)) throw new Error('evidence harness launch args changed');
          fs.writeFileSync(p, text.replace(from, to));
          NODE

      - name: Parse changed JavaScript
        run: |
          node --check tools/editor/runtime-bridge-server.js
          node --check tools/editor/js/tileset-editor.js
          node --check tools/editor/capture-tileset-live-specimen.js

      - name: Run Tileset host contract tests
        run: node --test tools/editor/test-studio-tileset-electron.js

      - name: Run live-specimen runtime gauntlet
        run: xvfb-run -a node tools/editor/capture-tileset-live-specimen.js

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tileset-live-specimen-evidence
          path: artifacts/tileset-live-specimen
          if-no-files-found: warn
          retention-days: 30
