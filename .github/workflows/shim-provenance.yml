name: shim provenance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: shim provenance (Windows)
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The real build needs MinGW + Effekseer sources, but the PowerShell file
      # itself should still be parse-checked on every change. This catches a
      # broken provenance writer without turning CI into a native dependency
      # build.
      - name: Parse shim build script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/effekseer/build.ps1"), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "tools/effekseer/build.ps1 has PowerShell syntax errors"
          }

      # A clean checkout intentionally has no gitignored DLL. This proves that
      # absence remains a supported state rather than accidentally becoming a
      # build failure.
      - name: Clean-checkout provenance check
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/effekseer/check-provenance.ps1
          if ($LASTEXITCODE -ne 0) { throw "clean-checkout provenance check failed (exit $LASTEXITCODE)" }

      # Synthetic fixture uses real SHA-256 and the same checker: absent ->
      # green, matching -> green, mutate efk_shim.cpp -> red, rewrite sidecar
      # (the semantic result of rebuilding) -> green. No LÖVE/GPU/MinGW needed.
      - name: Stale-shim negative control
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/effekseer/check-provenance.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "shim provenance self-test failed (exit $LASTEXITCODE)" }
