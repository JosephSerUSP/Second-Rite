name: Issue 291 runtime ceiling seam
on:
  push:
    branches: [agent/issue-291-geometry-profiles]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/issue291_runtime_ceiling.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/viewport_3d.lua
          git commit -m "route runtime ceilings through play profile"
          git push origin HEAD:agent/issue-291-geometry-profiles
