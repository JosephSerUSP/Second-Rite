name: Promote polygonal item cohort baseline

on:
  push:
    branches:
      - agent/polygonal-item-cohort
    paths:
      - .github/workflows/polygonal-cohort-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polygonal-item-cohort
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Shrink baseline only for this cohort, then enforce strict new-work silhouettes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          root = Path.cwd()
          tools = root / "tools" / "asset-production"
          sys.path.insert(0, str(tools))
          from check_item_models import violation_key
          from item_model_corpus import load_item_models
          from check_item_models import collect_violations

          path = tools / "item-model-baseline.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          cohort = {
              "Greatsword", "Death Sickle", "Silver Glasses", "Gas Mask",
              "Moth Cloak", "Mirror Armor", "Angel Feather", "Rear Mirror",
          }
          old_accepted = set(data["accepted"])
          old_legacy = set(data["legacyItems"])
          new_legacy = old_legacy - cohort

          violations = collect_violations(load_item_models(), legacy=new_legacy)

          def parse_key(key):
              kind, members = key.split(":", 1)
              return kind, set(members.split("|"))

          old_duplicate_groups = [
              members for key in old_accepted
              for kind, members in [parse_key(key)]
              if kind == "duplicate_geometry"
          ]

          unexplained = []
          current_keys = set()
          for record in violations:
              key = record["key"]
              current_keys.add(key)
              if key in old_accepted:
                  continue
              if record["kind"] == "duplicate_geometry":
                  members = set(record["members"])
                  if any(members < old and (old - members) <= cohort for old in old_duplicate_groups):
                      continue
              unexplained.append(record)

          # Every old accepted key that vanished must have involved this exact
          # cohort.  If something unrelated disappeared, do not silently rewrite
          # history around it.
          unrelated_stale = []
          for key in old_accepted - current_keys:
              _, members = parse_key(key)
              if not (members & cohort):
                  unrelated_stale.append(key)

          if unexplained or unrelated_stale:
              print("POLYGONAL PROMOTION REFUSED")
              for r in unexplained:
                  print("new:", r)
              for key in unrelated_stale:
                  print("unrelated stale:", key)
              raise SystemExit(1)

          counts = Counter(r["kind"] for r in violations)
          data["counts"] = dict(sorted(counts.items()))
          data["legacyItems"] = sorted(new_legacy)
          data["accepted"] = sorted(current_keys)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("baseline safely shrunk:", data["counts"])
          PY
          python tools/asset-production/check_item_models.py
      - name: Commit strict baseline promotion
        shell: bash
        run: |
          git config user.name "Second Rite Asset Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add tools/asset-production/item-model-baseline.json
          git diff --cached --quiet && { echo "No baseline change"; exit 1; }
          git commit -m "Promote polygonal cohort under strict silhouette bar [polygonal-promoted]"
          git push origin HEAD:agent/polygonal-item-cohort
