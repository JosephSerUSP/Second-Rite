name: Shared semantics conformance

on:
  pull_request:
    paths:
      - 'shared/semantics/**'
      - 'runtime/engine/generated/**'
      - 'runtime/engine/vertex_shading.lua'
      - 'runtime/presentation/sprite_sheet.lua'
      - 'tools/editor/sprite-resolution-local.js'
      - 'tools/editor/index.html'
      - 'tools/editor/js/generated/**'
      - 'tools/editor/js/vertex-shading.js'
      - 'tools/editor/js/widgets.js'
      - 'tools/shared-semantics/**'
      - '.github/workflows/shared-semantics.yml'
  push:
    branches: [main]
    paths:
      - 'shared/semantics/**'
      - 'runtime/engine/generated/**'
      - 'runtime/engine/vertex_shading.lua'
      - 'runtime/presentation/sprite_sheet.lua'
      - 'tools/editor/sprite-resolution-local.js'
      - 'tools/editor/index.html'
      - 'tools/editor/js/generated/**'
      - 'tools/editor/js/vertex-shading.js'
      - 'tools/editor/js/widgets.js'
      - 'tools/shared-semantics/**'
      - '.github/workflows/shared-semantics.yml'

concurrency:
  group: shared-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MESA_VERSION: "26.1.6"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"
      SDL_AUDIODRIVER: "dummy"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/shared-semantics/package-lock.json

      - name: Install pinned LÖVE runtime
        uses: ./.github/actions/install-love

      - name: Install Mesa software OpenGL ${{ env.MESA_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          Write-Host "mesa3d-$env:MESA_VERSION-release-msvc.7z SHA256: $sha"
          if ($sha -ne $env:MESA_SHA256) {
            throw "Mesa archive digest mismatch`n  expected: $($env:MESA_SHA256)`n  actual:   $sha"
          }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
                 Where-Object { $_.FullName -match "x64" } |
                 Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found in Mesa archive" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force
          Write-Host "installed software OpenGL into $env:LOVE_DIR"
          $probe = Join-Path $env:RUNNER_TEMP "glprobe"
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          @'
          function love.load()
            local name, version, vendor, device = love.graphics.getRendererInfo()
            print(string.format("renderer: %s | %s | %s | %s", name, version, vendor, device))
            love.event.quit(0)
          end
          '@ | Set-Content -Path (Join-Path $probe "main.lua") -Encoding utf8
          $info = & $env:LOVEC $probe 2>&1 | Out-String
          Write-Host $info.Trim()
          if ($info -notmatch "renderer:") { throw "LOVE could not create an OpenGL context" }

      - name: Install build-only shared-semantics toolchain
        shell: pwsh
        working-directory: tools/shared-semantics
        run: |
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          npm ci --ignore-scripts --no-audit --no-fund
          $watch.Stop()
          Write-Host ("MEASURE_SHARED_INSTALL npm_ci_ms={0:N3}" -f $watch.Elapsed.TotalMilliseconds)

      - name: Regenerate and reject stale checked-in targets
        shell: pwsh
        working-directory: tools/shared-semantics
        run: |
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          npm run check
          $exit = $LASTEXITCODE
          $watch.Stop()
          Write-Host ("MEASURE_SHARED_BUILD regen_check_ms={0:N3}" -f $watch.Elapsed.TotalMilliseconds)
          if ($exit -ne 0) { exit $exit }

      - name: Node and Studio conformance
        shell: pwsh
        run: |
          node tools/shared-semantics/test-conformance.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/shared-semantics/test-host-cutover.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/editor/tests/test-map-vertex-shading.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/editor/test-sprite-timing-provenance.js
          # #794: Studio answers sprite metadata from the shared leaves
          # instead of a LOVE subprocess. This is what keeps that safe --
          # it compares every sprite in the Project across both hosts.
          node tools/editor/test-sprite-resolution-parity.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: LÖVE LuaJIT conformance
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP 'shared-semantics-love'
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $game 'engine/generated') | Out-Null
          Copy-Item 'tools/shared-semantics/love-conf.lua' (Join-Path $game 'conf.lua')
          Copy-Item 'tools/shared-semantics/love-main.lua' (Join-Path $game 'main.lua')
          Copy-Item 'runtime/engine/generated/*.lua' (Join-Path $game 'engine/generated/')
          & $env:LOVEC $game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check
