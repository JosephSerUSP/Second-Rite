name: Refresh 649 onto current main

on:
  push:
    branches:
      - agent/635-playwright-electron-probe

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/635-playwright-electron-probe
          fetch-depth: 0

      - name: Merge current main and preserve Playwright package intent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(package.json|package-lock.json)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            for path in package.json package-lock.json; do
              if printf '%s\n' "$conflicts" | grep -qx "$path"; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts ||= {};
          pkg.scripts['pretest:studio-playwright'] = 'node tools/editor/sync-three-vendor.js';
          pkg.scripts['test:studio-playwright'] = 'node tools/editor/run-studio-playwright-test.js';
          pkg.devDependencies ||= {};
          pkg.devDependencies.playwright = '1.62.1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json
          git diff --check

      - name: Commit merge and remove temporary refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-refresh-649-current-main.yml
          git add -A
          git diff --cached --check
          git commit -m "Merge current main into Playwright behavior probe"
          git push origin HEAD:agent/635-playwright-electron-probe
