name: sparse project

on:
  pull_request:
    paths:
      - "projects/hichaukitoden-game/**"
      - "tools/semantic-roots.js"
      - "tools/semantic-roots.test.js"
      - "studio/editor/minimal-project-template.js"
      - "studio/editor/project-lifecycle.js"
      - "studio/editor/project-cli.js"
      - "studio/editor/sparse-project-smoke.js"
      - "studio/editor/second-gate-portability-smoke.js"
      - "studio/editor/PROJECTS.md"
      - "tools/ci/stage-project-gates.js"
      - "tools/ci/test-love-boot-fail-fast.ps1"
      - "engine/data/authored_storage.lua"
      - "engine/data/authored_storage_resolved.lua"
      - "engine/data/authored_storage_manifest.json"
      - "rtp/revisions/**"
      - "tools/export/**"
      - ".github/workflows/sparse-project.yml"
  push:
    branches: [main]
    paths:
      - "projects/hichaukitoden-game/**"
      - "tools/semantic-roots.js"
      - "tools/semantic-roots.test.js"
      - "studio/editor/minimal-project-template.js"
      - "studio/editor/project-lifecycle.js"
      - "studio/editor/project-cli.js"
      - "studio/editor/sparse-project-smoke.js"
      - "studio/editor/second-gate-portability-smoke.js"
      - "studio/editor/PROJECTS.md"
      - "tools/ci/stage-project-gates.js"
      - "tools/ci/test-love-boot-fail-fast.ps1"
      - "engine/data/authored_storage.lua"
      - "engine/data/authored_storage_resolved.lua"
      - "engine/data/authored_storage_manifest.json"
      - "rtp/revisions/**"
      - "tools/export/**"
      - ".github/workflows/sparse-project.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-project:
    name: fresh + copied Project portability (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      SDL_AUDIODRIVER: dummy
      MESA_VERSION: "26.1.6"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install exporter tooling dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm dependency install failed (exit $LASTEXITCODE)" }

      - name: Install LOVE
        # Version, URL and digest live in the action, not here (#725).
        timeout-minutes: 3
        uses: ./.github/actions/install-love
        with:
          # this job invokes `lovec` bare (tools/golden/check*.ps1)
          add-to-path: "true"
      - name: Install Mesa software OpenGL 26.1.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          Write-Host "mesa3d-$env:MESA_VERSION-release-msvc.7z SHA256: $sha"
          if ($sha -ne $env:MESA_SHA256) {
            throw "Mesa archive digest mismatch`n  expected: $($env:MESA_SHA256)`n  actual:   $sha"
          }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
                 Where-Object { $_.FullName -match "x64" } |
                 Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found in Mesa archive" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force

      - name: Lua syntax smoke + negative control (fail-fast)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/test-love-boot-fail-fast.ps1 -Lovec "$env:LOVEC" -MaxSeconds 10
          if ($LASTEXITCODE -ne 0) { throw "Lua syntax fail-fast check failed (exit $LASTEXITCODE)" }

      - name: Installed runtime + default Project validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gateRoot = Join-Path $env:RUNNER_TEMP "second-gate-installed-runtime"
          node tools/ci/stage-project-gates.js --output $gateRoot
          if ($LASTEXITCODE -ne 0) { throw "default Project stage failed (exit $LASTEXITCODE)" }
          & $env:LOVEC $gateRoot validate
          if ($LASTEXITCODE -ne 0) { throw "installed runtime/default Project validation failed (exit $LASTEXITCODE)" }

      - name: Sparse lifecycle contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/semantic-roots.js
          node --check tools/semantic-roots.test.js
          node --check tools/export/project-identity.js
          node --check tools/export/project-identity.test.js
          node --check studio/editor/minimal-project-template.js
          node --check studio/editor/project-lifecycle.js
          node --check studio/editor/project-cli.js
          node --check studio/editor/sparse-project-smoke.js
          node --check studio/editor/second-gate-portability-smoke.js
          node --check tools/ci/stage-project-gates.js
          npm.cmd run test:project-lifecycle

      - name: Create stage and validate a fresh neutral Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node studio/editor/sparse-project-smoke.js
          if ($LASTEXITCODE -ne 0) { throw "fresh sparse Project smoke failed (exit $LASTEXITCODE)" }

      - name: Copy current Second Gate and prove installed-runtime portability
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node studio/editor/second-gate-portability-smoke.js
          if ($LASTEXITCODE -ne 0) { throw "copied Second Gate portability smoke failed (exit $LASTEXITCODE)" }

      - name: Assert tracked source clean
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "sparse Project smoke modified tracked source"
          }
