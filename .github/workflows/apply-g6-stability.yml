name: Apply hosted G6 stability fix

on:
  push:
    branches: [agent/g5-ps51-tempfile]
    paths:
      - '.github/workflows/apply-g6-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g5-ps51-tempfile
          fetch-depth: 0
      - name: Apply reduced-motion capture contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tools/editor/js/model-picker.js',
              "    const DEFAULT_TILT = Math.PI / 18; // runtime item_model_view: 10 degrees\n",
              "    const DEFAULT_TILT = Math.PI / 18; // runtime item_model_view: 10 degrees\n\n"
              "    function prefersReducedMotion() {\n"
              "        return typeof root.matchMedia === 'function'\n"
              "            && root.matchMedia('(prefers-reduced-motion: reduce)').matches;\n"
              "    }\n"
          )
          replace_once(
              'tools/editor/js/model-picker.js',
              "            if (this.options.autoRotate && !this.dragging && this.model && this.canvas.getClientRects().length) {\n",
              "            if (this.options.autoRotate && !prefersReducedMotion() && !this.dragging && this.model && this.canvas.getClientRects().length) {\n"
          )
          replace_once(
              'tools/editor/js/model-picker.js',
              "        transformVertex,\n        initEditorHooks\n",
              "        transformVertex,\n        prefersReducedMotion,\n        initEditorHooks\n"
          )
          replace_once(
              'tools/editor/js/model-picker.js',
              "            resolveSibling,\n            transformVertex\n",
              "            resolveSibling,\n            transformVertex,\n            prefersReducedMotion\n"
          )
          replace_once(
              'tools/editor/tests/test-model-picker.js',
              "assert.ok(Math.abs(quarterTurn[2] - 1) < 1e-10, 'quarter turn maps model X into runtime depth');\n\n",
              "assert.ok(Math.abs(quarterTurn[2] - 1) < 1e-10, 'quarter turn maps model X into runtime depth');\n\n"
              "const savedMatchMedia = globalThis.matchMedia;\n"
              "globalThis.matchMedia = query => ({ matches: query === '(prefers-reduced-motion: reduce)' });\n"
              "assert.strictEqual(ModelPicker.prefersReducedMotion(), true, 'model preview honors reduced-motion media preference');\n"
              "globalThis.matchMedia = () => ({ matches: false });\n"
              "assert.strictEqual(ModelPicker.prefersReducedMotion(), false, 'model preview rotates when reduced motion is not requested');\n"
              "if (savedMatchMedia === undefined) delete globalThis.matchMedia;\n"
              "else globalThis.matchMedia = savedMatchMedia;\n\n"
          )
          replace_once(
              'tools/golden/editor-screens.py',
              "        chrome.call(\"Emulation.setDeviceMetricsOverride\",\n"
              "                    width=VIEWPORT[0], height=VIEWPORT[1],\n"
              "                    deviceScaleFactor=1, mobile=False)\n"
              "        chrome.call(\"Page.addScriptToEvaluateOnNewDocument\", source=DETERMINISM_JS)\n",
              "        chrome.call(\"Emulation.setDeviceMetricsOverride\",\n"
              "                    width=VIEWPORT[0], height=VIEWPORT[1],\n"
              "                    deviceScaleFactor=1, mobile=False)\n"
              "        # Use the editor's real reduced-motion contract for deterministic capture.\n"
              "        chrome.call(\"Emulation.setEmulatedMedia\",\n"
              "                    features=[{\"name\": \"prefers-reduced-motion\",\n"
              "                               \"value\": \"reduce\"}])\n"
              "        chrome.call(\"Page.addScriptToEvaluateOnNewDocument\", source=DETERMINISM_JS)\n"
          )
          PY

      - name: Validate and publish ordinary files
        shell: bash
        run: |
          node tools/editor/tests/test-model-picker.js
          python -m py_compile tools/golden/editor-screens.py
          git config user.name "Second Rite Agent"
          git config user.email "actions@users.noreply.github.com"
          git add tools/editor/js/model-picker.js tools/editor/tests/test-model-picker.js tools/golden/editor-screens.py
          git diff --cached --check
          git commit -m "stabilize model previews for deterministic G6 capture"
          git push origin HEAD:agent/g5-ps51-tempfile
