name: PR 1400 asset regression adoption

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr1400-asset-regression-adopt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adopt:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/rework-consumables-2026-10-05'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rework-consumables-2026-10-05
          persist-credentials: true

      - name: Install snapshot dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Replace only the six changed referenced-model signatures
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          repo = Path.cwd()
          sys.path.insert(0, str(repo / 'tools' / 'asset-language'))
          from lib.regression import obj_metrics
          from lib.roots import project_root

          baseline_path = repo / 'tools/asset-language/baseline/asset-regression.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          project = project_root()
          targets = {
              'assets/models/items/potion.obj',
              'assets/models/items/hi_potion.obj',
              'assets/models/items/x_potion.obj',
              'assets/models/items/mega_potion.obj',
              'assets/models/items/healing_water.obj',
              'assets/models/items/ether.obj',
          }

          by_path = {entry['path']: index for index, entry in enumerate(baseline['referencedModels'])}
          missing = targets - set(by_path)
          if missing:
              raise SystemExit(f'baseline is missing expected referenced models: {sorted(missing)}')

          for target in sorted(targets):
              baseline['referencedModels'][by_path[target]] = obj_metrics(project, target)

          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY

          python tools/asset-language/check.py regression
          git diff --check -- tools/asset-language/baseline/asset-regression.json

      - name: Commit the narrow regression snapshot update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/asset-language/baseline/asset-regression.json
          git diff --cached --stat
          git commit -m "Update consumable asset regression signatures"
          git push origin HEAD:agent/rework-consumables-2026-10-05
