name: agent 403 finalize

on:
  push:
    branches:
      - agent/403-shared-sprite-sheet-service

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact resolver migration
        run: |
          python tools/ci/_agent_403_finalize.py
          git diff --check
      - name: Commit production-only result and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/viewport_3d.lua engine/resource_reference.lua
          git rm .github/workflows/agent-403-finalize.yml tools/ci/_agent_403_finalize.py
          git commit -m "Fix remaining shared sprite resolver consumers"
          git push origin HEAD:agent/403-shared-sprite-sheet-service
