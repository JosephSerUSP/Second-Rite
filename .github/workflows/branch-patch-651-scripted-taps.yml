name: Branch patch 651 scripted taps

on:
  push:
    branches:
      - sol/381-logical-held-input

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/381-logical-held-input
          fetch-depth: 0

      - name: Apply fail-closed scripted-tap correction
        shell: python
        run: |
          from pathlib import Path

          path = Path("engine/cli_tools.lua")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "                scene_host.keypressed(step.key, ctx)\n                settleForCapture(vSession)",
                  "                scene_host.keypressed(step.key, ctx)\n"
                  "                -- screenshotScript/goldenScript steps are discrete taps.\n"
                  "                -- The logical controller now keeps press state until release,\n"
                  "                -- so the harness must emit the matching release edge.\n"
                  "                scene_host.keyreleased(step.key)\n"
                  "                settleForCapture(vSession)",
              ),
              (
                  "            scene_host.keypressed(step.key, currentCtx)\n            -- After the step, so the line records the frame this input produced.",
                  "            scene_host.keypressed(step.key, currentCtx)\n"
                  "            -- goldenScript steps are taps, not indefinite holds. Preserve the\n"
                  "            -- new press-until-release controller contract in the harness too.\n"
                  "            scene_host.keyreleased(step.key)\n"
                  "            -- After the step, so the line records the frame this input produced.",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")

      - name: Verify only intended source changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- engine/cli_tools.lua
          changed="$(git diff --name-only)"
          test "$changed" = "engine/cli_tools.lua"

      - name: Commit correction and remove temporary patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/cli_tools.lua
          git rm .github/workflows/branch-patch-651-scripted-taps.yml
          git commit -m "test: model golden input scripts as discrete taps"
          git push origin HEAD:sol/381-logical-held-input
