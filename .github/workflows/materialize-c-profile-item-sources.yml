name: materialize C profile item sources

on:
  workflow_dispatch:
  push:
    branches: [agent/migrate-c-profile-items-to-blend]
    paths:
      - .github/workflows/materialize-c-profile-item-sources.yml
      - tools/blender/bootstrap_c_profile_item_sources.py
      - tools/blender/c-profile-migration-items.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-c-profile-items-to-blend
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Restore canonical runtime reference from current main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git checkout origin/main -- \
            assets/models/items/hermes_boots.obj \
            assets/models/items/mimic_tongue.obj \
            assets/models/items/molten_manacle.obj \
            assets/models/items/phoenix_pinion.obj \
            assets/models/items/swept_cohort.mtl
          rm -f \
            assets/models/items/hermes_boots.mtl \
            assets/models/items/mimic_tongue.mtl \
            assets/models/items/molten_manacle.mtl \
            assets/models/items/phoenix_pinion.mtl

      - name: Render canonical pre-migration reference
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/c-profile-migration-items.txt c-profile-before.png
          before=$(find "$HOME" -type f -name c-profile-before.png -print -quit)
          test -n "$before"
          cp "$before" /tmp/c-profile-before.png

      - name: Materialize editable profile sources
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a "$BLENDER_BIN" --background --python tools/blender/bootstrap_c_profile_item_sources.py
          for item in hermes_boots mimic_tongue molten_manacle phoenix_pinion; do
            test -s "assets/authoring/items/$item.blend"
          done

      - name: Compile authoritative sources into canonical runtime products
        shell: bash
        run: |
          set -euxo pipefail
          for item in hermes_boots mimic_tongue molten_manacle phoenix_pinion; do
            xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source "assets/authoring/items/$item.blend"
          done
          python tools/asset-production/check_item_models.py

      - name: Prove production compiler is idempotent and source-read-only
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/{hermes_boots,mimic_tongue,molten_manacle,phoenix_pinion}.blend > /tmp/c-profile-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/{hermes_boots,mimic_tongue,molten_manacle,phoenix_pinion}.blend > /tmp/c-profile-source-after.sha256
          diff -u /tmp/c-profile-source-before.sha256 /tmp/c-profile-source-after.sha256

      - name: Render post-migration products through real item viewer
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/c-profile-migration-items.txt c-profile-after.png
          after=$(find "$HOME" -type f -name c-profile-after.png -print -quit)
          test -n "$after"
          cp "$after" /tmp/c-profile-after.png

      - uses: actions/upload-artifact@v4
        with:
          name: c-profile-item-source-migration-review
          path: |
            /tmp/c-profile-before.png
            /tmp/c-profile-after.png
          if-no-files-found: error

      - name: Commit source documents and compiled products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/authoring/items assets/models/items
          if git diff --cached --quiet; then
            echo "C profile source migration already materialized."
          else
            git commit -m "Materialize editable profile C item sources"
            git push origin HEAD:agent/migrate-c-profile-items-to-blend
          fi
