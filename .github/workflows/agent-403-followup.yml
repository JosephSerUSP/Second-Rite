name: Agent 403 validation follow-up

on:
  push:
    branches:
      - agent/403-shared-sprite-sheet-service

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403-shared-sprite-sheet-service
      - name: Fix remaining neutral resolver caller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/validator_rules.lua')
          text = p.read_text(encoding='utf-8')
          old = 'sb.resolveFile(actor.smallBattler)'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, 'sprite_sheet.resolveFile(actor.smallBattler)')
          assert 'sb.resolveFile' not in text
          p.write_text(text, encoding='utf-8')

          p = Path('engine/cli_tools.lua')
          text = p.read_text(encoding='utf-8')
          old = '        local spriteOverrides = resolved and resolved.tokens or {}\n'
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, ''), encoding='utf-8')
          PY
          git diff --check
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/validator_rules.lua engine/cli_tools.lua
          git commit -m "Complete shared sprite resolver migration"
          git push origin HEAD:agent/403-shared-sprite-sheet-service
