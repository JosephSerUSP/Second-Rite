name: materialize Phoenix organic hybrid

on:
  workflow_dispatch:
  push:
    branches: [agent/phoenix-pinion-organic-hybrid]
    paths:
      - .github/workflows/materialize-phoenix-organic-hybrid.yml
      - tools/blender/patch_phoenix_pinion_organic_hybrid.py
      - tools/blender/patch_phoenix_pinion_organic_hybrid_v2.py
      - tools/blender/organic-hybrid-items.txt

permissions:
  contents: write

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phoenix-pinion-organic-hybrid
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render V1 hybrid baseline
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/organic-hybrid-items.txt phoenix-v1.png
          image=$(find "$HOME" -type f -name phoenix-v1.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/phoenix-v1.png

      - name: Materialize silhouette-owned V2 authoring pass
        shell: bash
        run: |
          set -euxo pipefail
          test -s assets/authoring/items/phoenix_pinion.blend
          xvfb-run -a "$BLENDER_BIN" --background assets/authoring/items/phoenix_pinion.blend --python tools/blender/patch_phoenix_pinion_organic_hybrid_v2.py

      - name: Compile proposed authoritative source
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source assets/authoring/items/phoenix_pinion.blend
          python tools/asset-production/check_item_models.py

      - name: Prove full source corpus remains read-only and reproducible
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/*.blend > /tmp/hybrid-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/*.blend > /tmp/hybrid-source-after.sha256
          diff -u /tmp/hybrid-source-before.sha256 /tmp/hybrid-source-after.sha256

      - name: Render V2 through real item viewer
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/organic-hybrid-items.txt phoenix-v2.png
          image=$(find "$HOME" -type f -name phoenix-v2.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/phoenix-v2.png

      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-organic-hybrid-v2-review
          path: |
            /tmp/phoenix-v1.png
            /tmp/phoenix-v2.png
          if-no-files-found: error

      - name: Commit proposed source and runtime products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/authoring/items/phoenix_pinion.blend assets/models/items/phoenix_pinion.obj assets/models/items/phoenix_pinion.mtl
          if git diff --cached --quiet; then
            echo "Phoenix organic hybrid V2 already materialized."
          else
            git commit -m "Refine Phoenix Pinion organic hybrid silhouette"
            git push origin HEAD:agent/phoenix-pinion-organic-hybrid
          fi
