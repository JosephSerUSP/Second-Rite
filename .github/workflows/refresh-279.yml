name: Refresh PR 279

on:
  push:
    branches: [issue-277-thestra-editor-scene]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'merge current main failed' }
          git rm -- .github/workflows/refresh-279.yml
          git commit -m 'Remove temporary PR #279 refresh workflow'
          git push origin HEAD:issue-277-thestra-editor-scene
