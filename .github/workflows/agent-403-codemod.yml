name: Agent 403 sprite service codemod

on:
  push:
    branches:
      - agent/403-shared-sprite-sheet-service

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403-shared-sprite-sheet-service
          fetch-depth: 0
      - name: Migrate generic sprite callers
        run: python3 .github/agent-403-codemod.py
      - name: Verify and commit caller migration
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua engine/validator_rules.lua engine/cli_tools.lua presentation/renderer.lua presentation/window_renderer.lua
          git diff --cached --quiet && { echo "No codemod changes produced" >&2; exit 1; }
          git commit -m "Migrate callers to shared sprite service"
          git push origin HEAD:agent/403-shared-sprite-sheet-service
