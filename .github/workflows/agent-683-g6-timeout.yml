name: agent 683 g6 timeout patch

on:
  push:
    branches:
      - agent/683-g6-recorder-timeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/683-g6-recorder-timeout
      - name: Apply bounded timeout patch and tests
        shell: python
        run: |
          from pathlib import Path

          capture = Path('tools/golden/relative-capture.py')
          text = capture.read_text(encoding='utf-8')
          anchor = '''def newest_record(root):\n    candidates = [p for p in Path(root).glob("*") if (p / "manifest.json").is_file()]\n    if not candidates:\n        raise RuntimeError("recorder produced no manifest under %s" % root)\n    return max(candidates, key=lambda p: p.stat().st_mtime_ns)\n\n\n'''
          replacement = anchor + '''def default_step_timeout(gate):\n    # G6 now waits for semantic Map-workspace readiness across 46 browser\n    # scenarios. The recorder's old 180s per-subprocess watchdog can therefore\n    # kill a healthy editor-screens.py run before its own readiness/timeouts have\n    # a chance to report. Keep G5 unchanged and leave the outer 1200s gate\n    # failsafe intact; this is execution budget, not a pixel/readiness tolerance.\n    return 300 if gate == "g6" else 180\n\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement, 1)
          old = 'parser.add_argument("--step-timeout", type=int, default=180)'
          new = '''parser.add_argument("--step-timeout", type=int, default=None,\n                        help="per-subprocess timeout; default 180s for G5, 300s for G6")'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    args = parse_args(argv)\n    target = args.repo_root.resolve()\n'''
          new = '''    args = parse_args(argv)\n    step_timeout = args.step_timeout if args.step_timeout is not None else default_step_timeout(args.gate)\n    target = args.repo_root.resolve()\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          assert text.count('args.step_timeout, args.gate_timeout') == 3
          text = text.replace('args.step_timeout, args.gate_timeout', 'step_timeout, args.gate_timeout')
          old = '''        "captureComplete": False,\n        "recorderPasses": [],\n'''
          new = '''        "captureComplete": False,\n        "stepTimeoutSeconds": step_timeout,\n        "recorderPasses": [],\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          capture.write_text(text, encoding='utf-8')

          tests = Path('tests/test_relative_gate_tools.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''class RelativeCaptureAssemblyTests(unittest.TestCase):\n'''
          insertion = '''class RelativeCaptureTimeoutTests(unittest.TestCase):\n    def test_g6_gets_readiness_aware_recorder_budget_without_relaxing_g5(self):\n        self.assertEqual(CAPTURE.default_step_timeout("g5"), 180)\n        self.assertEqual(CAPTURE.default_step_timeout("g6"), 300)\n        args = CAPTURE.parse_args([\n            "--repo-root", ".", "--gate", "g6", "--output", "out"\n        ])\n        self.assertIsNone(args.step_timeout,\n            "CLI omission must defer to the gate-specific default in main")\n\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, insertion + anchor, 1)
          tests.write_text(text, encoding='utf-8')
      - name: Focused verification
        run: |
          python -m py_compile tools/golden/relative-capture.py tests/test_relative_gate_tools.py
          python tests/test_relative_gate_tools.py
          git diff --check
      - name: Commit clean production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/agent-683-g6-timeout.yml
          git add tools/golden/relative-capture.py tests/test_relative_gate_tools.py
          git commit -m 'ci: give settled G6 capture enough recorder budget'
          git push origin HEAD:agent/683-g6-recorder-timeout
