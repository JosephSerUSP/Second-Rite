# #765 one-off evidence trigger; restored from main by the guarded job.
name: studio host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    name: branded development host (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned npm dependencies
        shell: pwsh
        run: npm ci

      - name: Verify deterministic icon inputs and containers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run icons:check
          if ($LASTEXITCODE -ne 0) { throw "icon currentness check failed (exit $LASTEXITCODE)" }
          npm run test:icons
          if ($LASTEXITCODE -ne 0) { throw "icon tests failed (exit $LASTEXITCODE)" }

      - name: Verify project/editor/runtime boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test tools/export/export-game.test.js tools/editor/test-project-root.js tools/editor/test-project-play.js tools/editor/test-map-inspection-bridge.js tools/editor/test-chrome-ownership.js tools/editor/tests/test-map-3d-lighting.js tools/editor/tests/test-lighting-parity.js tools/editor/tests/test-map-vertex-shading.js tools/editor/tests/test-live-lamp-properties.js tools/editor/tests/test-thestra-viewport-contract.js tools/editor/tests/test-blender-navigation-source.js tools/editor/tests/test-map-inspector.js tools/editor/tests/test-game-variable-command-authoring.js
          if ($LASTEXITCODE -ne 0) { throw "project/editor/runtime boundary tests failed (exit $LASTEXITCODE)" }

      - name: Build, inspect and boot branded development host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run test:studio-host
          if ($LASTEXITCODE -ne 0) { throw "Studio host tests failed (exit $LASTEXITCODE)" }
          npm run studio:host:check
          if ($LASTEXITCODE -ne 0) { throw "Studio host currentness check failed (exit $LASTEXITCODE)" }

      - name: Assert generated host is disposable and tracked source stayed clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $electron = @(node -p "require('electron')")[-1].Trim()
          $hostExe = Join-Path (Split-Path -Parent $electron) 'Thestra Studio.exe'
          if (-not (Test-Path -LiteralPath $hostExe)) { throw "generated Thestra Studio.exe is missing" }
          $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $hostExe)
          git check-ignore -q -- $relative
          if ($LASTEXITCODE -ne 0) { throw "generated host is not ignored: $relative" }
          git diff --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Studio host verification modified tracked files" }
          git diff --cached --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Studio host verification staged tracked files" }

  issue765-evidence:
    name: issue 765 direct-consumer evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'exp/765-direct-three-definitions'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EVIDENCE: docs/reports/issue765-final-evidence.tmp.txt
    steps:
      - name: Check out #765 branch
        uses: actions/checkout@v4
        with:
          ref: exp/765-direct-three-definitions
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final contract corrections
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          viewport = Path('tools/editor/js/three-editor-viewport-base.js')
          source = viewport.read_text(encoding='utf-8')
          marker = """        function materialFor(id) {\n            return materialById.get(id)\n                || WorldFidelity.decorateResolvedWorldMaterial(new THREE.MeshStandardMaterial({\n                    color: 0x777777, roughness: 0.9, side: THREE.DoubleSide, vertexColors: true\n                }));\n        }\n"""
          if source.count(marker) != 1:
              raise SystemExit(f'expected one materialFor helper, found {source.count(marker)}')
          replacement = marker + """        function materialForSurface(surface) {\n            return materialById.get(surface.material)\n                || WorldFidelity.decorateResolvedWorldMaterial(new THREE.MeshStandardMaterial({\n                    color: 0x777777, roughness: 0.9, side: THREE.DoubleSide, vertexColors: true\n                }));\n        }\n"""
          source = source.replace(marker, replacement, 1)
          if source.count('materialFor(surface.material)') != 2:
              raise SystemExit('expected exactly two literal-surface material calls')
          source = source.replace('materialFor(surface.material)', 'materialForSurface(surface)')
          viewport.write_text(source, encoding='utf-8', newline='\n')

          consumer = Path('tools/editor/js/three-definition-consumer.js')
          source = consumer.read_text(encoding='utf-8')
          old = """        const IndexArray = vertexCount > 65535 ? Uint32Array : Uint16Array;\n        const outIndices = new IndexArray(indices.length);\n"""
          new = """        // Keep the experiment out of index-width packing entirely. Three still\n        // requires an integer index BufferAttribute, so use the unconditionally\n        // wide representation rather than choosing a compact width here.\n        const outIndices = new Uint32Array(indices.length);\n"""
          if source.count(old) != 1:
              raise SystemExit(f'expected one adaptive index-width block, found {source.count(old)}')
          consumer.write_text(source.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'final contract correction failed' }

      - name: Install dependencies and run focused proofs
        id: focused
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "#765 final evidence" | Out-File $env:EVIDENCE -Encoding utf8
          npm.cmd ci --ignore-scripts 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            node tools/editor/sync-three-vendor.js 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            node --test tools/editor/test-instance-transport.js tools/editor/test-runtime-bridge.js tools/editor/tests/test-map-3d-lighting.js 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
            $code = $LASTEXITCODE
          }
          exit $code

      - name: Install pinned LOVE 11.5 and Mesa
        id: love
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveZip = Join-Path $env:RUNNER_TEMP 'love11.zip'
          Invoke-WebRequest -Uri 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip' -OutFile $loveZip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $loveZip -Algorithm SHA256).Hash -ne 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369') { throw 'LOVE digest mismatch' }
          $loveRoot = Join-Path $env:RUNNER_TEMP 'love11'
          Expand-Archive $loveZip $loveRoot -Force
          $love = Get-ChildItem $loveRoot -Recurse -Filter love.exe | Select-Object -First 1
          if (-not $love) { throw 'LOVE executable missing' }
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z' -OutFile $mesaArchive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash -ne '86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB') { throw 'Mesa digest mismatch' }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $mesaRoot -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $gl) { throw 'Mesa x64 OpenGL missing' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') $love.DirectoryName -Force
          "LOVE_PATH=$($love.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Measure production-shaped Maps 2 and 3
        id: bench
        continue-on-error: true
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $ErrorActionPreference = 'Continue'
          "`n# production-shaped Maps 2/3 benchmark" | Out-File $env:EVIDENCE -Append -Encoding utf8
          node --expose-gc tools/editor/bench-three-placement-colors.js --love $env:LOVE_PATH 2>&1 | Tee-Object -FilePath $env:EVIDENCE -Append
          exit $LASTEXITCODE

      - name: Persist corrections/evidence and restore workflows
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @"

# outcomes
focused=${{ steps.focused.outcome }}
love=${{ steps.love.outcome }}
benchmark=${{ steps.bench.outcome }}
"@ | Out-File $env:EVIDENCE -Append -Encoding utf8
          git config user.name 'Second Rite CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/studio-host.yml
          if (Test-Path .github/workflows/issue765-finish.yml) { git rm .github/workflows/issue765-finish.yml }
          if (Test-Path .github/workflows/issue765-evidence.yml) { git rm .github/workflows/issue765-evidence.yml }
          git add tools/editor $env:EVIDENCE .github/workflows/studio-host.yml
          git commit -m 'test(#765): prove production direct consumer'
          if ($LASTEXITCODE -ne 0) { throw 'evidence commit failed' }
          git push origin HEAD:exp/765-direct-three-definitions
          if ($LASTEXITCODE -ne 0) { throw 'evidence push failed' }
