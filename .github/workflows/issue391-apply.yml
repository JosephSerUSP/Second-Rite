name: issue391 apply

on:
  push:
    branches: [agent/385-thestra-rtp-authored-layer-current]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/385-thestra-rtp-authored-layer-current
      - name: Apply bounded issue 391 source edits
        run: python tmp/issue391-patch.txt
      - name: Commit bounded source edits
        shell: bash
        run: |
          # The repository's inherited verify workflow is not part of #391 and
          # the Actions token intentionally lacks workflow-file permission.
          git checkout -- .github/workflows/verify.yml
          if ! grep -q "rtp-baseline-resources.test.js" tools/export/rtp-resource-resolver.test.js; then
            printf "\n// #391 focused preview/resource/export coverage is loaded by the inherited verify entrypoint.\nrequire('./rtp-baseline-resources.test.js');\n" >> tools/export/rtp-resource-resolver.test.js
          fi
          rm -f tmp/issue391-patch.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "studio: establish neutral RTP preview baseline"
          git push origin HEAD:agent/385-thestra-rtp-authored-layer-current
