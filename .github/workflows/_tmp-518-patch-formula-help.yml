name: Temporary 518 Formula Help Patch

on:
  push:
    branches:
      - sol/518-scene-fixed-timing-studio

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/518-scene-fixed-timing-studio
      - name: Add fixed Scene timing help to inherited registry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'rtp/revisions/1.0/data/engine.json';
          let text = fs.readFileSync(path, 'utf8');
          if (text.includes('"token": "time.dt"')) process.exit(0);
          const marker = '    {\n      "token": "(list rows)",';
          if (!text.includes(marker)) throw new Error('formulaHelp insertion marker not found');
          const block = [
            '    {',
            '      "token": "time.dt",',
            '      "description": "Exact logical step in seconds during a fixed Scene on_frame tick. Available only during fixed on_frame; transient context, not a Game Variable, not persistent Scene state, and not saved."',
            '    },',
            '    {',
            '      "token": "time.tick",',
            '      "description": "Scene-instance logical tick index during fixed on_frame. Available only during fixed on_frame; transient context, not a Game Variable, not persistent Scene state, and not saved."',
            '    },',
            '    {',
            '      "token": "time.elapsed",',
            '      "description": "Scene-instance logical elapsed time in seconds during fixed on_frame. Available only during fixed on_frame; transient context, not a Game Variable, not persistent Scene state, and not saved."',
            '    },',
          ].join('\n') + '\n';
          text = text.replace(marker, block + marker);
          JSON.parse(text);
          fs.writeFileSync(path, text, 'utf8');
          NODE
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- rtp/revisions/1.0/data/engine.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtp/revisions/1.0/data/engine.json
          git commit -m "docs: expose fixed Scene timing in Formula Help"
          git push origin HEAD:sol/518-scene-fixed-timing-studio
