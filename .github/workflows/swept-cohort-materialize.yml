name: Materialize swept item cohort

on:
  push:
    branches:
      - agent/swept-item-cohort
    paths:
      - tools/asset-production/sweep_parts.py
      - tools/asset-production/build_swept_item_cohort.py
      - .github/workflows/swept-cohort-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/swept-item-cohort
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus-check dependency
        run: python -m pip install numpy
      - name: Build swept cohort
        run: python tools/asset-production/build_swept_item_cohort.py
      - name: Promote cohort under strict new-work bar
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          root = Path.cwd()
          tools = root / "tools" / "asset-production"
          sys.path.insert(0, str(tools))
          from item_model_corpus import load_item_models
          from check_item_models import collect_violations

          path = tools / "item-model-baseline.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          cohort = {
              "Water Scepter", "Hermes' Boots", "Mimic Tongue", "Cerberus Fang",
              "Blackroot", "Molten Manacle", "Barbed Spear", "Phoenix Pinion",
          }
          old_accepted = set(data["accepted"])
          old_legacy = set(data["legacyItems"])
          new_legacy = old_legacy - cohort

          violations = collect_violations(load_item_models(), legacy=new_legacy)

          def parse_key(key):
              kind, members = key.split(":", 1)
              return kind, set(members.split("|"))

          old_duplicate_groups = [
              members for key in old_accepted
              for kind, members in [parse_key(key)]
              if kind == "duplicate_geometry"
          ]

          unexplained = []
          current_keys = set()
          for record in violations:
              key = record["key"]
              current_keys.add(key)
              if key in old_accepted:
                  continue
              if record["kind"] == "duplicate_geometry":
                  members = set(record["members"])
                  if any(members < old and (old - members) <= cohort for old in old_duplicate_groups):
                      continue
              unexplained.append(record)

          unrelated_stale = []
          for key in old_accepted - current_keys:
              _, members = parse_key(key)
              if not (members & cohort):
                  unrelated_stale.append(key)

          if unexplained or unrelated_stale:
              print("SWEPT COHORT PROMOTION REFUSED")
              for record in unexplained:
                  print("new:", record)
              for key in unrelated_stale:
                  print("unrelated stale:", key)
              raise SystemExit(1)

          counts = Counter(record["kind"] for record in violations)
          data["counts"] = dict(sorted(counts.items()))
          data["legacyItems"] = sorted(new_legacy)
          data["accepted"] = sorted(current_keys)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("baseline safely shrunk:", data["counts"])
          PY
          python tools/asset-production/check_item_models.py
      - name: Commit generated cohort and baseline
        shell: bash
        run: |
          git config user.name "Second Rite Asset Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            assets/models/items/water_scepter.obj \
            assets/models/items/hermes_boots.obj \
            assets/models/items/mimic_tongue.obj \
            assets/models/items/cerberus_fang.obj \
            assets/models/items/blackroot.obj \
            assets/models/items/molten_manacle.obj \
            assets/models/items/barbed_spear.obj \
            assets/models/items/phoenix_pinion.obj \
            assets/models/items/swept_cohort.mtl \
            tools/asset-production/item-model-baseline.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "Materialize spatial sweep cohort [swept-materialized]"
          git push origin HEAD:agent/swept-item-cohort
