name: Issue 750 one-off patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/750-unit-stat-input-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/750-unit-stat-input-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize focused stat lifecycle patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const fs = require('node:fs');
          const file = 'tools/editor/js/widgets.js';
          let source = fs.readFileSync(file, 'utf8');
          const helperStart = source.indexOf('                        function redrawUnitStatCurve(cell, key, label) {');
          const renderStart = source.indexOf('function renderUnitStatCurves() {', helperStart);
          if (helperStart < 0 || renderStart < 0) throw new Error('#750 helper seam missing');
          const afterRenderLine = source.indexOf('\n', renderStart) + 1;
          if (afterRenderLine <= 0) throw new Error('#750 render line has no terminator');
          const normalized = `                        function redrawUnitStatCurve(cell, key, label) {
                              const curve = Array.from(cell.children).find(child =>
                                  child.classList && child.classList.contains('stat-curve'));
                              if (curve) curve.remove();
                              buildStatCurve(cell, label, base(key, 10),
                                  item.growthBands, key, item.maxLevel || 99);
                          }
                          function renderUnitStatCurves() {
`;
          source = source.slice(0, helperStart) + normalized + source.slice(afterRenderLine);
          fs.writeFileSync(file, source);
          '@ | node -
          if ($LASTEXITCODE -ne 0) { throw "format patch failed (exit $LASTEXITCODE)" }
          node tools/editor/test-unit-stat-input-lifecycle.js
          if ($LASTEXITCODE -ne 0) { throw "#750 regression test failed (exit $LASTEXITCODE)" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed (exit $LASTEXITCODE)" }

      - name: Commit formatting if needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain tools/editor/js/widgets.js)) { exit 0 }
          git config user.name "Second Rite CI"
          git config user.email "actions@users.noreply.github.com"
          git add tools/editor/js/widgets.js
          git commit -m "style(#750): normalize stat curve helper indentation"
          if ($LASTEXITCODE -ne 0) { throw "commit failed (exit $LASTEXITCODE)" }
          git push origin HEAD:fix/750-unit-stat-input-lifecycle
          if ($LASTEXITCODE -ne 0) { throw "push failed (exit $LASTEXITCODE)" }
