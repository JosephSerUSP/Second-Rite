name: refine relic showcase Blender sources V2

on:
  workflow_dispatch:
  push:
    branches: [agent/relic-showcase-blend-content]
    paths:
      - .github/workflows/refine-relic-showcase-blend-v2.yml
      - tools/blender/refine_relic_showcase_blend_sources_v2.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relic-showcase-blend-content
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render V1 Blender-authored relic board
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-v1.png
          image=$(find "$HOME" -type f -name relic-v1.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-v1.png

      - name: Art-direct existing authoritative Blend documents
        shell: bash
        run: |
          set -euxo pipefail
          for item in black_hinge chrysalis_sigil vial_of_second_breath; do
            test -s "assets/authoring/items/$item.blend"
            xvfb-run -a "$BLENDER_BIN" --background "assets/authoring/items/$item.blend" --python tools/blender/refine_relic_showcase_blend_sources_v2.py
          done
          rm -f assets/authoring/items/*.blend1 assets/authoring/items/*.blend2

      - name: Compile touched sources and validate runtime corpus
        shell: bash
        run: |
          set -euxo pipefail
          for item in black_hinge chrysalis_sigil vial_of_second_breath; do
            xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source "assets/authoring/items/$item.blend"
          done
          python tools/asset-production/check_item_models.py

      - name: Prove full Blender source corpus remains read-only and reproducible
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/*.blend > /tmp/v2-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/*.blend > /tmp/v2-source-after.sha256
          diff -u /tmp/v2-source-before.sha256 /tmp/v2-source-after.sha256

      - name: Render V2 Blender-authored relic board
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/relic-showcase-blend-items.txt relic-v2.png
          image=$(find "$HOME" -type f -name relic-v2.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/relic-v2.png

      - uses: actions/upload-artifact@v4
        with:
          name: relic-showcase-blender-v2-review
          path: |
            /tmp/relic-v1.png
            /tmp/relic-v2.png
          if-no-files-found: error

      - name: Commit directly edited source documents and runtime products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for item in black_hinge chrysalis_sigil vial_of_second_breath; do
            git add "assets/authoring/items/$item.blend" "assets/models/items/$item.obj" "assets/models/items/$item.mtl"
          done
          if git diff --cached --quiet; then
            echo "Relic V2 source edits already materialized."
          else
            git commit -m "Refine relic Blender source art direction"
            git push origin HEAD:agent/relic-showcase-blend-content
          fi
