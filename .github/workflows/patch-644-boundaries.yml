name: Apply 644 boundary patch

on:
  push:
    branches:
      - sol/644-g6-toolbar-stall-boundaries
    paths:
      - tools/patch-644-boundaries.py
      - .github/workflows/patch-644-boundaries.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/644-g6-toolbar-stall-boundaries
          fetch-depth: 0
      - name: Apply asserted boundary patch
        run: python tools/patch-644-boundaries.py
      - name: Run structural boundary proof
        run: python tools/golden/test-g6-harness-boundaries.py
      - name: Remove temporary patch harness
        run: |
          rm tools/patch-644-boundaries.py
          rm .github/workflows/patch-644-boundaries.yml
      - name: Commit boundary repair
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add tools/editor/js/thestra-editor-workspace.js tools/editor/js/world-presentation-studio.js tools/golden/editor-screens-core.py tools/golden/check-editor.ps1 tools/golden/test-g6-harness-boundaries.py tools/patch-644-boundaries.py .github/workflows/patch-644-boundaries.yml
          git diff --cached --check
          git commit -m "fix: declare G6 toolbar and harness-stall boundaries"
          git push origin HEAD:sol/644-g6-toolbar-stall-boundaries
