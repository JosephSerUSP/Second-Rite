# Fresh-run marker: corrected partial-wrap profile
name: materialize Batch A item sources

on:
  workflow_dispatch:
  push:
    branches: [agent/migrate-a-items-to-blend]
    paths:
      - .github/workflows/materialize-a-item-sources.yml
      - tools/blender/bootstrap_a_item_sources.py
      - tools/blender/run_bootstrap_a_item_sources.py
      - tools/blender/a-migration-items.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-a-items-to-blend
          fetch-depth: 1

      - name: Install review and Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love xvfb xauth libegl1 libgl1-mesa-dri libgbm1 libglx-mesa0
          python -m pip install numpy

      - name: Download Blender 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN=$(find /tmp/blender-* -maxdepth 2 -type f -name blender -perm -111 2>/dev/null | head -1)
          test -n "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Render current canonical baseline
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/a-migration-items.txt a-canonical-before.png
          image=$(find "$HOME" -type f -name a-canonical-before.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/a-canonical-before.png

      - name: Restore preserved Batch A experiment as migration reference
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin agent/relic-showcase:refs/remotes/origin/agent/relic-showcase
          git checkout origin/agent/relic-showcase -- \
            assets/models/items/forbidden_lamp.obj \
            assets/models/items/town_portal.obj \
            assets/models/items/crossing_writ.obj \
            assets/models/items/smoke_bell.obj \
            assets/models/items/mourning_ribbon.obj \
            assets/models/items/first_scale.obj \
            assets/models/items/bell_salt.obj \
            assets/models/items/sealed_reliquary.obj \
            assets/models/items/relic_showcase.mtl
          rm -f assets/models/items/{forbidden_lamp,town_portal,crossing_writ,smoke_bell,mourning_ribbon,first_scale,bell_salt,sealed_reliquary}.mtl

      - name: Render Batch A recipe reference
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/a-migration-items.txt a-recipe-reference.png
          image=$(find "$HOME" -type f -name a-recipe-reference.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/a-recipe-reference.png
          rm -f assets/models/items/relic_showcase.mtl

      - name: Materialize editable semantic-sculpture sources
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a "$BLENDER_BIN" --background --python tools/blender/run_bootstrap_a_item_sources.py
          for item in forbidden_lamp town_portal crossing_writ smoke_bell mourning_ribbon first_scale bell_salt sealed_reliquary; do
            test -s "assets/authoring/items/$item.blend"
          done

      - name: Compile authoritative sources into canonical runtime products
        shell: bash
        run: |
          set -euxo pipefail
          for item in forbidden_lamp town_portal crossing_writ smoke_bell mourning_ribbon first_scale bell_salt sealed_reliquary; do
            xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --source "assets/authoring/items/$item.blend"
          done
          python tools/asset-production/check_item_models.py

      - name: Prove production compiler is source-read-only and idempotent
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum assets/authoring/items/{forbidden_lamp,town_portal,crossing_writ,smoke_bell,mourning_ribbon,first_scale,bell_salt,sealed_reliquary}.blend > /tmp/a-source-before.sha256
          xvfb-run -a python tools/blender/compile_item_blends.py --blender "$BLENDER_BIN" --check
          sha256sum assets/authoring/items/{forbidden_lamp,town_portal,crossing_writ,smoke_bell,mourning_ribbon,first_scale,bell_salt,sealed_reliquary}.blend > /tmp/a-source-after.sha256
          diff -u /tmp/a-source-before.sha256 /tmp/a-source-after.sha256

      - name: Render post-migration products through real item viewer
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180 xvfb-run -a love . item-sheet tools/blender/a-migration-items.txt a-after.png
          image=$(find "$HOME" -type f -name a-after.png -print -quit)
          test -n "$image"
          cp "$image" /tmp/a-after.png

      - uses: actions/upload-artifact@v4
        with:
          name: a-item-source-migration-review
          path: |
            /tmp/a-canonical-before.png
            /tmp/a-recipe-reference.png
            /tmp/a-after.png
          if-no-files-found: error

      - name: Commit source documents and compiled products
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for item in forbidden_lamp town_portal crossing_writ smoke_bell mourning_ribbon first_scale bell_salt sealed_reliquary; do
            git add "assets/authoring/items/$item.blend" "assets/models/items/$item.obj" "assets/models/items/$item.mtl"
          done
          if git diff --cached --quiet; then
            echo "Batch A sources already materialized."
          else
            git commit -m "Materialize editable Batch A item sources"
            git push origin HEAD:agent/migrate-a-items-to-blend
          fi
