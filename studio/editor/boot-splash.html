<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Thestra Studio</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            background: #1a1422;
            color: #fff7f2;
            font: 14px/1.4 "Segoe UI", sans-serif;
            user-select: none;
        }
        .splash {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #241a2c;
            border: 1px solid #d8c8bc;
        }
        .art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
        }
        .shade {
            position: absolute;
            inset: 42% 0 0;
            background: linear-gradient(0deg, rgba(18, 13, 24, .96), rgba(18, 13, 24, .7) 50%, transparent);
        }
        .brand {
            position: absolute;
            left: 27px;
            bottom: 25px;
            width: min(530px, calc(100% - 96px));
            text-shadow: 0 2px 9px rgba(0, 0, 0, .65);
        }
        h1 {
            margin: 0 0 5px;
            font: 500 24px/1.15 Georgia, "Times New Roman", serif;
            letter-spacing: .035em;
        }
        .project { margin: 0 0 10px; color: #e3d4d2; }
        .status { margin: 0; min-height: 20px; color: #fffaf6; }
        .spinner {
            display: inline-block;
            width: 11px;
            height: 11px;
            margin-right: 8px;
            border: 2px solid rgba(255, 247, 242, .38);
            border-right-color: #edb8b4;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            vertical-align: -1px;
        }
        .error {
            display: none;
            max-height: 118px;
            margin: 10px 0 0;
            overflow: auto;
            padding: 9px 10px;
            border: 1px solid rgba(237, 184, 180, .52);
            background: rgba(12, 9, 17, .86);
            color: #fff1ef;
            font: 12px/1.35 Consolas, monospace;
            user-select: text;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .actions { display: none; gap: 8px; margin-top: 10px; }
        button {
            min-height: 30px;
            padding: 5px 11px;
            border: 1px solid #ebdad0;
            border-right-color: #766470;
            border-bottom-color: #766470;
            background: #352838;
            color: #fff7f2;
            font: inherit;
            cursor: pointer;
        }
        button:hover { background: #493747; }
        button:focus-visible { outline: 2px solid #f0c2ae; outline-offset: 2px; }
        .copy-status { align-self: center; color: #e3d4d2; }
        .quit {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 29px;
            min-height: 29px;
            padding: 0;
            border: 1px solid rgba(255, 247, 242, .62);
            background: rgba(25, 17, 29, .64);
            font-size: 18px;
            line-height: 1;
        }
        .splash[data-state="error"] .error,
        .splash[data-state="error"] .actions { display: block; }
        .splash[data-state="error"] .actions { display: flex; }
        .splash[data-state="error"] .spinner { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <main id="splash" class="splash" data-state="loading" role="status" aria-live="polite" aria-busy="true">
        <img class="art" src="Assets/studio-boot-splash.png" alt="A dragon crosses the full moon above a ruined observatory and a group of travelers">
        <div class="shade" aria-hidden="true"></div>
        <button class="quit" id="quit" type="button" aria-label="Quit Studio" title="Quit Studio">×</button>
        <section class="brand">
            <h1 id="studio-name">Thestra Studio</h1>
            <p class="project" id="project-name">Project: Selecting Project…</p>
            <p class="status" id="status"><span class="spinner" aria-hidden="true"></span><span id="status-text">Opening Studio…</span></p>
            <pre class="error" id="error" tabindex="0"></pre>
            <div class="actions">
                <button id="reload" type="button">Reload Studio</button>
                <button id="copy" type="button">Copy details</button>
                <span class="copy-status" id="copy-status" aria-live="polite"></span>
            </div>
        </section>
    </main>
    <script>
        'use strict';
        (function () {
            const bridge = window.thestraBootSplash;
            const splash = document.getElementById('splash');
            function render(state) {
                if (!state || !splash) return;
                splash.dataset.state = state.state || 'loading';
                splash.setAttribute('aria-busy', state.state === 'loading' ? 'true' : 'false');
                splash.setAttribute('role', state.state === 'error' ? 'alert' : 'status');
                splash.setAttribute('aria-live', state.state === 'error' ? 'assertive' : 'polite');
                document.getElementById('studio-name').textContent = state.studioName || 'Studio';
                document.getElementById('project-name').textContent = 'Project: ' + (state.projectName || 'Project name unavailable');
                document.getElementById('status-text').textContent = state.status || '';
                document.getElementById('error').textContent = state.error || '';
            }
            if (bridge) {
                bridge.onState(render).catch(error => {
                    render({ state: 'error', error: error.message, status: 'Unable to connect to Studio startup.' });
                });
                document.getElementById('reload').addEventListener('click', () => bridge.reload());
                document.getElementById('copy').addEventListener('click', () => bridge.copyError().then(result => {
                    document.getElementById('copy-status').textContent = result.copied ? 'Copied' : 'No details to copy';
                }).catch(() => {
                    document.getElementById('copy-status').textContent = 'Could not copy details';
                }));
                document.getElementById('quit').addEventListener('click', () => bridge.quit());
            }
        }());
    </script>
</body>
</html>
