name: Render item cohort A-B comparison

on:
  push:
    branches:
      - agent/polygonal-item-cohort
    paths:
      - .github/workflows/polygonal-cohort-compare-artifact.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polygonal-item-cohort
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Render software comparison boards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math, zipfile

          root = Path.cwd()
          item_dir = root / "assets" / "models" / "items"
          out = root / "comparison-artifacts"
          out.mkdir(exist_ok=True)

          def load_mtl(path):
              mats, current = {}, None
              for line in path.read_text(encoding="utf-8").splitlines():
                  bits = line.split()
                  if not bits: continue
                  if bits[0] == "newmtl": current = bits[1]
                  elif bits[0] == "Kd" and current:
                      mats[current] = tuple(int(max(0,min(1,float(v))) * 255) for v in bits[1:4])
              return mats

          materials = {}
          materials.update(load_mtl(item_dir / "relic_showcase.mtl"))
          materials.update(load_mtl(item_dir / "polygonal_cohort.mtl"))

          def load_obj(path):
              verts, faces, mat = [], [], None
              for line in path.read_text(encoding="utf-8").splitlines():
                  bits = line.split()
                  if not bits: continue
                  if bits[0] == "v": verts.append(tuple(map(float,bits[1:4])))
                  elif bits[0] == "usemtl": mat = bits[1]
                  elif bits[0] == "f":
                      idx = [int(c.split('/')[0])-1 for c in bits[1:]]
                      for i in range(1,len(idx)-1): faces.append((idx[0],idx[i],idx[i+1],mat))
              return verts, faces

          def rotate(v,yaw,tilt):
              x,y,z=v; a=math.radians(yaw); b=math.radians(tilt)
              x,z=x*math.cos(a)+z*math.sin(a),-x*math.sin(a)+z*math.cos(a)
              y,z=y*math.cos(b)-z*math.sin(b),y*math.sin(b)+z*math.cos(b)
              return x,y,z

          def normal(a,b,c):
              u=tuple(b[i]-a[i] for i in range(3)); v=tuple(c[i]-a[i] for i in range(3))
              n=(u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0])
              L=math.sqrt(sum(q*q for q in n)) or 1
              return tuple(q/L for q in n)

          def render(path,yaw=24,tilt=16,size=220):
              verts,faces=load_obj(path); rv=[rotate(v,yaw,tilt) for v in verts]
              xs=[v[0] for v in rv]; ys=[v[1] for v in rv]
              cx=(min(xs)+max(xs))/2; cy=(min(ys)+max(ys))/2
              extent=max(max(xs)-min(xs),max(ys)-min(ys),1e-6); scale=size*.74/extent
              pts=[((x-cx)*scale+size/2,size/2-(y-cy)*scale,z) for x,y,z in rv]
              im=Image.new('RGB',(size,size),(23,23,27)); d=ImageDraw.Draw(im)
              light=(-.45,.55,.70); ll=math.sqrt(sum(q*q for q in light)); light=tuple(q/ll for q in light)
              tris=[]
              for ia,ib,ic,mat in faces:
                  n=normal(rv[ia],rv[ib],rv[ic])
                  if n[2]<0: n=tuple(-q for q in n)
                  lum=max(.26,min(1,.40+.60*sum(n[i]*light[i] for i in range(3))))
                  base=materials.get(mat,(150,150,150)); col=tuple(int(v*lum) for v in base)
                  z=sum(pts[i][2] for i in (ia,ib,ic))/3
                  tris.append((z,[pts[ia][:2],pts[ib][:2],pts[ic][:2]],col))
              for _,poly,col in sorted(tris,key=lambda t:t[0]): d.polygon(poly,fill=col)
              return im, len(verts), len(faces)

          pairs=[
              ("Forbidden Lamp","forbidden_lamp.obj","Gas Mask","gas_mask.obj","volume cage → layered face shell"),
              ("Town Portal","town_portal.obj","Silver Glasses","silver_glasses.obj","lathed rings → bar-built open frames"),
              ("Crossing Writ","crossing_writ.obj","Greatsword","greatsword.obj","flattened primitives → drawn extrusion"),
              ("Smoke Bell","smoke_bell.obj","Death Sickle","death_sickle.obj","continuous curve → faceted polyline arc"),
              ("Mourning Ribbon","mourning_ribbon.obj","Moth Cloak","moth_cloak.obj","squashed bands → explicit cloth plates"),
              ("First Scale","first_scale.obj","Angel Feather","angel_feather.obj","squashed lathe → layered organic vanes"),
              ("Bell Salt","bell_salt.obj","Mirror Armor","mirror_armor.obj","dense nested sculpture → layered hard surface"),
              ("Sealed Reliquary","sealed_reliquary.obj","Rear Mirror","rear_mirror.obj","ornate assembly → economical frame+plate"),
          ]

          W,H=1040,8*265+84
          board=Image.new('RGB',(W,H),(12,12,15)); d=ImageDraw.Draw(board)
          d.text((20,18),"BATCH A — semantic sculpture / lathed composition",fill=(238,238,242))
          d.text((535,18),"BATCH B — polygonal fabrication / drawn silhouettes",fill=(238,238,242))
          d.text((20,48),"same item viewer scale principle; software geometry render",fill=(150,150,160))
          for row,(an,af,bn,bf,theme) in enumerate(pairs):
              y=82+row*265
              ai,av,afa=render(item_dir/af); bi,bv,bfa=render(item_dir/bf)
              board.paste(ai,(20,y)); board.paste(bi,(535,y))
              d.text((250,y+28),an,fill=(235,235,235)); d.text((250,y+55),f"{av}v / {afa}f",fill=(160,160,170))
              d.text((765,y+28),bn,fill=(235,235,235)); d.text((765,y+55),f"{bv}v / {bfa}f",fill=(160,160,170))
              d.text((250,y+104),theme,fill=(190,170,120))
              d.line((20,y+245,1020,y+245),fill=(45,45,52))
          board.save(out/"batch-ab-comparison.png")

          b_items=[("Greatsword","greatsword.obj"),("Death Sickle","death_sickle.obj"),("Silver Glasses","silver_glasses.obj"),("Gas Mask","gas_mask.obj"),("Moth Cloak","moth_cloak.obj"),("Mirror Armor","mirror_armor.obj"),("Angel Feather","angel_feather.obj"),("Rear Mirror","rear_mirror.obj")]
          views=[(20,10),(110,10),(45,70),(45,-55)]
          cell=180; label=170; rowh=205
          sheet=Image.new('RGB',(label+4*cell,8*rowh+42),(14,14,17)); sd=ImageDraw.Draw(sheet)
          for c,t in enumerate(["3/4","side","top","underside"]): sd.text((label+c*cell+60,14),t,fill=(210,210,215))
          for r,(name,fn) in enumerate(b_items):
              y=42+r*rowh; sd.text((10,y+82),name,fill=(235,235,235))
              for c,(yaw,tilt) in enumerate(views):
                  im,_,_=render(item_dir/fn,yaw,tilt,cell); sheet.paste(im,(label+c*cell,y))
          sheet.save(out/"batch-b-four-angle.png")

          source_files=[
              "forbidden_lamp.obj","town_portal.obj","crossing_writ.obj","smoke_bell.obj","mourning_ribbon.obj","first_scale.obj","bell_salt.obj","sealed_reliquary.obj","relic_showcase.mtl",
              "greatsword.obj","death_sickle.obj","silver_glasses.obj","gas_mask.obj","moth_cloak.obj","mirror_armor.obj","angel_feather.obj","rear_mirror.obj","polygonal_cohort.mtl",
          ]
          with zipfile.ZipFile(out/"batch-ab-models.zip","w",zipfile.ZIP_DEFLATED) as z:
              for f in source_files: z.write(item_dir/f,arcname=f)
              for f in [root/"tools/asset-production/build_relic_showcase.py",root/"tools/asset-production/build_polygonal_item_cohort.py",root/"tools/asset-production/poly_parts.py"]:
                  z.write(f,arcname=f.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: item-cohort-ab-comparison
          path: comparison-artifacts/
          retention-days: 7
