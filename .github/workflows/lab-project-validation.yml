name: lab project validation

on:
  pull_request:
    paths:
      - "projects/labs/**"
      - "conf.lua"
      - "tools/labs/**"
      - "docs/agentic/PLAYABLE-GAME-EVIDENCE.md"
      - ".github/workflows/lab-project-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-lab-projects:
    name: discover lab Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Discover runnable lab Projects
        id: projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t names < <(
            find projects/labs -mindepth 1 -maxdepth 1 -type d \
              -exec test -d '{}/data' ';' -printf '%f\n' | sort
          )
          if [ "${#names[@]}" -eq 0 ]; then
            echo "No projects/labs/* Project roots found" >&2
            exit 1
          fi
          projects="$(printf '%s\n' "${names[@]}" | jq -R -s -c 'split("\n")[:-1]')"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Lab Project matrix: $projects"

  validate-lab-project:
    name: ${{ matrix.project }} — validate + boot + review
    needs: discover-lab-projects
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-lab-projects.outputs.projects) }}

    env:
      SDL_AUDIODRIVER: dummy
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"
      THESTRA_LAB_PROJECT_NAME: ${{ matrix.project }}

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE
        # Version, URL and digest live in the action, not here (#725).
        timeout-minutes: 3
        uses: ./.github/actions/install-love
        with:
          # this workflow invokes `lovec` bare
          add-to-path: "true"
      - name: Install Mesa software OpenGL 26.1.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa archive digest mismatch: $sha" }
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found in Mesa archive" }
          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force

      - name: Prove CI runtime errors fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = Join-Path $env:RUNNER_TEMP "thestra-error-probe"
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          Copy-Item "conf.lua" (Join-Path $probe "conf.lua") -Force
          Set-Content -Path (Join-Path $probe "main.lua") -Value 'function love.load() error("intentional CI error-handler probe") end' -Encoding utf8
          $stdout = Join-Path $probe "stdout.txt"
          $stderr = Join-Path $probe "stderr.txt"
          $env:THESTRA_CI_FAIL_ON_ERROR = "1"
          Push-Location $probe
          try {
            & $env:LOVEC "." 1> $stdout 2> $stderr
            $exitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
            Remove-Item Env:THESTRA_CI_FAIL_ON_ERROR -ErrorAction SilentlyContinue
          }
          $combined = ((Get-Content -Raw $stdout -ErrorAction SilentlyContinue) + "`n" + (Get-Content -Raw $stderr -ErrorAction SilentlyContinue))
          Write-Host $combined
          if ($exitCode -eq 0) { throw "CI error-handler probe unexpectedly exited 0" }
          if ($combined -notmatch "THESTRA RUNTIME ERROR") { throw "CI error-handler probe did not emit the fail-closed marker" }
          Write-Host "FAIL-CLOSED ERROR HANDLER OK"
          $global:LASTEXITCODE = 0

      - name: Stage, validate, capture, and boot lab Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $repoRoot = (Get-Location).Path
          $project = Get-Item (Join-Path $repoRoot ("projects\labs\" + $env:THESTRA_LAB_PROJECT_NAME))
          if (-not (Test-Path (Join-Path $project.FullName "data"))) {
            throw "matrix entry is not a lab Project root: $($project.FullName)"
          }

          $artifactRoot = Join-Path $repoRoot ("artifacts\lab-review\" + $project.Name)
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null

          function Write-ProcessEvidence {
            param(
              [string]$Stdout,
              [string]$Stderr
            )
            if (Test-Path $Stdout) { Get-Content -Raw $Stdout | Write-Host }
            if (Test-Path $Stderr) { Get-Content -Raw $Stderr | Write-Host }
          }

          function Run-LoveBounded {
            param(
              [Parameter(Mandatory=$true)][string]$Stage,
              [Parameter(Mandatory=$true)][string[]]$LoveArgs,
              [Parameter(Mandatory=$true)][string]$Label,
              [Parameter(Mandatory=$true)][int]$TimeoutMs,
              [Parameter(Mandatory=$true)][string]$Stdout,
              [Parameter(Mandatory=$true)][string]$Stderr
            )
            $argumentList = @(".") + $LoveArgs
            $env:THESTRA_CI_FAIL_ON_ERROR = "1"
            try {
              $process = Start-Process -FilePath $env:LOVEC -ArgumentList $argumentList -WorkingDirectory $Stage -PassThru -RedirectStandardOutput $Stdout -RedirectStandardError $Stderr
              if (-not $process.WaitForExit($TimeoutMs)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                $process.WaitForExit()
                Write-ProcessEvidence -Stdout $Stdout -Stderr $Stderr
                throw "$Label timed out after $([math]::Round($TimeoutMs / 1000))s for $($project.FullName)"
              }
              if ($process.ExitCode -ne 0) {
                Write-ProcessEvidence -Stdout $Stdout -Stderr $Stderr
                throw "$Label failed (exit $($process.ExitCode)) for $($project.FullName)"
              }
              return $process.ExitCode
            }
            finally {
              Remove-Item Env:THESTRA_CI_FAIL_ON_ERROR -ErrorAction SilentlyContinue
            }
          }

          function Run-Preview {
            param(
              [Parameter(Mandatory=$true)][string]$Stage,
              [Parameter(Mandatory=$true)][string[]]$PreviewArgs,
              [Parameter(Mandatory=$true)][string]$Raw,
              [Parameter(Mandatory=$true)][string]$Png
            )
            $stderr = "$Raw.stderr"
            Run-LoveBounded -Stage $Stage -LoveArgs $PreviewArgs -Label ("preview " + ($PreviewArgs -join " ")) -TimeoutMs 30000 -Stdout $Raw -Stderr $stderr | Out-Null
            python tools/labs/decode-project-preview.py --input $Raw --output $Png
            if ($LASTEXITCODE -ne 0) {
              Write-ProcessEvidence -Stdout $Raw -Stderr $stderr
              throw "preview decode failed: $($PreviewArgs -join ' ')"
            }
          }

          Write-Host "=== $($project.FullName) ==="
          npm.cmd run project -- info $project.FullName --json
          if ($LASTEXITCODE -ne 0) { throw "Project info failed for $($project.FullName)" }

          $readme = Join-Path $project.FullName "README.md"
          if (-not (Test-Path $readme)) { throw "lab Project has no human-readable README: $($project.FullName)" }
          if ($project.Name -ne "scene-benchmarks") {
            $readmeText = Get-Content -Raw $readme
            if ($readmeText -notmatch "(?im)^## .*Walkthrough") {
              throw "game-sized lab Project README must contain a Walkthrough section: $($project.FullName)"
            }
          }

          $marker = Join-Path $env:RUNNER_TEMP ("stage-" + $project.Name + ".txt")
          $env:THESTRA_LAB_PROJECT = $project.FullName
          $env:THESTRA_STAGE_MARKER = $marker
          node -e "const fs=require('fs'); const path=require('path'); const play=require('./tools/editor/project-play'); const stage=play.stageProject({installRoot:process.cwd(), projectRoot:path.resolve(process.env.THESTRA_LAB_PROJECT)}); fs.writeFileSync(process.env.THESTRA_STAGE_MARKER, stage, 'utf8');"
          if ($LASTEXITCODE -ne 0) { throw "staging failed for $($project.FullName)" }
          $stage = (Get-Content -Raw $marker).Trim()
          if (-not (Test-Path $stage)) { throw "stage path missing: $stage" }

          $boot = $null
          try {
            $validateOut = Join-Path $env:RUNNER_TEMP ("validate-" + $project.Name + ".out.txt")
            $validateErr = Join-Path $env:RUNNER_TEMP ("validate-" + $project.Name + ".err.txt")
            Run-LoveBounded -Stage $stage -LoveArgs @("validate") -Label "validate" -TimeoutMs 60000 -Stdout $validateOut -Stderr $validateErr | Out-Null
            $validateCombined = ((Get-Content -Raw $validateOut -ErrorAction SilentlyContinue) + "`n" + (Get-Content -Raw $validateErr -ErrorAction SilentlyContinue))
            Write-Host $validateCombined
            if ($validateCombined -notmatch "VALIDATE OK") {
              throw "validate exited 0 without VALIDATE OK for $($project.FullName)"
            }

            $sceneIndexPath = Join-Path $project.FullName "data\scenes\index.json"
            if (Test-Path $sceneIndexPath) {
              $sceneIndex = Get-Content -Raw $sceneIndexPath | ConvertFrom-Json
              foreach ($file in $sceneIndex.files) {
                $scenePath = Join-Path (Split-Path $sceneIndexPath) $file
                $scene = Get-Content -Raw $scenePath | ConvertFrom-Json
                $id = [string]$scene.id
                if ($scene.draw -eq "windows") {
                  $safe = $id -replace '[^A-Za-z0-9._-]', '_'
                  $raw = Join-Path $env:RUNNER_TEMP ("preview-scene-" + $project.Name + "-" + $safe + ".txt")
                  $png = Join-Path $artifactRoot ("scenes\" + $safe + ".png")
                  Run-Preview -Stage $stage -PreviewArgs @("preview-scene", $id) -Raw $raw -Png $png
                } elseif ($scene.draw -eq "world") {
                  Write-Host "SKIP STANDALONE WORLD SCENE PREVIEW $id (world=$($scene.world)); world evidence is captured through preview-map with a loaded session"
                } else {
                  Write-Host "SKIP STANDALONE SCENE PREVIEW $id (draw=$($scene.draw))"
                }
              }
            }

            $mapIndexPath = Join-Path $project.FullName "data\maps\index.json"
            if (Test-Path $mapIndexPath) {
              $mapIndex = Get-Content -Raw $mapIndexPath | ConvertFrom-Json
              foreach ($file in $mapIndex.files) {
                $mapPath = Join-Path (Split-Path $mapIndexPath) $file
                $map = Get-Content -Raw $mapPath | ConvertFrom-Json
                $id = [string]$map.id
                $safe = $id -replace '[^A-Za-z0-9._-]', '_'
                $raw = Join-Path $env:RUNNER_TEMP ("preview-map-" + $project.Name + "-" + $safe + ".txt")
                $png = Join-Path $artifactRoot ("maps\" + $safe + ".png")
                Run-Preview -Stage $stage -PreviewArgs @("preview-map", $id) -Raw $raw -Png $png
              }
            }

            if (-not (Get-ChildItem -Path $artifactRoot -Recurse -Filter "*.png" -ErrorAction SilentlyContinue)) {
              throw "lab Project produced no review PNGs: $($project.FullName)"
            }

            $stdout = Join-Path $env:RUNNER_TEMP ("boot-" + $project.Name + ".out.txt")
            $stderr = Join-Path $env:RUNNER_TEMP ("boot-" + $project.Name + ".err.txt")
            $env:THESTRA_CI_FAIL_ON_ERROR = "1"
            $boot = Start-Process -FilePath $env:LOVEC -ArgumentList "." -WorkingDirectory $stage -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 4
            if ($boot.HasExited) {
              Write-ProcessEvidence -Stdout $stdout -Stderr $stderr
              throw "staged game exited during fail-closed boot smoke for $($project.FullName) (exit $($boot.ExitCode))"
            }
            Stop-Process -Id $boot.Id -Force
            $boot.WaitForExit()
            Remove-Item Env:THESTRA_CI_FAIL_ON_ERROR -ErrorAction SilentlyContinue
            Write-Host "BOOT SMOKE OK $($project.FullName)"
          }
          finally {
            Remove-Item Env:THESTRA_CI_FAIL_ON_ERROR -ErrorAction SilentlyContinue
            if ($boot -and -not $boot.HasExited) {
              Stop-Process -Id $boot.Id -Force -ErrorAction SilentlyContinue
            }
            if ($stage -and (Test-Path $stage)) {
              Push-Location $repoRoot
              try {
                node -e "require('./tools/editor/project-play').removeStage(process.argv[1])" "$stage"
              }
              finally {
                Pop-Location
              }
            }
          }

      - name: Upload lab review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-project-review-${{ matrix.project }}
          path: artifacts/lab-review/${{ matrix.project }}
          if-no-files-found: warn
          retention-days: 14