# Temporary bootstrap for #772; remove after the one-time host cutover lands.
name: Shared semantics bootstrap

on:
  pull_request:
    paths:
      - 'shared/semantics/**'
      - 'tools/shared-semantics/**'
      - 'engine/vertex_shading.lua'
      - 'presentation/sprite_sheet.lua'
      - 'tools/editor/js/vertex-shading.js'
      - '.github/workflows/shared-semantics-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned build-only compilers
        shell: pwsh
        working-directory: tools/shared-semantics
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate host artifacts
        shell: pwsh
        working-directory: tools/shared-semantics
        run: npm run build

      - name: Apply one-time Studio timing host cutover
        shell: pwsh
        run: node tools/shared-semantics/patch-hosts.js

      - name: Commit one-time outputs to experiment branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/generated tools/editor/js/generated tools/editor/index.html tools/editor/js/widgets.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore(#772): cut over Studio sprite timing semantics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload generated proof
        uses: actions/upload-artifact@v4
        with:
          name: shared-semantics-bootstrap
          if-no-files-found: error
          path: |
            engine/generated/vertex-shading.lua
            engine/generated/sprite-timing.lua
            tools/editor/js/generated/vertex-shading.js
            tools/editor/js/generated/vertex-shading.js.map
            tools/editor/js/generated/sprite-timing.js
            tools/editor/js/generated/sprite-timing.js.map
            tools/shared-semantics/package-lock.json
