name: love12-pixel-control

on:
  push:
    branches: [agent/issue-246-love12-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LOVE11_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
      LOVE11_SHA256: BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369
      LOVE12_URL: https://nightly.link/love2d/love/actions/runs/31261258544/love-windows-x64.zip
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
      MESA_SHA256: 86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $love11Zip = Join-Path $env:RUNNER_TEMP 'love11.zip'
          Invoke-WebRequest -Uri $env:LOVE11_URL -OutFile $love11Zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $love11Zip -Algorithm SHA256).Hash
          if ($sha -ne $env:LOVE11_SHA256) { throw "LOVE 11.5 digest mismatch: $sha" }
          $love11Root = Join-Path $env:RUNNER_TEMP 'love11'
          Expand-Archive $love11Zip $love11Root -Force
          $love11 = Get-ChildItem $love11Root -Recurse -Filter lovec.exe | Select-Object -First 1

          $love12Outer = Join-Path $env:RUNNER_TEMP 'love12-artifact.zip'
          Invoke-WebRequest -Uri $env:LOVE12_URL -OutFile $love12Outer -MaximumRetryCount 3 -RetryIntervalSec 5
          $love12OuterRoot = Join-Path $env:RUNNER_TEMP 'love12-artifact'
          Expand-Archive $love12Outer $love12OuterRoot -Force
          $love12Inner = Get-ChildItem $love12OuterRoot -Filter 'love-12.0-win64.zip' | Select-Object -First 1
          if (-not $love12Inner) { throw 'LOVE 12 inner runtime ZIP not found' }
          $love12Root = Join-Path $env:RUNNER_TEMP 'love12'
          Expand-Archive $love12Inner.FullName $love12Root -Force
          $love12 = Get-ChildItem $love12Root -Recurse -Filter lovec.exe | Select-Object -First 1
          if (-not $love11 -or -not $love12) { throw 'runtime install incomplete' }

          "LOVE11=$($love11.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE11_EXE=$(Join-Path $love11.DirectoryName 'love.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE11_DIR=$($love11.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12=$($love12.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12_EXE=$(Join-Path $love12.DirectoryName 'love.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE12_DIR=$($love12.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host (& $love11.FullName --version 2>&1 | Out-String).Trim()
          Write-Host (& $love12.FullName --version 2>&1 | Out-String).Trim()

      - name: Install identical Mesa beside both runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($sha -ne $env:MESA_SHA256) { throw "Mesa digest mismatch: $sha" }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x $archive "-o$mesa" -y | Out-Null
          $dll = Get-ChildItem $mesa -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { throw 'Mesa x64 opengl32.dll not found' }
          foreach ($dir in @($env:LOVE11_DIR, $env:LOVE12_DIR)) {
            Copy-Item (Join-Path $dll.DirectoryName '*.dll') $dir -Force
          }
          python -m pip install --disable-pip-version-check pillow websocket-client

      - name: G5 pixel-level comparison with 11.5 repeat control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $c11a = Join-Path $env:RUNNER_TEMP 'classic11a.txt'
          $c11b = Join-Path $env:RUNNER_TEMP 'classic11b.txt'
          $c12  = Join-Path $env:RUNNER_TEMP 'classic12.txt'
          $w11a = Join-Path $env:RUNNER_TEMP 'wide11a.txt'
          $w11b = Join-Path $env:RUNNER_TEMP 'wide11b.txt'
          $w12  = Join-Path $env:RUNNER_TEMP 'wide12.txt'
          & $env:LOVE11 . screenshots | Out-File $c11a -Encoding utf8
          & $env:LOVE11 . screenshots | Out-File $c11b -Encoding utf8
          & $env:LOVE12 . screenshots | Out-File $c12 -Encoding utf8
          & $env:LOVE11 . surface=wide screenshots | Out-File $w11a -Encoding utf8
          & $env:LOVE11 . surface=wide screenshots | Out-File $w11b -Encoding utf8
          & $env:LOVE12 . surface=wide screenshots | Out-File $w12 -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'G5 capture failed' }

          $env:C11A=$c11a; $env:C11B=$c11b; $env:C12=$c12
          $env:W11A=$w11a; $env:W11B=$w11b; $env:W12=$w12
          @'
          import base64, io, json, os
          from PIL import Image
          BEGIN='SCREENSHOTS BEGIN'; END='SCREENSHOTS END'
          def load(path):
              text=open(path,encoding='utf-8-sig',errors='replace').read()
              data=json.loads(text[text.index(BEGIN)+len(BEGIN):text.index(END)].strip())
              return {c['path']:base64.b64decode(c['image']) for c in data['captures']}
          def metrics(label, pa, pb):
              A,B=load(pa),load(pb); paths=sorted(set(A)|set(B))
              byte_diff=0; pixel_diff=[]; changed_pixels=0; total_pixels=0
              for p in paths:
                  a,b=A.get(p),B.get(p)
                  if a != b: byte_diff += 1
                  if a is None or b is None:
                      pixel_diff.append(p); continue
                  ia=Image.open(io.BytesIO(a)).convert('RGBA'); ib=Image.open(io.BytesIO(b)).convert('RGBA')
                  if ia.size != ib.size:
                      pixel_diff.append(p); continue
                  total_pixels += ia.width*ia.height
                  if ia.tobytes() != ib.tobytes():
                      pixel_diff.append(p)
                      changed_pixels += sum(1 for aa,bb in zip(ia.getdata(),ib.getdata()) if aa != bb)
              print(f'METRIC {label}: byte_diff={byte_diff}/{len(paths)} pixel_diff={len(pixel_diff)}/{len(paths)} changed_pixels={changed_pixels}/{total_pixels}')
              if pixel_diff:
                  print('  pixel-different frames:')
                  for p in pixel_diff: print('    '+p)
          metrics('classic 11.5 repeat', os.environ['C11A'], os.environ['C11B'])
          metrics('classic 11.5 vs 12', os.environ['C11A'], os.environ['C12'])
          metrics('wide 11.5 repeat', os.environ['W11A'], os.environ['W11B'])
          metrics('wide 11.5 vs 12', os.environ['W11A'], os.environ['W12'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'G5 pixel comparison failed' }

      - name: G6 pixel-level comparison with 11.5 repeat control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo11a = Join-Path $env:RUNNER_TEMP 'repo-editor-11a'
          $repo11b = Join-Path $env:RUNNER_TEMP 'repo-editor-11b'
          $repo12  = Join-Path $env:RUNNER_TEMP 'repo-editor-12'
          Copy-Item . $repo11a -Recurse
          Copy-Item . $repo11b -Recurse
          Copy-Item . $repo12 -Recurse
          foreach ($repo in @($repo11a,$repo11b,$repo12)) {
            Remove-Item (Join-Path $repo 'tools/golden/editor-screens') -Recurse -Force -ErrorAction SilentlyContinue
          }
          Push-Location $repo11a; $env:LOVE_PATH=$env:LOVE11_EXE; python tools/golden/editor-screens.py capture; if ($LASTEXITCODE -ne 0) { Pop-Location; throw '11a capture failed' }; Pop-Location
          Push-Location $repo11b; $env:LOVE_PATH=$env:LOVE11_EXE; python tools/golden/editor-screens.py capture; if ($LASTEXITCODE -ne 0) { Pop-Location; throw '11b capture failed' }; Pop-Location
          Push-Location $repo12;  $env:LOVE_PATH=$env:LOVE12_EXE; python tools/golden/editor-screens.py capture; if ($LASTEXITCODE -ne 0) { Pop-Location; throw '12 capture failed' }; Pop-Location

          $env:E11A=(Join-Path $repo11a 'tools/golden/editor-screens')
          $env:E11B=(Join-Path $repo11b 'tools/golden/editor-screens')
          $env:E12=(Join-Path $repo12 'tools/golden/editor-screens')
          @'
          import os
          from PIL import Image
          def files(root):
              out={}
              for base,_,names in os.walk(root):
                  for n in names:
                      if n.endswith('.png'):
                          p=os.path.join(base,n); out[os.path.relpath(p,root).replace('\\','/')]=p
              return out
          def metrics(label, ra, rb):
              A,B=files(ra),files(rb); paths=sorted(set(A)|set(B))
              byte_diff=0; pixel_diff=[]; changed_pixels=0; total_pixels=0
              for p in paths:
                  if p not in A or p not in B:
                      pixel_diff.append(p); continue
                  ba=open(A[p],'rb').read(); bb=open(B[p],'rb').read()
                  if ba != bb: byte_diff += 1
                  ia=Image.open(A[p]).convert('RGBA'); ib=Image.open(B[p]).convert('RGBA')
                  if ia.size != ib.size:
                      pixel_diff.append(p); continue
                  total_pixels += ia.width*ia.height
                  if ia.tobytes() != ib.tobytes():
                      pixel_diff.append(p)
                      changed_pixels += sum(1 for aa,bb in zip(ia.getdata(),ib.getdata()) if aa != bb)
              print(f'METRIC {label}: byte_diff={byte_diff}/{len(paths)} pixel_diff={len(pixel_diff)}/{len(paths)} changed_pixels={changed_pixels}/{total_pixels}')
              if pixel_diff:
                  print('  pixel-different frames:')
                  for p in pixel_diff: print('    '+p)
          metrics('editor 11.5 repeat', os.environ['E11A'], os.environ['E11B'])
          metrics('editor 11.5 vs 12', os.environ['E11A'], os.environ['E12'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'G6 pixel comparison failed' }

      - name: Assert tracked tree unchanged
        shell: pwsh
        run: |
          git diff --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'probe modified tracked files' }
