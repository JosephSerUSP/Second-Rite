name: Refresh 656 onto current main

on:
  push:
    branches:
      - agent/relative-visual-ab-on-prs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relative-visual-ab-on-prs
          fetch-depth: 0
      - name: Merge current main without conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Commit merge and remove temporary refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/branch-refresh-656-current-main.yml
          git add -A
          git commit -m "Merge current main into advisory relative visual PR"
          git push origin HEAD:agent/relative-visual-ab-on-prs
