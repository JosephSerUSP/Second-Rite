name: Apply issue 199 visual invariant fixups

on:
  push:
    branches:
      - agent/issue-199-expanded-render-surface
    paths:
      - tools/issue199_fixup.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-199-expanded-render-surface
          fetch-depth: 0
      - run: python tools/issue199_fixup.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve canonical pixel phase in wide mode"
          git push origin HEAD:agent/issue-199-expanded-render-surface
