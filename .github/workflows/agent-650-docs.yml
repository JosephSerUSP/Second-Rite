name: agent 650 docs

on:
  push:
    branches:
      - docs/650-correct-live-status-claims

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact status wording corrections
        run: |
          python tools/ci/_agent_650_docs.py
          git diff --check
          grep -Fq "still under active design in #372 and #373" "docs/game design/Summoner.md"
          grep -Fq "In the intended numeric model" docs/design/combat-state-resources.md
      - name: Commit result and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/combat-state-resources.md "docs/game design/Summoner.md"
          git rm .github/workflows/agent-650-docs.yml tools/ci/_agent_650_docs.py
          git commit -m "Correct stale design-status claims"
          git push origin HEAD:docs/650-correct-live-status-claims
