name: issue410-fix-local-lifetime

on:
  push:
    branches:
      - issue-410-state-owner-substrate
    paths:
      - .github/workflows/issue410-fix-local-lifetime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-410-state-owner-substrate
      - name: Apply local-lifetime patch
        run: python .github/issue410-local-lifetime-patch.py
      - name: Verify transformed source
        run: |
          grep -F '_completedImmediateLocals' runtime/engine/interpreter.lua
          grep -F 'independent immediate executions receive fresh process-local state' tests/test_game_variables.lua
      - name: Commit source changes and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue410-fix-local-lifetime.yml .github/issue410-local-lifetime-patch.py
          git add runtime/engine/interpreter.lua tests/test_game_variables.lua
          git commit -m "fix: enforce invocation-local lifetime for SET_LOCAL"
          git push origin HEAD:issue-410-state-owner-substrate
