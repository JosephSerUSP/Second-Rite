name: studio host

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    name: branded development host (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out implementation branch for one-time icon repair
        uses: actions/checkout@v4
        with:
          ref: agent/258-branded-windows-launcher
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned npm dependencies
        shell: pwsh
        run: npm ci

      - name: Regenerate deterministic icon containers from #357 inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run icons
          if ($LASTEXITCODE -ne 0) { throw "icon rebuild failed (exit $LASTEXITCODE)" }
          npm run icons:check
          if ($LASTEXITCODE -ne 0) { throw "icon currentness check failed (exit $LASTEXITCODE)" }
          npm run test:icons
          if ($LASTEXITCODE -ne 0) { throw "icon tests failed (exit $LASTEXITCODE)" }

      - name: Commit only regenerated containers when main's binaries drifted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'tools/editor/Assets/icons/thestra-studio/icon.ico',
            'tools/editor/Assets/icons/thestra-studio/icon.icns'
          )
          git diff --quiet -- @paths
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Tracked icon containers are already current.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $paths
          git commit -m 'Refresh deterministic Thestra Studio icon containers' -m 'Generated only by the merged #357 tooling from the existing owner-authored optical PNG inputs; no PNG artwork was modified.' -m 'Agent-Signature: platform=ChatGPT; model=GPT-5.6 Sol; role=implementation; task=#258; base=fd284a222a06d1fc8120905b7d9fbd2b8ab48251'
          git push origin HEAD:agent/258-branded-windows-launcher
